# =============================================================================
#  COLE ESTE CONTEÚDO em:  .github/workflows/emu-test-arm64.yml
#  (substituindo TODO o conteúdo atual do arquivo)
# -----------------------------------------------------------------------------
#  Dois jobs:
#   - x86_64  : ubuntu-latest TEM /dev/kvm -> emulador boota em ~2-5 min (rápido,
#               confiável). O APK tem libs nativas x86_64, então roda igual.
#   - arm64   : macos-14 (Apple Silicon). Sem HVF (VM sem virtualização aninhada)
#               o boot é por software e muito lento; roda em paralelo e registra
#               todo o progresso em evidence/ para diagnóstico.
# =============================================================================
name: emu-test-arm64

on:
  workflow_dispatch:
  push:
    branches: [arena/01a077ef-5]

permissions:
  contents: write

jobs:
  x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a077ef-5

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Emulador x86_64 (KVM) + testes do APK real
        run: bash .github/emu-test-x86.sh

      - name: Upload evidencias (logcat + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-x86-evidence
          path: evidence/
          if-no-files-found: ignore

      - name: Publicar evidencias (branch evidence-x86)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f evidence 2>/dev/null || true
          git commit -m "evidence x86 $(date -u +%Y%m%d%H%M%S)" 2>/dev/null || true
          git push origin HEAD:evidence-x86 --force 2>/dev/null || true

  arm64:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/01a077ef-5

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Emulador ARM64 + testes do APK real
        run: bash .github/emu-test-arm64.sh

      - name: Upload evidencias (logcat + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emu-arm64-evidence
          path: evidence/
          if-no-files-found: ignore

      - name: Publicar evidencias (branch evidence-arm64)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f evidence 2>/dev/null || true
          git commit -m "evidence arm64 $(date -u +%Y%m%d%H%M%S)" 2>/dev/null || true
          git push origin HEAD:evidence-arm64 --force 2>/dev/null || true
