name: Deliver verified tokens per second APK
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/speed-deliver.yml, .delivery/speed-acceptance.json]
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    if: ${{ contains(github.event.head_commit.message, '[speed publish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify real benchmark, reviewed UI, signature and public APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Enzo-cyber2025/5
        run: bash ci/log_step.sh speed-delivery bash ci/deliver_speed.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-delivery-verification
          path: .cache/ci-logs/
