name: Signed APK Gemma 3 270M Android acceptance
on:
  push:
    branches: [arena/10b3367a-5]
    paths:
      - '.github/workflows/gemma3-270m-android.yml'
      - 'scripts/test_gemma3_270m_android.py'
      - 'scripts/test_android.py'
      - 'scripts/android_checks.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact signed APK and pinned real GGUF
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --location --retry 3 --max-time 300 \
            'https://github.com/Enzo-cyber2025/5/releases/download/gguf-gemma4-ca7d8f1/GGUF-Chat-mobile.apk' \
            -o .cache/GGUF-Chat-mobile.apk
          curl --fail --location --retry 3 --max-time 900 \
            'https://github.com/cdracars/gemma-3-270m-it-gguf-mirror/releases/download/upstream-d156a5159f2f79c1b1d53c7c1cc20f1ff28ab8d00f17a292620aad13399b9698/gemma-3-270m-it-Q8_0.gguf' \
            -o .cache/gemma-3-270m-it-Q8_0.gguf
          echo 'f228a5d150348da37b365de541c99021b06fcb4eaa2713712cae816f0c10dbbc  .cache/GGUF-Chat-mobile.apk' | sha256sum --check
          echo 'd156a5159f2f79c1b1d53c7c1cc20f1ff28ab8d00f17a292620aad13399b9698  .cache/gemma-3-270m-it-Q8_0.gguf' | sha256sum --check
      - name: Allow KVM for disposable emulator
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: python3 scripts/test_gemma3_270m_android.py
      - name: Publish concise result in the job summary
        if: always()
        run: |
          {
            echo '## Gemma 3 270M Android inference'
            if test -f evidence/summary.json; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('evidence/summary.json').read_text())
          print(f"- **Status:** {report.get('status')}")
          print(f"- **Model:** {report.get('model', {}).get('asset')} ({report.get('model', {}).get('quantization')})")
          print(f"- **Architecture:** {report.get('model', {}).get('architecture')}")
          print(f"- **Reply:** {report.get('response_quality', {}).get('arithmetic_2_plus_2', {}).get('response', 'not available')}")
          print(f"- **Error:** {report.get('error', 'none')}")
          PY
              cat evidence/summary.json
            else
              echo 'No test summary was produced; inspect the failed emulator step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist concise result for API-readable audit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-results
          if ! test -f evidence/summary.json; then
            printf '{"status":"NO_TEST_SUMMARY","run_id":"%s","note":"Android runner ended before the test script wrote its report."}\n' "$GITHUB_RUN_ID" > evidence-summary.json
            report=evidence-summary.json
          else
            report=evidence/summary.json
          fi
          encoded="$(base64 -w 0 "$report")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/ci-results/gemma3-270m-${GITHUB_RUN_ID}.json" \
            -f message="Record Gemma 3 270M Android run ${GITHUB_RUN_ID}" \
            -f content="$encoded" \
            -f branch="$GITHUB_REF_NAME"
      - name: Upload complete Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma3-270m-android-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
