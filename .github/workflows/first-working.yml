name: First accepted mobile APK versus exact delivered APK
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/first-working.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: first-working-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: ${{ contains(github.event.head_commit.message, '[first working]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recover exact first accepted APK without rebuilding or resigning
        run: |
          mkdir -p .cache evidence
          git fetch --depth=1 origin 2ae661f530f96e65730d02dfc5d63a6db3743ac4
          git show 2ae661f530f96e65730d02dfc5d63a6db3743ac4:.delivery/GGUF-Chat-mobile.apk > .cache/first-working.apk
          echo '409985de54388cbcb1429a8db4cd26139cc47a5764864c6cd4b408c75f07099f  .cache/first-working.apk' | sha256sum -c -
          echo 'bd7c45d3c9b80ee583e0d4102595c5ed55242c37aa0394f0befe093c07fd88d2  entrega/GGUF-Chat-acelerado.apk' | sha256sum -c -
      - name: Exact fixtures and emulator prerequisites
        run: |
          mkdir -p evidence
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt numpy==2.2.6 tqdm==4.67.1 pyyaml==6.0.2
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp .cache/llama-mobile
          test "$(git -C .cache/llama-mobile rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          bash ci/mobile-models.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          bash scripts/build_test_input.sh
          sudo chmod a+rw /dev/kvm
          bash ci/prepare_vulkan.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GGUF_MOBILE_VULKAN: '1'
          GGUF_TEST_APK: entrega/GGUF-Chat-acelerado.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu host -feature Vulkan -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash ci/log_step.sh emulator .venv/bin/python scripts/test_first_working_android.py ${{ matrix.backend }}
      - name: Independent direct-comparison evaluation
        run: python3 ci/evaluate_first_working.py evidence/summary.json > evidence/physical-first-comparison.json
      - name: Publish bounded paired results, including non-approval
        if: always()
        env:
          GGUF_EVIDENCE_VARIANT: first-working-${{ matrix.backend }}
        run: bash ci/log_step.sh publish bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-working-${{ matrix.backend }}-evidence
          path: evidence/
