name: flcodes emulator

# Runs the no-root acquisition against a real Android device: an x86_64
# emulator booted with KVM on a GitHub runner. There is no QEMU/emulator in the
# development sandbox, so this is where the device side actually gets proven.
#
# The test app (built here, tools/build_test_apk.sh) declares
# android:allowBackup="true" and writes a Family Link shaped config into its own
# SharedPreferences. Everything after that is the production path:
#   flcodes device info -> device apk -> apk scan -> device backup -> abe scan
permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  push:
    paths:
      - 'family-link-codes/**'
      - 'tests/test_flcodes_*.py'
      - '.github/workflows/flcodes-emulator.yml'
  pull_request:
    paths:
      - 'family-link-codes/**'
      - 'tests/test_flcodes_*.py'
      - '.github/workflows/flcodes-emulator.yml'
  workflow_dispatch:

concurrency:
  group: flcodes-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (no device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet pytest cryptography
      - name: Algorithm, cipher, containers, extraction
        run: .venv/bin/python -m pytest -q tests/test_flcodes_codes.py tests/test_flcodes_crypto.py tests/test_flcodes_rea.py tests/test_flcodes_abe.py tests/test_flcodes_endpoints.py tests/test_flcodes_verify.py
      - name: CLI, web UI and the device workflow (stubbed adb)
        run: .venv/bin/python -m pytest -q tests/test_flcodes_cli.py tests/test_flcodes_device.py
      - name: Self check and demo
        run: |
          cd family-link-codes
          export PYTHONPATH="$PWD" FLCODES_HOME="$RUNNER_TEMP/flhome" FLCODES_PASSPHRASE=demo
          python3 -m flcodes audit
          bash demo/run_demo.sh

  emulator:
    name: Android emulator (QEMU), selftest app, no root
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM (falls back to software emulation)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Signer of the downloaded APK (provenance check)
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/familylink/base.apk" \
            | tee "$RUNNER_TEMP/certs.txt" | head -10

      - name: Boot the real app and extract it without root
        env:
          FLCODES_PASSPHRASE: real
        run: |
          bash family-link-codes/tools/android_emulator_ci.sh \
            --work "$RUNNER_TEMP/real" --api 30 \
            --apk "$RUNNER_TEMP/familylink/base.apk" \
            --package com.google.android.apps.familylink --expect AIte \
            || echo "exit=$? (expected without a signed-in account)" > "$RUNNER_TEMP/real-status.txt"

      - name: Summarise on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          pr="${{ github.event.pull_request.number }}"
          [ -n "$pr" ] || pr="$(gh pr list --head "$GITHUB_REF_NAME" --json number -q '.[0].number' 2>/dev/null || true)"
          [ -n "$pr" ] || exit 0
          {
            echo "### Family Link real: desempacotado e testado sem root"
            echo
            if [ ! -s "$RUNNER_TEMP/scan.txt" ]; then
              echo "**the job stopped early, here is everything it produced**"
              echo '```'
              ls -la "$RUNNER_TEMP" 2>&1 | head -20
              for f in "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/*.txt; do
                [ -s "$f" ] || continue
                echo "--- $(basename "$f") ---"
                tail -40 "$f"
              done
              echo '```'
            fi
            for f in fetch.txt package.txt badging.txt backup-flags.txt; do
              [ -s "$RUNNER_TEMP/$f" ] && { echo "**$f**"; echo '```'; cat "$RUNNER_TEMP/$f"; echo '```'; }
            done
            echo "**apk scan (top findings)**"
            echo '```'
            head -45 "$RUNNER_TEMP/scan.txt" 2>/dev/null || echo "(no scan)"
            echo '```'
            for f in abe-info.txt tree.txt private-dir.txt shared-prefs.txt backup-size.txt abe-scan.txt certs.txt; do
              [ -s "$RUNNER_TEMP/real/$f" ] && { echo "**$f**"; echo '```'; head -30 "$RUNNER_TEMP/real/$f"; echo '```'; }
            done
            echo "**run.log (tail)**"
            echo '```'
            tail -45 "$RUNNER_TEMP/real/run.log" 2>/dev/null || echo "(no log)"
            echo '```' 
          } > "$RUNNER_TEMP/summary.md"
          gh pr comment "$pr" --body-file "$RUNNER_TEMP/summary.md" || true

      - name: Store the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flcodes-real-family-link
          path: |
            ${{ runner.temp }}/familylink/
            ${{ runner.temp }}/real/
            ${{ runner.temp }}/scan.json
            ${{ runner.temp }}/scan.txt
          if-no-files-found: warn

  real-family-link:
    name: real Family Link APK - unpack and extract without root
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch the newest published Family Link APK (official store first)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash family-link-codes/tools/fetch_familylink_apk.sh \
            --out "$RUNNER_TEMP/familylink" > "$RUNNER_TEMP/fetch.txt" 2>&1
          cat "$RUNNER_TEMP/fetch.txt"
          test -s "$RUNNER_TEMP/familylink/base.apk" || exit 1

      - name: Unpack and locate the secret's home (REA, static)
        run: |
          set +e
          cd family-link-codes
          export PYTHONPATH="$PWD"
          APK="$RUNNER_TEMP/familylink/base.apk"
          python3 -m flcodes apk scan "$APK" --json > "$RUNNER_TEMP/scan.json" 2>&1
          python3 -m flcodes apk scan "$APK" > "$RUNNER_TEMP/scan.txt" 2>&1
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          AAPT="$(find "$SDK/build-tools" -name aapt2 | sort -V | tail -1)"
          "$AAPT" dump packagename "$APK" > "$RUNNER_TEMP/package.txt" 2>&1
          "$AAPT" dump badging "$APK" 2>/dev/null | head -6 > "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" 2>/dev/null \
            | grep -iE "allowBackup|fullBackupContent|dataExtractionRules" \
            > "$RUNNER_TEMP/backup-flags.txt"
          sha256sum "$APK" | tee "$RUNNER_TEMP/sha256.txt"
          ls -l "$APK" | tee -a "$RUNNER_TEMP/scan.txt"
          exit 0

      - name: Signer of the downloaded APK (provenance)
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$RUNNER_TEMP/familylink/base.apk" \
            > "$RUNNER_TEMP/certs.txt" 2>&1
          head -12 "$RUNNER_TEMP/certs.txt"

      - name: Enable KVM (falls back to software emulation)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Boot the real app and take it apart without root
        env:
          FLCODES_PASSPHRASE: real
        run: |
          set +e
          bash family-link-codes/tools/android_emulator_ci.sh \
            --work "$RUNNER_TEMP/real" --api 30 \
            --apk "$RUNNER_TEMP/familylink/base.apk" \
            --package com.google.android.apps.familylink --expect AIte
          echo "exit=$?" > "$RUNNER_TEMP/real-status.txt"
          exit 0

      - name: Summarise on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e +o pipefail
          pr="${{ github.event.pull_request.number }}"
          [ -n "$pr" ] || pr="$(gh pr list --head "$GITHUB_REF_NAME" --json number -q '.[0].number' 2>/dev/null)"
          [ -n "$pr" ] || exit 0
          W="$RUNNER_TEMP/real"
          {
            echo "### Family Link real (APK publicado) - REA sem root"
            echo
            for f in fetch.txt package.txt badging.txt backup-flags.txt certs.txt; do
              [ -s "$RUNNER_TEMP/$f" ] && { echo "**$f**"; echo '```'; head -20 "$RUNNER_TEMP/$f"; echo '```'; }
            done
            echo "**apk scan**"
            echo '```'
            head -45 "$RUNNER_TEMP/scan.txt" 2>/dev/null || echo "(no scan)"
            echo '```'
            for f in abe-info.txt tree.txt private-dir.txt shared-prefs.txt backup-size.txt abe-scan.txt; do
              [ -s "$W/$f" ] && { echo "**$f**"; echo '```'; head -25 "$W/$f"; echo '```'; }
            done
            echo "**run.log (tail)**"
            echo '```'
            tail -50 "$W/run.log" 2>/dev/null || echo "(no log)"
            echo '```'
          } > "$RUNNER_TEMP/summary.md"
          gh pr comment "$pr" --body-file "$RUNNER_TEMP/summary.md"

      - name: Store the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flcodes-real-family-link
          path: |
            ${{ runner.temp }}/familylink/
            ${{ runner.temp }}/real/
            ${{ runner.temp }}/scan.json
            ${{ runner.temp }}/scan.txt
          if-no-files-found: warn
