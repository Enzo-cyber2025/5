name: RaceAI 2D (C++) — executável Windows

# Gera o .exe do jogo em C++ puro (Win32 + GDI, sem bibliotecas externas),
# embutindo o CPython para a IA em Python. Publica o ZIP como artefato e na
# release "exe-cpp-windows".

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar na release 'exe-cpp-windows'"
        type: boolean
        default: true
  push:
    branches: ["arena/5d450bd0-5"]
    paths:
      - "raceai-cpp/**"
      - ".github/workflows/raceai-cpp-windows.yml"

permissions:
  contents: write
  issues: write
  checks: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilador MinGW (g++ / make)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make zip

      - name: Python embutido (para a IA em Python)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path raceai-cpp/python | Out-Null
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile python-embed.zip
          Expand-Archive -Force python-embed.zip -DestinationPath raceai-cpp/python
          Get-ChildItem raceai-cpp/python | Select-Object -First 12 -ExpandProperty Name

      - name: Compilar
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          make -j2 > build.log 2>&1
          st=$?
          tail -80 build.log
          ls -la build/ | tail -10
          test -f build/raceai.exe
          exit $st

      - name: Diagnóstico do erro de build
        if: failure()
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          { grep -nE "error:|Error [0-9]|undefined reference|collect2|No such file" build.log 2>/dev/null | head -10;
            echo "=== fim do log ===";
            tail -3 build.log 2>/dev/null; } > diag.txt
          cat diag.txt
          i=0
          while IFS= read -r linha; do
            txt=$(printf '%s' "$linha" | tr -d '\r' | tr -cd '[:print:]' | cut -c1-190)
            [ -z "$txt" ] && continue
            i=$((i+1))
            echo "::error file=build.log::$txt"
          done < diag.txt
          ERRO=$(head -2 diag.txt | tr -d '\r' | tr -c 'A-Za-z0-9 ._-' ' ' | cut -c1-80)
          echo "ERRO=$ERRO" >> "$GITHUB_ENV"
          echo "linhas de diagnostico: $i"

      - name: Log de build como artefato
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ env.ERRO }}
          path: raceai-cpp/build.log

      - name: Treinar os modelos de demonstração
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          bash tools/treinar_modelos.sh

      - name: Conferir os modelos prontos
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          ls -la modelos/

      - name: Testes do núcleo e da interface
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          make test > test.log 2>&1
          st=$?
          tail -60 test.log
          exit $st

      - name: Testes com o interpretador falso (inclui o que devolve None)
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          make test-py > testpy.log 2>&1
          st=$?
          tail -40 testpy.log
          exit $st

      - name: "Python etapa 1: carregar a dll"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 1 python/python311.dll

      - name: "Python etapa 2: inicializar"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 2 python/python311.dll

      - name: "Python etapa 3: script de preparo"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 3 python/python311.dll

      - name: "Python etapa 4: importar __main__"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 4 python/python311.dll

      - name: "Python etapa 5: compilar o código"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 5 python/python311.dll

      - name: "Python etapa 6: chamar dirigir()"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 6 python/python311.dll

      - name: Teste completo do interpretador Python
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          ls -la python/ > python.log 2>&1
          ./build/raceai_pytest.exe python/python311.dll >> python.log 2>&1
          code=$?
          echo "exit=$code" >> python.log
          cat python.log
          exit 0

      - name: "Integração 1: pistas, carros e mods"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 1 python/python311.dll
      - name: "Integração 2: colar o código Python"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 2 python/python311.dll
      - name: "Integração 3: salvar e importar .py"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 3 python/python311.dll
      - name: "Integração 4: a IA colada dirige"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 4 python/python311.dll
      - name: "Integração 5: corrida com a IA no grid"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 5 python/python311.dll
      - name: "Integração 6: treino com a IA no carro de foco"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 6 python/python311.dll
      - name: "Integração 7: modelo e sliders de recompensa"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 7 python/python311.dll

      - name: "Integração 8: modelos prontos entram na corrida"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 8 python/python311.dll

      - name: "Integração 9: outras topologias de rede"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 9 python/python311.dll

      - name: "Integração 10: .pt, .npz e safetensors de fora"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 10 python/python311.dll

      - name: "Integração 11: chave de modo, setores, fantasma e HUD"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 11 python/python311.dll

      - name: "Treino rápido: a loss precisa cair"
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          ./build/raceai_train.exe -g 25 -p 30 --seconds 30 --seed 5 2>&1 | tail -12


      - name: "O .exe não pode depender de DLL do MinGW"
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          echo "--- DLLs importadas (só pode ter DLL do Windows) ---"
          objdump -p build/raceai.exe | grep -i "DLL Name" | sort -u
          objdump -p build/raceai.exe | grep -i "DLL Name" | sort -u |
            sed 's/^[[:space:]]*/::notice ::DLL importada: /'
          echo "--- conferindo ---"
          if objdump -p build/raceai.exe | grep -iE "libgcc|libstdc\+\+|libwinpthread"; then
            echo "ERRO: o executável ainda depende de DLL do MinGW"
            exit 1
          fi
          echo "OK: executável autossuficiente"

      - name: Empacotar (UM executável só)
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          rm -rf package
          mkdir -p package
          cp build/raceai.exe package/RaceAI2D.exe
          ls -la package/
          du -h package/RaceAI2D.exe

      - name: "O .exe sozinho funciona (modo terminal)"
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          ./build/raceai.exe --help 2>&1 | head -4
          ./build/raceai.exe -g 2 -p 8 --seconds 6 --seed 3 2>&1 | tail -6

      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: RaceAI2D-windows
          path: raceai-cpp/package/RaceAI2D.exe

      - name: Diagnóstico dos testes
        if: failure()
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          { grep -nE "FALHOU|falhou|Assertion|verifica..es passaram|testes passaram" test.log 2>/dev/null | head -12; } > diagt.txt
          cat diagt.txt
          i=0
          while IFS= read -r linha; do
            txt=$(printf '%s' "$linha" | tr -d '\r' | tr -cd '[:print:]' | cut -c1-190)
            [ -z "$txt" ] && continue
            i=$((i+1))
            echo "::error file=test.log::$txt"
          done < diagt.txt
          echo "linhas: $i"


  verificar:
    name: "Máquina diferente: roda o .exe sem MinGW no PATH"
    needs: build
    runs-on: windows-2022
    steps:
      - name: Baixar o executável compilado na outra máquina
        uses: actions/download-artifact@v4
        with:
          name: RaceAI2D-windows
          path: recebido
      - name: "Roda numa pasta vazia, com o PATH limpo"
        shell: pwsh
        run: |
                  $ErrorActionPreference = 'Stop'
                  # tira do PATH tudo que venha do compilador: se o .exe precisar de
                  # qualquer DLL do MinGW, aqui ele nao acha de jeito nenhum
                  $env:PATH = ($env:PATH -split ';' |
                    Where-Object { $_ -and ($_ -notmatch 'mingw|msys|clang|gcc') }) -join ';'
                  $comMingw = if ($env:PATH -match 'mingw|msys|clang') { 'SIM' } else { 'NAO' }
                  Write-Host "MinGW no PATH depois de limpar: $comMingw"
                  Write-Host "PATH de teste: $env:PATH"
                  $dir = Join-Path $env:TEMP 'raceai-limpo'
                  New-Item -ItemType Directory -Force -Path $dir | Out-Null
                  Copy-Item recebido\RaceAI2D.exe "$dir\RaceAI2D.exe"
                  $f = Get-Item "$dir\RaceAI2D.exe"
                  $hash = (Get-FileHash $f -Algorithm SHA256).Hash
                  Write-Host "arquivo: $($f.Length) bytes, sha256=$hash"
                  Get-ChildItem $dir | Select-Object -ExpandProperty Name
                  $p = Start-Process -FilePath "$dir\RaceAI2D.exe" -ArgumentList '--help' `
                       -NoNewWindow -Wait -PassThru `
                       -RedirectStandardOutput "$dir\saida.txt" -RedirectStandardError "$dir\erro.txt"
                  Write-Host "stderr: $((Get-Content "$dir\erro.txt" -TotalCount 3) -join ' | ')"
                  $saida = (Get-Content "$dir\saida.txt" -TotalCount 2) -join ' | '
                  Write-Host "exit code: $($p.ExitCode)"
                  Write-Host "saida: $saida"
                  Write-Host "::notice ::maquina limpa: mingw_no_path=$comMingw tamanho=$($f.Length) sha256=$hash exit=$($p.ExitCode) saida=$saida"
                  if ($p.ExitCode -ne 0) {
                    Write-Host "::error::o executavel nao rodou na maquina limpa (exit $($p.ExitCode))"
                    exit 1
                  }
                  if ($comMingw -eq 'SIM') {
                    Write-Host "::error::o shell de teste ainda tem o MinGW no PATH: teste invalido"
                    exit 1
                  }
                  Write-Host "OK: abriu e rodou numa pasta vazia, sem nenhuma DLL do lado"


  publicar:
    name: Publicar na release exe-cpp-windows
    needs: [build, verificar]
    if: ${{ github.event.inputs.publish != 'false' }}
    runs-on: windows-latest
    steps:
      - name: Baixar o executável verificado
        uses: actions/download-artifact@v4
        with:
          name: RaceAI2D-windows
          path: recebido
      - name: Enviar para a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
                  $ErrorActionPreference = 'Continue'
                  $notas = @(
                    'RaceAI 2D (C++ puro, Win32 + GDI) em UM ARQUIVO SO: baixe o RaceAI2D.exe,',
                    'clique duas vezes e jogue. Nao precisa descompactar zip nem instalar nada -',
                    'na primeira vez ele copia pistas, carros e o Python opcional para a pasta de',
                    'dados do Windows (e la que ficam os seus mods).',
                    '',
                    'NAO DEPENDE DE NENHUMA DLL EXTERNA: so usa DLLs do proprio Windows',
                    '(KERNEL32, USER32, GDI32, COMCTL32, COMDLG32, SHELL32, msvcrt).',
                    '',
                    'Os dois modos moram no mesmo .exe:',
                    ' - sem argumentos: abre a janela (F2 alterna Corrida e Treinamento);',
                    ' - com argumentos: treina no terminal (ex.: RaceAI2D.exe -g 50 -p 60).',
                    '',
                    'Destaques:',
                    ' - 24 pistas e 20 carros, 10 modelos 3D de carroceria e sistema de mods;',
                    ' - gerador de IA sem programar: digite as camadas (ex.: 256, 128, 64);',
                    ' - chave "tipo de IA": Corrida (so piloto) ou Estrategia (piloto + boxe);',
                    ' - fisica de colisao com danos, aerodinamica que degrada e pitstop (tecla B);',
                    ' - aceita qualquer rede neural (.pt, .pth, .npz, .safetensors, .json);',
                    ' - ETA de todas as epocas, loss e erro % na tela.',
                    '',
                    'Se algo nao abrir: abra o raceai.log (nasce ao lado do .exe) e mande o',
                    'conteudo - ele diz exatamente onde parou.',
                    ''
                  ) -join "`n"

                  gh release view exe-cpp-windows | Out-Null
                  if ($LASTEXITCODE -ne 0) {
                    gh release create exe-cpp-windows --title "RaceAI 2D (C++) - executavel Windows" --notes $notas
                  }
                  $exe = Get-Item recebido\RaceAI2D.exe
                  $sha = (Get-FileHash $exe -Algorithm SHA256).Hash
                  Write-Host "::notice ::release: $($exe.Length) bytes sha256=$sha"
                  $notas = $notas + "`n`nArquivo: RaceAI2D.exe — $($exe.Length) bytes`nSHA256: $sha"
                  gh release upload exe-cpp-windows $exe --clobber
                  gh release edit exe-cpp-windows --notes $notas
                  # o zip antigo sai de cena (se ele ja nao existir, nao e erro)
                  gh release delete-asset exe-cpp-windows RaceAI2D-C++-windows.zip -y 2>$null
                  $LASTEXITCODE = 0
                  Write-Host "release atualizada: so o RaceAI2D.exe" 
