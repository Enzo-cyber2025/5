name: RaceAI 2D (C++) — executável Windows

# Gera o .exe do jogo em C++ puro (Win32 + GDI, sem bibliotecas externas),
# embutindo o CPython para a IA em Python. Publica o ZIP como artefato e na
# release "exe-cpp-windows".

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar na release 'exe-cpp-windows'"
        type: boolean
        default: true
  push:
    branches: ["arena/5d450bd0-5"]
    paths:
      - "raceai-cpp/**"
      - ".github/workflows/raceai-cpp-windows.yml"

permissions:
  contents: write
  issues: write
  checks: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilador MinGW (g++ / make)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make zip

      - name: Python embutido (para a IA em Python)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path raceai-cpp/python | Out-Null
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile python-embed.zip
          Expand-Archive -Force python-embed.zip -DestinationPath raceai-cpp/python
          Get-ChildItem raceai-cpp/python | Select-Object -First 12 -ExpandProperty Name

      - name: Compilar
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          make -j2 > build.log 2>&1
          st=$?
          tail -80 build.log
          ls -la build/ | tail -10
          test -f build/raceai.exe
          exit $st

      - name: Diagnóstico (copia o erro do build para um status do commit)
        if: failure()
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd raceai-cpp
          { grep -nE "error:|Error [0-9]|undefined reference|collect2|No such file" build.log 2>/dev/null | head -8;
            echo "--- fim ---";
            tail -4 build.log 2>/dev/null; } > diag.txt
          i=0
          while IFS= read -r linha; do
            txt=$(printf '%s' "$linha" | tr -d '\r' | cut -c1-135)
            [ -z "$txt" ] && continue
            i=$((i+1))
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=error" -f "context=diag$i" -f "description=$txt" || true
            [ "$i" -ge 12 ] && break
          done < diag.txt
          echo "linhas de diagnostico: $i"

      - name: Treinar os modelos de demonstração
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          mkdir -p modelos
          ./build/raceai_train.exe --track kartodromo --car kart -g 60 -p 60 \
            --seconds 45 --seed 21 --out modelos/demo_kartodromo_kart.json | tail -4
          ./build/raceai_train.exe --track oval_iniciante --car sedan -g 60 -p 60 \
            --seconds 45 --seed 7 --out modelos/demo_oval_iniciante_sedan.json | tail -4
          ./build/raceai_train.exe --track speedway --car formula -g 120 -p 60 \
            --seconds 45 --seed 5 --out modelos/demo_speedway_formula.json | tail -4
          ls -la modelos/

      - name: Testes do núcleo e da interface
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          make test > test.log 2>&1
          st=$?
          tail -60 test.log
          exit $st

      - name: Testes com o interpretador falso (inclui o que devolve None)
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          make test-py > testpy.log 2>&1
          st=$?
          tail -40 testpy.log
          exit $st

      - name: "Python etapa 1: carregar a dll"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 1 python/python311.dll

      - name: "Python etapa 2: inicializar"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 2 python/python311.dll

      - name: "Python etapa 3: script de preparo"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 3 python/python311.dll

      - name: "Python etapa 4: importar __main__"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 4 python/python311.dll

      - name: "Python etapa 5: compilar o código"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 5 python/python311.dll

      - name: "Python etapa 6: chamar dirigir()"
        continue-on-error: true
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_pytest.exe --stage 6 python/python311.dll

      - name: Teste completo do interpretador Python
        continue-on-error: true
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          ls -la python/ > python.log 2>&1
          ./build/raceai_pytest.exe python/python311.dll >> python.log 2>&1
          code=$?
          echo "exit=$code" >> python.log
          cat python.log
          exit 0

      - name: "Integração 1: pistas, carros e mods"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 1 python/python311.dll
      - name: "Integração 2: colar o código Python"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 2 python/python311.dll
      - name: "Integração 3: salvar e importar .py"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 3 python/python311.dll
      - name: "Integração 4: a IA colada dirige"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 4 python/python311.dll
      - name: "Integração 5: corrida com a IA no grid"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 5 python/python311.dll
      - name: "Integração 6: treino com a IA no carro de foco"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 6 python/python311.dll
      - name: "Integração 7: modelo e sliders de recompensa"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 7 python/python311.dll

      - name: "Integração 8: modelos prontos entram na corrida"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 8 python/python311.dll

      - name: "Integração 9: outras topologias de rede"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 9 python/python311.dll

      - name: "Integração 10: .pt, .npz e safetensors de fora"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 10 python/python311.dll

      - name: "Integração 11: chave de modo, setores, fantasma e HUD"
        if: always()
        shell: msys2 {0}
        run: cd raceai-cpp && ./build/raceai_integrado.exe --secao 11 python/python311.dll

      - name: "Treino rápido: a loss precisa cair"
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          ./build/raceai_train.exe -g 25 -p 30 --seconds 30 --seed 5 2>&1 | tail -12


      - name: Empacotar
        shell: msys2 {0}
        run: |
          cd raceai-cpp
          rm -rf package
          mkdir -p package/RaceAI2D-C++/mods/tracks package/RaceAI2D-C++/mods/cars
          mkdir -p package/RaceAI2D-C++/modelos
          cp build/raceai.exe build/raceai_train.exe package/RaceAI2D-C++/
          cp -r assets package/RaceAI2D-C++/
          cp -r python package/RaceAI2D-C++/
          cp README.md package/RaceAI2D-C++/LEIA-ME.txt
          cp MODS.md package/RaceAI2D-C++/
          cp tools/pt_para_json.py package/RaceAI2D-C++/converter-modelo.py
          cp tools/gerar_conteudo.py package/RaceAI2D-C++/gerar-conteudo.py
          cp -r modelos package/RaceAI2D-C++/
          du -sh package/RaceAI2D-C++
          cd package && zip -qr RaceAI2D-C++-windows.zip RaceAI2D-C++
          ls -la

      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: RaceAI2D-C++-windows
          path: raceai-cpp/package/RaceAI2D-C++-windows.zip

      - name: Diagnóstico dos testes
        if: failure()
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd raceai-cpp
          { grep -nE "falharam|FAILED|error:|Assertion" test.log 2>/dev/null | head -8; } > diagt.txt
          i=0
          while IFS= read -r linha; do
            txt=$(printf '%s' "$linha" | tr -d '\r' | cut -c1-135)
            [ -z "$txt" ] && continue
            i=$((i+1))
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=error" -f "context=testdiag$i" -f "description=$txt" || true
            [ "$i" -ge 8 ] && break
          done < diagt.txt

      - name: Publicar na release exe-cpp-windows
        if: ${{ github.event.inputs.publish != 'false' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Continue'
          $notas = @(
            'RaceAI 2D (C++ puro, Win32 + GDI). Um unico executavel com os dois'
            'modos: F2 alterna Corrida e Treinamento na hora, sem voltar ao menu.',
            '',
            'Novidades desta versao:',
            ' - fisica nova: motor com curva de torque, cambio automatico de ate 9 marchas,',
            '   pneus com temperatura e desgaste, aerodinamica (arrasto e downforce),',
            '   transferencia de carga lateral, dano por batida e tanque de combustivel;',
            ' - telemetria de corrida: setores, melhor volta, delta e fantasma (o tracado',
            '   da sua melhor volta desenhado na pista) alem do minimapa;',
            ' - 16 pistas e 14 carros (de kart a caminhao, de eletrico a monoposto);',
            ' - abre sem erro: a janela se ajusta a tela e qualquer falha aparece em',
            '   uma janela de mensagem e fica gravada em raceai.log.',
            '',
            'Se algo nao abrir: abra o arquivo raceai.log (na pasta do .exe) e mande o',
            'conteudo - ele diz exatamente onde parou.',
            '',
            "Gerado por .github/workflows/raceai-cpp-windows.yml (branch $env:GITHUB_REF_NAME, commit $env:GITHUB_SHA)."
          ) -join "`n"
          gh release view exe-cpp-windows | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create exe-cpp-windows --title "RaceAI 2D (C++) - executavel Windows" --notes $notas
          }
          gh release upload exe-cpp-windows (Get-ChildItem raceai-cpp/package/*.zip) --clobber
