name: Local stream isolated text experiment
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/local-stream.yml, scripts/build_local_stream_experiment.py, scripts/test_local_stream_android.py, apk-fix/local_stream.py, apk-fix/java/com/ggufchat/app/LocalGenerationStream.java, tests/test_local_stream.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: local-stream-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: ${{ contains(github.event.head_commit.message, '[local stream]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build DEX-only experiment; compare every non-signature payload entry
        run: |
          mkdir -p .cache evidence
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt numpy==2.2.6 tqdm==4.67.1 pyyaml==6.0.2
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          bash scripts/fetch_tools.sh
          .venv/bin/python scripts/build_local_stream_experiment.py
          java -jar .cache/tools/package/lib/apktool.jar d -f -r -o .cache/text-ui-base .delivery/GGUF-Chat-gain-approved-payload.apk
          .venv/bin/python -m pytest -q tests/test_local_stream.py tests/test_perceptible_text_gate.py tests/test_perceptible_gate.py
      - name: Fixtures and regression helpers
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt numpy==2.2.6 tqdm==4.67.1 pyyaml==6.0.2
          .venv/bin/python -m pytest -q tests/test_perceptible_text_gate.py tests/test_perceptible_gate.py
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp .cache/llama-mobile
          test "$(git -C .cache/llama-mobile rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          bash ci/mobile-models.sh
          bash scripts/build_test_input.sh
          bash scripts/build_code_test.sh
          sudo chmod a+rw /dev/kvm
          bash ci/prepare_vulkan.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GGUF_MOBILE_VULKAN: '1'
          GGUF_TEST_APK: .cache/local-stream/candidate.apk
          GGUF_TEST_STRICT_GPU: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu host -feature Vulkan -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: .venv/bin/python scripts/test_local_stream_android.py
      - name: Publish bounded measured evidence, including failures
        if: always()
        run: bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-stream-experiment-not-release
          path: |
            evidence/
            .cache/local-stream/candidate.apk
            .cache/local-stream/before.apk
          retention-days: 7
