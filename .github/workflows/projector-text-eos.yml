name: Combined projector text control with natural EOS
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/projector-text-eos.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: projector-text-eos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  text:
    if: ${{ contains(github.event.head_commit.message, '[projector text eos]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: combined-payload-not-release
          path: .cache/combined-import
          run-id: 35392374636
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: combined-byte-proof
          path: .cache/combined-proof
          run-id: 35392374636
          github-token: ${{ github.token }}
      - name: Require the original compiled payload and numerical proof
        run: |
          python3 - <<'PYCODE'
          import hashlib,json
          from pathlib import Path
          apk=Path('.cache/combined-import/candidate.apk')
          build=json.loads(Path('.cache/combined-import/build.json').read_text())
          proof=json.loads(Path('.cache/combined-proof/summary.json').read_text())
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==build['apk_sha256']=='2053c037e3d9ca776f9c1d285722338c4967135044d7c026803450bd0b33baf1'
          assert build['source_commit']=='11da7aa98b773754856dbdb1edefc8c6717e0e27'
          assert proof['build']==build and proof['status']=='PASS_COMBINED_BYTE_REFERENCE'
          PYCODE
      - name: Exact fixtures and emulator prerequisites
        run: |
          mkdir -p evidence
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt numpy==2.2.6 tqdm==4.67.1 pyyaml==6.0.2
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp .cache/llama-mobile
          test "$(git -C .cache/llama-mobile rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          bash ci/mobile-models.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          bash scripts/build_test_input.sh
          bash scripts/build_code_test.sh .cache/combined-import/candidate.apk
          sudo chmod a+rw /dev/kvm
          bash ci/prepare_vulkan.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GGUF_MOBILE_VULKAN: '1'
          GGUF_TEST_APK: .cache/combined-import/candidate.apk
          GGUF_TEST_STRICT_GPU: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu host -feature Vulkan -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: .venv/bin/python scripts/test_projector_combined_android.py text
      - name: Independent small-gain and nonregression evaluation
        run: python3 ci/evaluate_projector_combined.py evidence/summary.json .cache/combined-proof/summary.json > evidence/physical-combined-gate.json
      - name: Publish bounded paired results, including non-approval
        if: always()
        env:
          GGUF_EVIDENCE_VARIANT: combined-text-eos
        run: bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-text-eos-evidence
          path: evidence/
