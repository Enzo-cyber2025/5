name: Vulkan completion wait real text and image speed
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/vulkan-wait.yml, apk-fix/vulkan_wait_patches.py, scripts/test_vulkan_wait_android.py, ci/evaluate_vulkan_wait.py, tests/test_vulkan_wait.py, tests/test_wait_gate.py]
permissions:
  contents: write
  actions: read
concurrency:
  group: vulkan-wait-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, '[wait speed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK already installed on the hosted runner
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          # Avoid the failing setup action; accept licenses on the existing SDK.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /tmp/android-licenses.log
          set -o pipefail
      - name: Pinned tools and source APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          bash scripts/fetch_tools.sh
          python3 scripts/fetch_original.py
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build glslc libvulkan-dev
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers .cache/vulkan-sdk
          test "$(git -C .cache/vulkan-sdk rev-parse HEAD)" = e3b1eec08173d6b825cd3ac88c885a63b621504a
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/SPIRV-Headers .cache/spirv-headers
          test "$(git -C .cache/spirv-headers rev-parse HEAD)" = 29981f65241605e08b0ede4cfeb999fe3b723c6a
          cmake -S .cache/spirv-headers -B .cache/spirv-build -DCMAKE_INSTALL_PREFIX="$PWD/.cache/spirv-install"
          cmake --install .cache/spirv-build
          mkdir -p .cache/vulkan-headers
          cp -r .cache/vulkan-sdk/include/. .cache/vulkan-headers/
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            .cache/llama-mobile
            .cache/mobile/arm64-v8a
            .cache/mobile/x86_64
          key: native-v041-ndk28-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: native-v041-ndk28-v1-${{ runner.os }}-
      - name: Compile real native stack and compact UI
        env:
          APKTOOL_JAR: .cache/tools/package/lib/apktool.jar
          GGUF_REUSE_TESTED_NATIVE: '0'
          GGUF_EXPERIMENT_BLOCKING_WAIT: '1'
        run: bash ci/log_step.sh mobile-build python3 apk-fix/build_mobile.py
      - name: Save compiled native objects before Android acceptance (including on later test failure)
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/llama-mobile
            .cache/mobile/arm64-v8a
            .cache/mobile/x86_64
          key: native-v041-ndk28-v1-${{ runner.os }}-${{ github.run_id }}
      - name: Real strict dispatch and exact wait/control checks
        run: |
          bash ci/log_step.sh strict-host bash scripts/test_strict_vulkan_host.sh
          .venv/bin/python -m pytest -q tests/test_vulkan_wait.py tests/test_wait_gate.py tests/test_perceptible_text_gate.py tests/test_perceptible_gate.py tests/test_strict_vulkan.py tests/test_projector_cache.py tests/test_latency.py
      - name: Sign one disposable comparison APK, never replace the delivered file
        run: |
          mkdir -p .cache/wait-export evidence
          keytool -genkeypair -keystore "$RUNNER_TEMP/wait-test.p12" -storetype PKCS12 -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable Vulkan wait experiment NOT release'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/wait-test.p12" --ks-pass pass:android --out .cache/wait-export/candidate.apk dist/GGUF-Chat-mobile-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose .cache/wait-export/candidate.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 .cache/wait-export/candidate.apk
          rm "$RUNNER_TEMP/wait-test.p12"
          python3 - <<'PY'
          import hashlib,json,sys,subprocess,zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from sign_gain_release import payload
          apk=Path('.cache/wait-export/candidate.apk')
          assert payload(apk)==payload('dist/GGUF-Chat-mobile-unsigned.apk')
          with zipfile.ZipFile(apk) as z:
              for abi in ('x86_64','arm64-v8a'):
                  assert b'GGUF_VULKAN_WAIT_POLICY' in z.read('lib/'+abi+'/libaijni.so')
          r=dict(apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),source_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),experimental_wait_build=True,default_blocking_wait=True,control='Same APK with GGUF_VULKAN_BLOCKING_WAIT=0; candidate flag absent',release_approved=False)
          Path('.cache/wait-export/build.json').write_text(json.dumps(r,indent=2))
          Path('evidence/physical-wait-build.json').write_text(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wait-payload-not-release
          path: .cache/wait-export/*
          include-hidden-files: true
          retention-days: 7
      - name: Publish build diagnostics
        if: always()
        env:
          GGUF_EVIDENCE_VARIANT: wait-build
        run: bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wait-build-diagnostics
          path: |
            evidence/
            .cache/ci-logs/
  measure:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        kind: [text, images]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: wait-payload-not-release
          path: .cache/wait-import
      - name: Exact fixtures and emulator prerequisites
        run: |
          mkdir -p evidence
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt numpy==2.2.6 tqdm==4.67.1 pyyaml==6.0.2
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp .cache/llama-mobile
          test "$(git -C .cache/llama-mobile rev-parse HEAD)" = b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
          bash ci/mobile-models.sh
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          bash scripts/build_test_input.sh
          bash scripts/build_code_test.sh .cache/wait-import/candidate.apk
          sudo chmod a+rw /dev/kvm
          bash ci/prepare_vulkan.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GGUF_MOBILE_VULKAN: '1'
          GGUF_TEST_APK: .cache/wait-import/candidate.apk
          GGUF_TEST_STRICT_GPU: '1'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu host -feature Vulkan -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: .venv/bin/python scripts/test_vulkan_wait_android.py ${{ matrix.kind }}
      - name: Independent speed gate (functional success alone is insufficient)
        run: python3 ci/evaluate_vulkan_wait.py evidence/summary.json > evidence/physical-wait-gate.json
      - name: Publish bounded paired results, including failures
        if: always()
        env:
          GGUF_EVIDENCE_VARIANT: wait-${{ matrix.kind }}
        run: bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wait-${{ matrix.kind }}-evidence
          path: evidence/
