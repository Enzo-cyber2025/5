name: ETS2-AI build (APK + EXE + TFLite)

on:
  push:
    branches: [arena/01a0f37d-5]
    paths: ['ets2-ai/**', '.github/workflows/ets2-ai.yml']
  workflow_dispatch:
    inputs:
      force_kaggle:
        description: 'Forcar treino nas 2x T4 do Kaggle (requer secret KAGGLE_KEY)'
        type: boolean
        default: false
      recover_kernel:
        description: 'Recuperar a saida do kernel Kaggle JA TREINADO (sem retreinar)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train-verify:
    name: Testes + gates dos pesos commitados
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 numpy==2.2.6 pytest==9.1.1
      - name: Parse-check dos scripts PowerShell (erro de sintaxe vira anotacao)
        shell: pwsh
        run: |
          $falhou = $false
          Get-ChildItem ets2-ai/scripts/*.ps1 | ForEach-Object {
            $errs = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              $falhou = $true
              $errs | ForEach-Object { Write-Host ("::error file={0},line={1}::PowerShell parse: {2}" -f $_.Extent.File, $_.Extent.StartLineNumber, $_.Message) }
            } else { Write-Host ("parse OK: " + $_.Name) }
          }
          if ($falhou) { exit 1 }

      - name: Testes (pytest)
        run: |
          cd ets2-ai
          pytest tests/ -q 2>&1 | tee ../.cache_pytest.log
          exit ${PIPESTATUS[0]}
      - name: Gates nos pesos commitados (circuito fechado)
        run: |
          cd ets2-ai
          python - <<'PY' 2>&1 | tee ../.cache_gates.log
          import sys; sys.path.insert(0, ".")
          from ets2ai.contract import load_weights, LOSS_TARGET
          from ets2ai.train import closed_loop_eval
          layers, meta = load_weights("artifacts/model-weights.json")
          agg, _ = closed_loop_eval(layers, n_roads=3)
          print(f"loss {meta['final_loss']:.5f} (meta {LOSS_TARGET}) | "
                f"finish {agg['finish_rate']*100:.0f}% | dock {agg['dock_rate']*100:.0f}% | "
                f"faixa {agg['in_lane_pct']*100:.1f}% | radares {agg['radar_compliance']*100:.0f}%")
          assert meta["final_loss"] <= LOSS_TARGET, "loss acima da meta"
          assert agg["finish_rate"] >= 2/3 and agg["dock_rate"] >= 2/3, "dock/finish baixos"
          assert agg["in_lane_pct"] > 0.95, "fora da faixa"
          print("GATES OK")
          PY
      - name: Determinismo (micro-retreino bit-identico)
        run: |
          cd ets2-ai
          python - <<'PY'
          import sys; sys.path.insert(0, ".")
          import numpy as np
          import ets2ai.data as data
          data.N_TRAIN_ROADS = 6; data.N_VAL_ROADS = 3
          from ets2ai.data import generate
          from ets2ai.model import train
          x, y, xv, yv = generate()
          l1, _ = train(x, y, epochs=2, x_val=xv, y_val=yv, verbose=False)
          l2, _ = train(x, y, epochs=2, x_val=xv, y_val=yv, verbose=False)
          assert all(np.array_equal(a[0], b[0]) and np.array_equal(a[1], b[1])
                     for a, b in zip(l1, l2)), "treino nao deterministico"
          print("DETERMINISMO OK (bit-identico)")
          PY
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-verify
          cp .cache_gates.log ci-logs/${{ github.run_id }}-verify/log.txt 2>/dev/null || echo "sem log" > ci-logs/${{ github.run_id }}-verify/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: train-verify run ${{ github.run_id }} [skip ci]" || true
          git pull --rebase --autostash origin arena/01a0f37d-5 || true
          git push || true
          exit 1

  kaggle-train:
    name: Treino (Kaggle 2xT4 ou local) — fonte canonica dos pesos
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 numpy==2.2.6
      - name: Decide a fonte dos pesos
        id: fonte
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FORCE_KAGGLE: ${{ inputs.force_kaggle }}
          RECOVER_KERNEL: ${{ inputs.recover_kernel }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "ets2-ai")
          from ets2ai.contract import HIDDEN, LOSS_TARGET
          key = os.environ.get("KAGGLE_KEY", "").strip()
          force = str(os.environ.get("FORCE_KAGGLE", "")).lower() in ("true", "1")
          recover = str(os.environ.get("RECOVER_KERNEL", "")).lower() in ("true", "1")
          try:
              m = json.load(open("ets2-ai/artifacts/model-weights.json"))["meta"]
              committed_ok = (m.get("hidden") == HIDDEN
                              and m.get("samples", 0) >= 500_000_000
                              and m["final_loss"] <= LOSS_TARGET)
          except Exception:
              committed_ok = False
          if recover and key:
              src = "recover"
          elif key and (force or not committed_ok):
              src = "kaggle"
          elif committed_ok:
              src = "committed"
          else:
              src = "local"
          print(f"fonte dos pesos: {src} | committed_ok={committed_ok} | "
                f"secret KAGGLE_KEY={'presente' if key else 'AUSENTE'} | force={force}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"source={src}\n")
          if src == "committed":
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("WEIGHTS_SOURCE=committed\n")
          PY
      - name: Recupera saida do kernel Kaggle ja treinado (sem retreinar)
        if: steps.fonte.outputs.source == 'recover'
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install --retries 5 --timeout 90 kaggle
          cd ets2-ai
          SLUG="$(python kaggle/push.py --slug-only)"
          echo "[recover] kernel: $SLUG"
          kaggle kernels output "$SLUG" -p .cache/kaggle-out > ../.cache_kaggle.log 2>&1
          cat ../.cache_kaggle.log
          ls -la .cache/kaggle-out/
          cp .cache/kaggle-out/model-weights.json artifacts/
          cp .cache/kaggle-out/metrics.json artifacts/ 2>/dev/null || true
          echo "WEIGHTS_SOURCE=kaggle-2xT4-recuperado" >> "$GITHUB_ENV"
      - name: Treino nas 2x T4 do Kaggle (MirroredStrategy, FP32 fluxo 1B)
        if: steps.fonte.outputs.source == 'kaggle'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install --retries 5 --timeout 90 kaggle
          cd ets2-ai
          python kaggle/push.py --gpu --timeout 15000 2>&1 | tee ../.cache_kaggle.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::warning::Kaggle falhou — caindo para treino local deterministico"
            echo "WEIGHTS_SOURCE=local-fallback" >> "$GITHUB_ENV"
            python -m ets2ai.train --stream-samples 80000000 --batch 1024 --dtype float32 --out artifacts
          else
            echo "WEIGHTS_SOURCE=kaggle-2xT4" >> "$GITHUB_ENV"
            cp .cache/kaggle-out/model-weights.json artifacts/
            cp .cache/kaggle-out/metrics.json artifacts/ 2>/dev/null || true
          fi
      - name: Treino local deterministico (sem secret Kaggle)
        if: steps.fonte.outputs.source == 'local'
        run: |
          echo "WEIGHTS_SOURCE=local-stream" >> "$GITHUB_ENV"
          cd ets2-ai
          python -m ets2ai.train --stream-samples 80000000 --batch 1024 --dtype float32 --out artifacts 2>&1 | tee ../.cache_train.log
          exit ${PIPESTATUS[0]}
      - name: Gates de qualidade + formato device + assets Android
        run: |
          cd ets2-ai
          set -o pipefail
          python - <<'PY' 2>&1 | tee ../.cache_quality.log
          import json, os, sys
          sys.path.insert(0, ".")
          from ets2ai.contract import load_weights, LOSS_TARGET, save_device_format
          from ets2ai.train import closed_loop_eval
          layers, meta = load_weights("artifacts/model-weights.json")
          agg, rows = closed_loop_eval(layers)
          print(f"fonte={os.environ.get('WEIGHTS_SOURCE', '?')} | loss {meta['final_loss']:.6f} (meta {LOSS_TARGET})")
          print(f"finish {agg['finish_rate']*100:.0f}% | dock {agg['dock_rate']*100:.0f}% | "
                f"faixa {agg['in_lane_pct']*100:.1f}% | radares {agg['radar_compliance']*100:.0f}% | "
                f"stop erro {agg['mean_stop_error_m']:.2f} m")
          assert meta["final_loss"] <= LOSS_TARGET, "loss acima da meta"
          assert agg["finish_rate"] >= 2/3 and agg["dock_rate"] >= 2/3, "dock/finish baixos"
          assert agg["in_lane_pct"] > 0.95, "fora da faixa"
          m = {"meta": {"features": meta["features"], "actions": meta["actions"],
                        "hidden": meta["hidden"], "seed": meta["seed"],
                        "loss_target": LOSS_TARGET, "epochs": meta["epochs"],
                        "samples": meta["samples"], "final_loss": meta["final_loss"],
                        "dtype": meta.get("dtype", "float64")},
               "mse_val": meta["final_loss"],
               "loss_target": LOSS_TARGET,
               "closed_loop": agg, "closed_loop_rows": rows,
               "target_met": bool(meta["final_loss"] <= LOSS_TARGET),
               "weights_source": "${{ env.WEIGHTS_SOURCE }}"}
          json.dump(m, open("artifacts/metrics.json", "w"), indent=2)
          save_device_format("artifacts/model-weights.txt", layers, meta)
          print("GATES OK — pesos aprovados")
          PY
          cp artifacts/model-weights.txt android/assets/model-weights.txt
      - name: Destila rede nano (IA no PC fraco — imita a oficial)
        continue-on-error: true   # nano e melhoria: sem ela o PC cai no celular
        run: |
          cd ets2-ai
          set -o pipefail
          python -m ets2ai.distill --weights artifacts/model-weights.json \
              --out artifacts/model-nano.json \
              --report artifacts/distill-report.json \
            2>&1 | tee ../.cache_distill.log
      - name: Commita pesos canonicos [skip ci]
        run: |
          git config user.name "ets2ai-ci"; git config user.email "ci@users.noreply.github.com"
          git add ets2-ai/artifacts ets2-ai/android/assets/model-weights.txt
          if git diff --cached --quiet; then
            echo "pesos inalterados — nada a commitar"
          else
            git commit -m "pesos canonicos (fonte: ${{ steps.fonte.outputs.source }}) [skip ci]"
            # corrida de pushes no MESMO branch derrubou o run 38175378427
            # (exit 128) — o artifact e mais critico que o commit no repo
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              git pull --rebase --autostash origin arena/01a0f37d-5 || (git rebase --abort; git pull --rebase origin arena/01a0f37d-5) || true
              if git push origin HEAD:arena/01a0f37d-5; then ok=1; break; fi
              sleep 15
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::push dos pesos falhou apos 8 tentativas — artifact segue o fluxo"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ets2-ai-weights
          path: |
            ets2-ai/artifacts/model-weights.json
            ets2-ai/artifacts/metrics.json
            ets2-ai/artifacts/model-nano.json
            ets2-ai/artifacts/distill-report.json
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-train
          { echo "=== kaggle-train run ${{ github.run_id }} fonte ${{ steps.fonte.outputs.source }} ==="
            echo "--- kaggle log"; cat .cache_kaggle.log 2>/dev/null
            echo "--- train log"; cat .cache_train.log 2>/dev/null
            echo "--- quality log"; cat .cache_quality.log 2>/dev/null; } \
            > ci-logs/${{ github.run_id }}-train/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: kaggle-train run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin arena/01a0f37d-5 || (git rebase --abort; git pull --rebase origin arena/01a0f37d-5) || true
            git push origin HEAD:arena/01a0f37d-5 && break
            sleep 15
          done
          exit 1

  java-parity:
    name: Paridade Java (inferencia do APK) x numpy
    needs: [kaggle-train]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compila e confere
        run: |
          set -x
          pip install --retries 5 --timeout 90 numpy==2.2.6 2>&1 | tee .cache_check_java.log
          bash ets2-ai/android/check_java.sh 2>&1 | tee -a .cache_check_java.log
          exit ${PIPESTATUS[0]}
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-java
          { echo "=== java-parity run ${{ github.run_id }} sha $GITHUB_SHA ==="
            echo "--- check_java.log completo"; cat .cache_check_java.log 2>/dev/null; } \
            > ci-logs/${{ github.run_id }}-java/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: java-parity run ${{ github.run_id }} [skip ci]" || true
          git push || true
          exit 1

  tflite-export:
    name: Exporta TFLite (float32 + int8)
    needs: [kaggle-train]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 numpy==2.2.6 tensorflow-cpu==2.21.0
      - name: Converte e valida contra numpy
        run: |
          cd ets2-ai
          python -m ets2ai.export_tflite --weights artifacts/model-weights.json --out .cache/tflite 2>&1 | tee ../.cache_tflite.log
          exit ${PIPESTATUS[0]}
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-tflite
          cp .cache_tflite.log ci-logs/${{ github.run_id }}-tflite/log.txt 2>/dev/null || echo "sem log" > ci-logs/${{ github.run_id }}-tflite/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: tflite run ${{ github.run_id }} [skip ci]" || true
          git pull --rebase --autostash origin arena/01a0f37d-5 || true
          git push || true
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ets2-ai-tflite
          path: ets2-ai/.cache/tflite

  android-apk:
    name: APK assinado (ETS2-AI-mobile.apk)
    needs: [kaggle-train, java-parity, tflite-export]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixa o modelo TFLite do job anterior
        uses: actions/download-artifact@v4
        with:
          name: ets2-ai-tflite
          path: ets2-ai/.cache/tflite-in
      - name: SDK deterministico (plataforma 35 p/ foregroundServiceType specialUse)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)
          fi
          if [ -n "${SDKM:-}" ] && [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 \
              || "$SDKM" --install "platforms;android-35" >/dev/null 2>&1 || true
          else
            echo "sdkmanager nao encontrado — usando o que vier na imagem"
          fi
          echo "plataformas disponiveis:"
          ls -d "$ANDROID_HOME"/platforms/* 2>/dev/null || true
      - name: Build (aapt2 -> javac -> d8 -> apksigner; TFLite runtime opcional)
        run: |
          TFLITE_MODEL=ets2-ai/.cache/tflite-in/ets2ai-float32.tflite \
          TFLITE_AAR=1 bash ets2-ai/android/build_apk.sh 2>&1 | tee .cache_apk.log
          exit ${PIPESTATUS[0]}
      - name: Conteudo do APK (evidencia)
        run: unzip -l ets2-ai/dist/ETS2-AI-mobile.apk
      - name: Prova de modo offline (IA embutida, sem downloads)
        run: bash ets2-ai/android/check_offline.sh
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-apk
          { echo "=== apk run ${{ github.run_id }} sha $GITHUB_SHA ==="
            echo "--- build log"; cat .cache_apk.log 2>/dev/null; } \
            > ci-logs/${{ github.run_id }}-apk/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: apk run ${{ github.run_id }} [skip ci]" || true
          git push || true
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-mobile-apk
          path: ets2-ai/dist/ETS2-AI-mobile.apk

  windows-exe:
    name: EXE para Windows (ETS2-AI-bridge.exe)
    needs: [kaggle-train]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          pip install --retries 5 --timeout 90 pyinstaller==6.11.1 numpy==2.2.6 pywin32==308
      - uses: ilammy/msvc-dev-cmd@v1        # MSVC no PATH (vswhere robusto)
        with:
          arch: x64
      - name: Compila DLL UNIVERSAL x64 (ets2ai)
        shell: cmd
        run: |
          mkdir ets2-ai\bridge\dlls\ets2ai\universal\x64 2>nul
          cl /nologo /LD /O2 /W3 /utf-8 /DUNICODE ets2-ai\ets2ai\universal_plugin.c /Fe:ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll /link /DEF:ets2-ai\ets2ai\universal.def kernel32.lib user32.lib || exit /b 1
          if not exist ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll exit /b 1
          dumpbin /exports ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll | findstr /C:"scs_telemetry_init" || exit /b 1
          dir /b ets2-ai\bridge\dlls\ets2ai\universal\x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86                     # cross: gera 32-bit do host 64
      - name: Compila DLL UNIVERSAL x86 (ets2ai)
        shell: cmd
        run: |
          mkdir ets2-ai\bridge\dlls\ets2ai\universal\x86 2>nul
          cl /nologo /LD /O2 /W3 /utf-8 /DUNICODE ets2-ai\ets2ai\universal_plugin.c /Fe:ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll /link /DEF:ets2-ai\ets2ai\universal.def kernel32.lib user32.lib || exit /b 1
          if not exist ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll exit /b 1
          dumpbin /exports ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll | findstr /C:"scs_telemetry_init" || exit /b 1
          dir /b ets2-ai\bridge\dlls\ets2ai\universal\x86
      - name: Baixa telemetria (TODAS as releases do plugin, MIT) + adb
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BANCO DE DLLs: TODAS as releases do plugin oficial de telemetria
          # (MIT) — RenCloud/scs-sdk-plugin (sucessor) + nlhans/ets2-sdk-plugin
          # (original) — em bridge/dlls/<repo>/<tag>/<arquitetura>/.
          # O .exe ANALISA o jogo (steam.inf + win_x64/x86) e instala a ideal.
          New-Item -ItemType Directory -Force ets2-ai/bridge/dlls | Out-Null
          foreach ($repo in @("RenCloud/scs-sdk-plugin", "nlhans/ets2-sdk-plugin")) {
            $short = if ($repo -like "RenCloud*") { "rencloud" } else { "nlhans" }
            $rels = gh api "repos/$repo/releases" --paginate --jq '.[] | .tag_name as $t | .assets[] | select(.name | test("source"; "i") | not) | "\($t)|\(.browser_download_url)"'
            if (-not $rels) { Write-Host "::warning::gh api nao listou releases de $repo" }
            foreach ($line in $rels) {
              $parts = $line -split '\|'
              $tag = $parts[0]; $url = $parts[1]
              if (-not $url) { continue }
              $tagdir = ($tag -replace '[^A-Za-z0-9._-]', '_')
              Write-Host "banco: $short $tag"
              curl.exe -fsSL --retry 3 -o rel.zip $url
              if (-not (Test-Path rel.zip)) { Write-Host "::warning::sem download: $tag"; continue }
              Expand-Archive rel.zip -DestinationPath relx -Force
              foreach ($arch in @('x64','x86')) {
                $is64 = [bool]($arch -eq 'x64')
                $dll = Get-ChildItem relx -Recurse -Filter *telemetry*.dll | Where-Object {
                  ($_.Name -notmatch 'demo|csharp|client') -and
                  (([bool]($_.FullName -match 'x64|win64|amd64')) -eq $is64)
                } | Sort-Object { if ($_.Name -like 'scs-telemetry*') {0}
                                  elseif ($_.Name -like 'ets2-telemetry*') {1} else {2} } |
                  Select-Object -First 1
                if ($dll) {
                  $dst = "ets2-ai/bridge/dlls/$short/$tagdir/$arch"
                  New-Item -ItemType Directory -Force $dst | Out-Null
                  Copy-Item $dll.FullName "$dst/scs-telemetry.dll" -Force
                }
              }
              Remove-Item relx, rel.zip -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $n = (Get-ChildItem ets2-ai/bridge/dlls -Recurse -Filter *.dll | Measure-Object).Count
          Write-Host "BANCO: $n DLLs de telemetria embutidas"
          if ($n -eq 0) { throw "banco de DLLs vazio — downloads falharam" }
          if ($n -lt 12) { Write-Host "::warning::banco pequeno ($n DLLs) — checar downloads" }
          # DLL unica (legado/fallback): a mais recente
          curl.exe -fsSL --retry 3 -o scs.zip https://github.com/RenCloud/scs-sdk-plugin/releases/download/V.1.12.1/release_v_1_12_1.zip
          Expand-Archive scs.zip -DestinationPath scs-dist -Force
          $dll = Get-ChildItem scs-dist -Recurse -Filter scs-telemetry*.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem scs-dist -Recurse -Filter scs-telemetry*.dll | Select-Object -First 1 }
          Copy-Item $dll.FullName ets2-ai/bridge/scs-telemetry.dll
          # adb (platform-tools, Apache-2.0): tunel USB 'adb reverse' no bridge
          curl.exe -fsSL --retry 3 -o ptools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          Expand-Archive ptools.zip -DestinationPath ptools -Force
          Copy-Item ptools/platform-tools/adb.exe ets2-ai/bridge/
          Copy-Item ptools/platform-tools/AdbWinApi.dll ets2-ai/bridge/
          Copy-Item ptools/platform-tools/AdbWinUSBApi.dll ets2-ai/bridge/
          Get-ChildItem ets2-ai/bridge
      - name: Empacota o bridge (pesos + telemetria + adb embutidos)
        shell: pwsh
        run: |
          cd ets2-ai
          $pyargs = @('--onefile','--noconsole','--name','ETS2-AI-bridge',
            '--paths','.',
            '--add-data','artifacts/model-weights.json;artifacts')
          if (Test-Path artifacts/model-nano.json) {
            $pyargs += @('--add-data','artifacts/model-nano.json;artifacts')
            Write-Host "nano DESTILADA embutida no exe (IA no PC fraco)"
          } else {
            Write-Host "sem nano (gate da destilacao reprovado) — PC fraco cai no celular"
          }
          if (Test-Path ets2ai/dados/traces-hf.json) {
            $pyargs += @('--add-data','ets2ai/dados/traces-hf.json;ets2ai/dados')
            Write-Host "TREINO REAL: calibracao de traces HF embutida no exe"
          }
          if (-not (Test-Path "bridge/dlls/ets2ai/universal/x64/scs-telemetry.dll") -or
              -not (Test-Path "bridge/dlls/ets2ai/universal/x86/scs-telemetry.dll")) {
            throw "DLL UNIVERSAL nao foi compilada — build nao pode seguir"
          }
          $bank = Get-ChildItem bridge/dlls -Recurse -Filter *.dll -ErrorAction SilentlyContinue
          if ($bank) {
            $pyargs += @('--add-data','bridge/dlls;dlls')
            Write-Host "BANCO de DLLs de telemetria embutido: $($bank.Count) arquivos (todas as releases)"
          } else {
            Write-Host "::warning::banco de DLLs vazio — só a DLL única será embutida"
          }
          $pyargs += @(
            '--add-data','bridge/scs-telemetry.dll;.',
            '--add-data','ets2ai/mem_offsets.json;ets2ai',
            '--add-data','bridge/adb.exe;.',
            '--add-data','bridge/AdbWinApi.dll;.',
            '--add-data','bridge/AdbWinUSBApi.dll;.',
            '--hidden-import','ets2ai',
            'bridge/ets2_bridge.py')
          pyinstaller @pyargs
      - name: Smoke test (importa e carrega pesos)
        shell: pwsh
        run: |
          cd ets2-ai
          # exe e --noconsole: `& exe` nao espera → Start-Process -Wait
          $p = Start-Process -FilePath (Resolve-Path "dist/ETS2-AI-bridge.exe").Path `
            -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test: exit $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-bridge-exe
          path: ets2-ai/dist/ETS2-AI-bridge.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ets2ai-universal-dlls
          path: |
            ets2-ai/bridge/dlls/ets2ai/universal/x64/scs-telemetry.dll
            ets2-ai/bridge/dlls/ets2ai/universal/x86/scs-telemetry.dll

  windows-exe-x86:
    name: EXE 32-bit p/ Windows antigo (ETS2-AI-bridge-x86.exe)
    needs: [kaggle-train]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x86
      - name: Dependencias
        run: |
          pip install --retries 5 --timeout 90 pyinstaller==6.11.1 numpy==2.2.6 pywin32==308
      - uses: ilammy/msvc-dev-cmd@v1        # MSVC no PATH (vswhere robusto)
        with:
          arch: x64
      - name: Compila DLL UNIVERSAL x64 (ets2ai)
        shell: cmd
        run: |
          mkdir ets2-ai\bridge\dlls\ets2ai\universal\x64 2>nul
          cl /nologo /LD /O2 /W3 /utf-8 /DUNICODE ets2-ai\ets2ai\universal_plugin.c /Fe:ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll /link /DEF:ets2-ai\ets2ai\universal.def kernel32.lib user32.lib || exit /b 1
          if not exist ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll exit /b 1
          dumpbin /exports ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll | findstr /C:"scs_telemetry_init" || exit /b 1
          dir /b ets2-ai\bridge\dlls\ets2ai\universal\x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86                     # cross: gera 32-bit do host 64
      - name: Compila DLL UNIVERSAL x86 (ets2ai)
        shell: cmd
        run: |
          mkdir ets2-ai\bridge\dlls\ets2ai\universal\x86 2>nul
          cl /nologo /LD /O2 /W3 /utf-8 /DUNICODE ets2-ai\ets2ai\universal_plugin.c /Fe:ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll /link /DEF:ets2-ai\ets2ai\universal.def kernel32.lib user32.lib || exit /b 1
          if not exist ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll exit /b 1
          dumpbin /exports ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll | findstr /C:"scs_telemetry_init" || exit /b 1
          dir /b ets2-ai\bridge\dlls\ets2ai\universal\x86
      - name: Baixa telemetria (TODAS as releases do plugin, MIT) + adb
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BANCO DE DLLs: TODAS as releases do plugin oficial de telemetria
          # (MIT) — RenCloud/scs-sdk-plugin (sucessor) + nlhans/ets2-sdk-plugin
          # (original) — em bridge/dlls/<repo>/<tag>/<arquitetura>/.
          # O .exe ANALISA o jogo (steam.inf + win_x64/x86) e instala a ideal.
          New-Item -ItemType Directory -Force ets2-ai/bridge/dlls | Out-Null
          foreach ($repo in @("RenCloud/scs-sdk-plugin", "nlhans/ets2-sdk-plugin")) {
            $short = if ($repo -like "RenCloud*") { "rencloud" } else { "nlhans" }
            $rels = gh api "repos/$repo/releases" --paginate --jq '.[] | .tag_name as $t | .assets[] | select(.name | test("source"; "i") | not) | "\($t)|\(.browser_download_url)"'
            if (-not $rels) { Write-Host "::warning::gh api nao listou releases de $repo" }
            foreach ($line in $rels) {
              $parts = $line -split '\|'
              $tag = $parts[0]; $url = $parts[1]
              if (-not $url) { continue }
              $tagdir = ($tag -replace '[^A-Za-z0-9._-]', '_')
              Write-Host "banco: $short $tag"
              curl.exe -fsSL --retry 3 -o rel.zip $url
              if (-not (Test-Path rel.zip)) { Write-Host "::warning::sem download: $tag"; continue }
              Expand-Archive rel.zip -DestinationPath relx -Force
              foreach ($arch in @('x64','x86')) {
                $is64 = [bool]($arch -eq 'x64')
                $dll = Get-ChildItem relx -Recurse -Filter *telemetry*.dll | Where-Object {
                  ($_.Name -notmatch 'demo|csharp|client') -and
                  (([bool]($_.FullName -match 'x64|win64|amd64')) -eq $is64)
                } | Sort-Object { if ($_.Name -like 'scs-telemetry*') {0}
                                  elseif ($_.Name -like 'ets2-telemetry*') {1} else {2} } |
                  Select-Object -First 1
                if ($dll) {
                  $dst = "ets2-ai/bridge/dlls/$short/$tagdir/$arch"
                  New-Item -ItemType Directory -Force $dst | Out-Null
                  Copy-Item $dll.FullName "$dst/scs-telemetry.dll" -Force
                }
              }
              Remove-Item relx, rel.zip -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $n = (Get-ChildItem ets2-ai/bridge/dlls -Recurse -Filter *.dll | Measure-Object).Count
          Write-Host "BANCO: $n DLLs de telemetria embutidas"
          if ($n -eq 0) { throw "banco de DLLs vazio — downloads falharam" }
          if ($n -lt 12) { Write-Host "::warning::banco pequeno ($n DLLs) — checar downloads" }
          # DLL unica (legado/fallback): a mais recente
          curl.exe -fsSL --retry 3 -o scs.zip https://github.com/RenCloud/scs-sdk-plugin/releases/download/V.1.12.1/release_v_1_12_1.zip
          Expand-Archive scs.zip -DestinationPath scs-dist -Force
          $dll = Get-ChildItem scs-dist -Recurse -Filter scs-telemetry*.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem scs-dist -Recurse -Filter scs-telemetry*.dll | Select-Object -First 1 }
          Copy-Item $dll.FullName ets2-ai/bridge/scs-telemetry.dll
          # adb (platform-tools, Apache-2.0): tunel USB 'adb reverse' no bridge
          curl.exe -fsSL --retry 3 -o ptools.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          Expand-Archive ptools.zip -DestinationPath ptools -Force
          Copy-Item ptools/platform-tools/adb.exe ets2-ai/bridge/
          Copy-Item ptools/platform-tools/AdbWinApi.dll ets2-ai/bridge/
          Copy-Item ptools/platform-tools/AdbWinUSBApi.dll ets2-ai/bridge/
          Get-ChildItem ets2-ai/bridge
      - name: Empacota o bridge (pesos + telemetria + adb embutidos)
        shell: pwsh
        run: |
          cd ets2-ai
          $pyargs = @('--onefile','--noconsole','--name','ETS2-AI-bridge-x86',
            '--paths','.',
            '--add-data','artifacts/model-weights.json;artifacts')
          if (Test-Path artifacts/model-nano.json) {
            $pyargs += @('--add-data','artifacts/model-nano.json;artifacts')
            Write-Host "nano DESTILADA embutida no exe (IA no PC fraco)"
          } else {
            Write-Host "sem nano (gate da destilacao reprovado) — PC fraco cai no celular"
          }
          if (Test-Path ets2ai/dados/traces-hf.json) {
            $pyargs += @('--add-data','ets2ai/dados/traces-hf.json;ets2ai/dados')
            Write-Host "TREINO REAL: calibracao de traces HF embutida no exe"
          }
          if (-not (Test-Path "bridge/dlls/ets2ai/universal/x64/scs-telemetry.dll") -or
              -not (Test-Path "bridge/dlls/ets2ai/universal/x86/scs-telemetry.dll")) {
            throw "DLL UNIVERSAL nao foi compilada — build nao pode seguir"
          }
          $bank = Get-ChildItem bridge/dlls -Recurse -Filter *.dll -ErrorAction SilentlyContinue
          if ($bank) {
            $pyargs += @('--add-data','bridge/dlls;dlls')
            Write-Host "BANCO de DLLs de telemetria embutido: $($bank.Count) arquivos (todas as releases)"
          } else {
            Write-Host "::warning::banco de DLLs vazio — só a DLL única será embutida"
          }
          $pyargs += @(
            '--add-data','bridge/scs-telemetry.dll;.',
            '--add-data','ets2ai/mem_offsets.json;ets2ai',
            '--add-data','bridge/adb.exe;.',
            '--add-data','bridge/AdbWinApi.dll;.',
            '--add-data','bridge/AdbWinUSBApi.dll;.',
            '--hidden-import','ets2ai',
            'bridge/ets2_bridge.py')
          pyinstaller @pyargs
      - name: Smoke test (importa e carrega pesos)
        shell: pwsh
        run: |
          cd ets2-ai
          # exe e --noconsole: `& exe` nao espera → Start-Process -Wait
          $p = Start-Process -FilePath (Resolve-Path "dist/ETS2-AI-bridge-x86.exe").Path `
            -ArgumentList "--help" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "smoke test: exit $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-bridge-exe-x86
          path: ets2-ai/dist/ETS2-AI-bridge-x86.exe

  exe-cpp:
    name: EXE C++ puro (sem Python, sem adb, sem APK)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
