            sleep 10
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-bridge-cpp-x86
          path: dist-cpp-x86/ETS2-AI-bridge-x86.exe

  validacao-windows:
    name: Validacao Windows REAL (exe + DLL ideal + telemetria ponta a ponta)
    needs: [windows-exe, windows-exe-x86, exe-cpp]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ETS2-AI-bridge-exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ETS2-AI-bridge-exe-x86
          path: dist-x86
      - uses: actions/download-artifact@v4
        with:
          name: ETS2-AI-bridge-cpp
          path: dist-cpp
      - uses: actions/download-artifact@v4
        with:
          name: ETS2-AI-bridge-cpp-x86
          path: dist-cpp-x86
      - name: Autoteste do exe em ETS2 falsos (5 versoes) + telemetria real
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ETS2 FALSOS: pasta com bin/win_xX + steam.inf da versao. O exe
          # tem que: achar a pasta, ANALISAR a versao, instalar a DLL IDEAL
          # (a release certa daquela versao) e ler TELEMETRIA REAL (um
          # "jogo falso" cria a memoria compartilhada Local\SCSTelemetry
          # exatamente como o plugin faz no processo do jogo).
          # TODAS as versoes do ETS2 — 1.0 ate 1.61 (62 versoes principais),
          # uma a uma, + BETAS e casos hostis. A DLL esperada segue a MESMA
          # tabela que o exe usa em producao (DLL_BANK).
          $cases = @()
          foreach ($i in 0..61) {
            $v = "1.$i"
            if ($i -ge 36) {
              $cases += @{ v=$v; inf="exe_version_info=$v.2.1s"; arch='win_x64'; want='universal' }
            } elseif ($i -ge 32) {
              $cases += @{ v=$v; inf="PatchVersion=$v.2.2;"; arch='win_x64'; want='v.1.9.0' }
            } elseif ($i -ge 17) {
              $cases += @{ v=$v; inf="exe_version_info=$v.2.1s"; arch='win_x86'; want='revision_5_rel_1_4_0' }
            } elseif ($i -ge 10) {
              $cases += @{ v=$v; inf="exe_version_info=$v.2.1s"; arch='win_x86'; want='revision_3_rel_1_2_1' }
            } else {
              $cases += @{ v=$v; inf="exe_version_info=$v.2.1s"; arch='win_x86'; want='revision_1' }
            }
          }
          # BETAS e casos hostis: build de branch temporaria, sufixo de beta,
          # versao FUTURA, steam.inf AUSENTE e ILEGIVEL.
          $cases += @(
            @{ v='1.62-beta-futura';  inf='exe_version_info=1.62.0.1s';  arch='win_x64'; want='universal' },
            @{ v='1.46-com-sufixo-b'; inf='exe_version_info=1.46.1.1b';  arch='win_x64'; want='universal' },
            @{ v='1.40-temp-branch';  inf='exe_version_info=1.40.0.4s';  arch='win_x64'; want='universal' },
            @{ v='1.37-open-beta';    inf='exe_version_info=1.37.0.6s';  arch='win_x64'; want='universal' },
            @{ v='1.34-beta-antiga';  inf='PatchVersion=1.34.0.4;';      arch='win_x64'; want='v.1.9.0' },
            @{ v='1.16-beta-x86';     inf='exe_version_info=1.16.1.1b';  arch='win_x86'; want='revision_3_rel_1_2_1' },
            @{ v='sem-steam-inf';     inf=$null;                          arch='win_x64'; want='universal' },
            @{ v='steam-inf-ilegivel';inf='version=etsdois beta';         arch='win_x86'; want='universal' }
          )
          $fails = 0
          foreach ($c in $cases) {
            $g = "C:\fake\ets2-$($c.v)"
            New-Item -ItemType Directory -Force "$g\bin\$($c.arch)" | Out-Null
            if ($null -ne $c.inf) {
              Set-Content -Path "$g\steam.inf" -Value $c.inf -Encoding ascii
            } else {
              Remove-Item "$g\steam.inf" -Force -ErrorAction SilentlyContinue
            }
            # exe e --noconsole (GUI): `& exe` NAO espera o processo voltar
            # ($LASTEXITCODE ficaria $null) → Start-Process -Wait -PassThru.
            $exe = (Resolve-Path "dist\ETS2-AI-bridge.exe").Path
            $p = Start-Process -FilePath $exe `
              -ArgumentList "--autoteste","--game-dir",$g,"--saida","C:\fake\res-$($c.v).json" `
              -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              Write-Host "::error::autoteste FALHOU no ETS2 $($c.v) ($($c.arch)) — exit $($p.ExitCode)"
              $fails++
            }
            if (-not (Test-Path "C:\fake\res-$($c.v).json")) {
              Write-Host "::error::exe nao escreveu res-$($c.v).json (excecao antes do fim?)"
              $fails++
              continue
            }
            $r = Get-Content "C:\fake\res-$($c.v).json" -Raw | ConvertFrom-Json
            Write-Host "===== ETS2 $($c.v) ($($c.arch)) ====="
            $r.steps | ForEach-Object { Write-Host ("  {0,-6} {1} {2}" -f $_.status, $_.step, $_.detail) }
            if ($r.dll_tag -ne $c.want) {
              Write-Host "::error::ETS2 $($c.v): escolheu '$($r.dll_tag)', esperado '$($c.want)'"
              $fails++
            } else {
              Write-Host ("ETS2 {0} ({1}): DLL {2} {3} OK | telemetria {4} | banco {5} DLLs | oficial {6} inf/s" `
                -f $c.v, $c.arch, $r.dll_repo, $r.dll_tag, $r.telemetria, $r.banco_dlls, $r.oficial_inf_s)
            }
          }
          # EXE 32-BIT (Windows antigo): mesmo autoteste no build x86
          $g86 = "C:\fake\ets2-x86check"
          New-Item -ItemType Directory -Force "$g86\bin\win_x64" | Out-Null
          Set-Content -Path "$g86\steam.inf" -Value "exe_version_info=1.61.1.1s" -Encoding ascii
          $p86 = Start-Process -FilePath (Resolve-Path "dist-x86\ETS2-AI-bridge-x86.exe").Path `
            -ArgumentList "--autoteste","--game-dir",$g86,"--saida","C:\fake\res-x86.json" `
            -Wait -PassThru
          if ($p86.ExitCode -ne 0) {
            Write-Host "::error::autoteste do EXE 32-BIT falhou — exit $($p86.ExitCode)"
            $fails++
          } else {
            Write-Host "EXE 32-bit (Windows antigo): autoteste OK"
          }
          # CASO OPTIJUEGOS (repack portatil, SEM Steam): o jogo esta
          # ABERTO — processo eurotrucks2.exe DE VERDADE rodando (cmd
          # renomeado, janela oculta) — numa pasta que NAO e a do cache.
          # O exe tem que seguir o JOGO ABERTO (nao o cache), analisar a
          # versao do repack e instalar a DLL CERTA dele.
          $steamFake = "C:\fake\steam\ETS2"
          $repack    = "C:\Juegos\ETS2.Repack-OptiJuegos\Euro Truck Simulator 2"
          foreach ($d in @($steamFake, $repack)) {
            New-Item -ItemType Directory -Force "$d\bin\win_x64" | Out-Null
          }
          Set-Content "$steamFake\steam.inf" "exe_version_info=1.61.1.1s" -Encoding ascii
          Set-Content "$repack\steam.inf"    "exe_version_info=1.45.1.1s" -Encoding ascii
          # 1) envenena o cache com a instalacao "errada" (a do Steam 1.61)
          $null = Start-Process -FilePath $exe `
            -ArgumentList "--autoteste","--game-dir",$steamFake,"--saida","C:\fake\res-seed.json" `
            -Wait -PassThru
          # 2) ABRE o jogo do repack (processo real rodando, oculto)
          Copy-Item C:\Windows\System32\cmd.exe "$repack\bin\win_x64\eurotrucks2.exe" -Force
          $game = Start-Process -FilePath "$repack\bin\win_x64\eurotrucks2.exe" `
            -ArgumentList "/c ping -n 120 127.0.0.1 > nul" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 2
          # 3) autoteste SEM --game-dir: tem que seguir o jogo ABERTO
          $pr = Start-Process -FilePath $exe `
            -ArgumentList "--autoteste","--saida","C:\fake\res-repack.json" `
            -Wait -PassThru
          Stop-Process -Id $game.Id -Force -ErrorAction SilentlyContinue
          if ($pr.ExitCode -ne 0) {
            Write-Host "::error::optijuegos: autoteste falhou — exit $($pr.ExitCode)"
            $fails++
          } elseif (-not (Test-Path "C:\fake\res-repack.json")) {
            Write-Host "::error::optijuegos: exe nao escreveu res-repack.json"
            $fails++
          } else {
            $rr = Get-Content "C:\fake\res-repack.json" -Raw | ConvertFrom-Json
            if ("$($rr.game_dir)" -ne "$repack" -or $rr.dll_tag -ne "universal") {
              Write-Host "::error::optijuegos: jogo ABERTO em $repack mas o exe escolheu '$($rr.game_dir)' / DLL $($rr.dll_tag)"
              $fails++
            } else {
              Write-Host "OPTIJUEGOS OK: jogo ABERTO (repack 1.45 em C:\Juegos) venceu o cache (Steam 1.61) e a DLL certa do repack foi instalada ($($rr.dll_tag))"
            }
          }
          if ($fails -gt 0) { exit 1 }
          Write-Host ("VALIDACAO WINDOWS REAL: {0}/{0} versoes OK (TODAS: 1.0 ate 1.61 + BETAS) + EXE 32-bit + caso OPTIJUEGOS com o jogo ABERTO" -f $cases.Count)

