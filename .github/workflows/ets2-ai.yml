name: ETS2-AI build (APK + EXE + TFLite)

on:
  push:
    branches: [arena/01a0f37d-5]
    paths: ['ets2-ai/**', '.github/workflows/ets2-ai.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-verify:
    name: Retreino deterministico + testes de qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 numpy==2.2.6 pytest==9.1.1
      - name: Retreina do zero (mesma semente -> mesmos pesos)
        run: |
          cd ets2-ai
          python -m ets2ai.train --epochs 550 --out .cache/retrain 2>&1 | tee ../.cache_train.log
      - name: Compara com os pesos commitados (gates robustos)
        run: |
          cd ets2-ai
          python - <<'PY' 2>&1 | tee ../.cache_compare.log
          import sys; sys.path.insert(0, ".")
          import numpy as np
          from ets2ai.contract import load_weights
          from ets2ai.train import closed_loop_eval
          a, ma = load_weights("artifacts/model-weights.json")
          b, mb = load_weights(".cache/retrain/model-weights.json")
          worst = 0.0
          for (w1, b1), (w2, b2) in zip(a, b):
              worst = max(worst, float(np.max(np.abs(w1 - w2))), float(np.max(np.abs(b1 - b2))))
          la, lb = ma["final_loss"], mb["final_loss"]
          print(f"pior delta pesos: {worst:.2e} | loss commitado {la:.5f} vs retreino {lb:.5f}")
          assert worst < 5e-3, "divergencia de pesos acima do orcamento"
          assert abs(la - lb) < 0.05 * max(la, 1e-9) + 1e-4, "loss divergiu"
          agg, rows = closed_loop_eval(b, n_roads=3)
          print(f"circuito fechado do RETREINO: {agg['finish_rate']*100:.0f}% rotas, "
                f"{agg['in_lane_pct']*100:.0f}% faixa")
          assert agg["finish_rate"] >= 2/3 and agg["in_lane_pct"] > 0.95
          print("REPRODUTIBILIDADE OK (mesma qualidade, mesmo comportamento)")
          PY
      - name: Testes (pytest)
        run: |
          cd ets2-ai
          pytest tests/ -q
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-train
          { echo "=== train-verify run ${{ github.run_id }} sha $GITHUB_SHA ==="
            echo "--- .cache_train.log (ultimas 60 linhas)"; tail -60 .cache_train.log 2>/dev/null
            echo "--- .cache_compare.log"; cat .cache_compare.log 2>/dev/null; } \
            > ci-logs/${{ github.run_id }}-train/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: train-verify run ${{ github.run_id }} [skip ci]" || true
          git push || true
          exit 1

  java-parity:
    name: Paridade Java (inferencia do APK) x numpy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compila e confere
        run: |
          set -x
          pip install --retries 5 --timeout 90 numpy==2.2.6 2>&1 | tee .cache_check_java.log
          bash ets2-ai/android/check_java.sh 2>&1 | tee -a .cache_check_java.log
          exit ${PIPESTATUS[0]}
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-java
          { echo "=== java-parity run ${{ github.run_id }} sha $GITHUB_SHA ==="
            echo "--- check_java.log completo"; cat .cache_check_java.log 2>/dev/null; } \
            > ci-logs/${{ github.run_id }}-java/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: java-parity run ${{ github.run_id }} [skip ci]" || true
          git push || true
          exit 1

  tflite-export:
    name: Exporta TFLite (float32 + int8)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 tensorflow-cpu==2.19.0 2>&1 | tee .cache_tflite_pip.log
      - name: Converte e valida contra numpy
        run: |
          cd ets2-ai
          python -m ets2ai.export_tflite --weights artifacts/model-weights.json --out .cache/tflite 2>&1 | tee ../.cache_tflite.log
          exit ${PIPESTATUS[0]}
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-tflite
          { echo "=== tflite run ${{ github.run_id }} sha $GITHUB_SHA ==="
            echo "--- tflite pip log"; tail -30 .cache_tflite_pip.log 2>/dev/null
            echo "--- tflite log"; tail -60 .cache_tflite.log 2>/dev/null
            echo "--- pip list"; pip list 2>/dev/null | grep -iE "tensorflow|numpy|keras"; } \
            > ci-logs/${{ github.run_id }}-tflite/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: tflite run ${{ github.run_id }} [skip ci]" || true
          git push || true
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ets2-ai-tflite
          path: |
            ets2-ai/.cache/tflite/ets2ai-float32.tflite
            ets2-ai/.cache/tflite/ets2ai-int8.tflite

  android-apk:
    name: APK assinado (ETS2-AI-mobile.apk)
    needs: [train-verify, java-parity, tflite-export]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Baixa o modelo TFLite do job anterior
        uses: actions/download-artifact@v4
        with:
          name: ets2-ai-tflite
          path: ets2-ai/.cache/tflite-in
      - name: Build (aapt2 -> javac -> d8 -> apksigner; TFLite runtime opcional)
        run: |
          TFLITE_MODEL=ets2-ai/.cache/tflite-in/ets2ai-float32.tflite \
          TFLITE_AAR=1 bash ets2-ai/android/build_apk.sh 2>&1 | tee .cache_apk.log
          exit ${PIPESTATUS[0]}
      - name: Conteudo do APK (evidencia)
        run: unzip -l ets2-ai/dist/ETS2-AI-mobile.apk
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-apk
          { echo "=== apk run ${{ github.run_id }} sha $GITHUB_SHA ==="
            echo "--- build log"; cat .cache_apk.log 2>/dev/null; } \
            > ci-logs/${{ github.run_id }}-apk/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: apk run ${{ github.run_id }} [skip ci]" || true
          git push || true
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-mobile-apk
          path: ets2-ai/dist/ETS2-AI-mobile.apk

  windows-exe:
    name: EXE para Windows (ETS2-AI-bridge.exe)
    needs: [train-verify]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          pip install --retries 5 --timeout 90 pyinstaller==6.11.1 numpy==2.2.6
      - name: Empacota o bridge (pesos embutidos)
        shell: pwsh
        run: |
          cd ets2-ai
          pyinstaller --onefile --name ETS2-AI-bridge `
            --paths . `
            --add-data "artifacts/model-weights.json;artifacts" `
            --hidden-import ets2ai `
            bridge/ets2_bridge.py
      - name: Smoke test (importa e carrega pesos)
        shell: pwsh
        run: |
          cd ets2-ai
          dist/ETS2-AI-bridge.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-bridge-exe
          path: ets2-ai/dist/ETS2-AI-bridge.exe

  kaggle-train:
    name: Treino no Kaggle (opcional, via secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 kaggle numpy pytest
      - name: Empurra kernel, aguarda e valida pesos do Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python ets2-ai/kaggle/push.py --timeout 900 || code=$?
          if [ "${code:-0}" = "2" ]; then
            echo "::warning::Secrets KAGGLE_USERNAME/KAGGLE_KEY nao configurados — veja ets2-ai/kaggle/push.py"
            exit 0
          fi
          if [ "${code:-0}" != "0" ]; then
            echo "::warning::Treino no Kaggle falhou; o treino local (train-verify) continua sendo a fonte oficial."
            exit 0
          fi
          echo "Treino no Kaggle validado com os mesmos gates."
      - name: Pesos treinados no Kaggle (se houver)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ets2-ai-kaggle-weights
          path: |
            ets2-ai/.cache/kaggle-out/model-weights.json
            ets2-ai/.cache/kaggle-out/metrics.json
          if-no-files-found: ignore

  release:
    name: Release com APK + EXE + TFLite
    needs: [android-apk, windows-exe, tflite-export]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: ets2-ai/.cache/rel
      - name: Publica release ets2-ai-v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ets2-ai/.cache/release
          cp ets2-ai/.cache/rel/ETS2-AI-mobile-apk/ETS2-AI-mobile.apk ets2-ai/.cache/release/
          cp ets2-ai/.cache/rel/ETS2-AI-bridge-exe/ETS2-AI-bridge.exe ets2-ai/.cache/release/
          cp ets2-ai/.cache/rel/ets2-ai-tflite/*.tflite ets2-ai/.cache/release/
          cp ets2-ai/artifacts/model-weights.json ets2-ai/.cache/release/
          cp ets2-ai/artifacts/metrics.json ets2-ai/.cache/release/
          NOTES="$(python3 -c "import json;m=json.load(open('ets2-ai/artifacts/metrics.json'));c=m['closed_loop'];print(f\"MSE validacao: {m['mse_val']:.5f} (meta <= {m['loss_target']}) | circuito fechado: {c['finish_rate']*100:.0f}% rotas, {c['in_lane_pct']*100:.0f}% faixa, {c['avg_speed_kmh']:.0f} km/h, radares {c['radar_compliance']*100:.0f}%, lat max {c['max_lat_accel']:.2f} m/s2 (tombamento {3.6})\")")"
          gh release create ets2-ai-v0.2.0 \
            --title "ETS2-AI v0.2.0 — velocista: radares, GPS estrito, dispatcher, teclado BT, Kaggle" \
            --notes "$NOTES" \
            ets2-ai/.cache/release/* 2>/dev/null || \
          gh release upload ets2-ai-v0.2.0 ets2-ai/.cache/release/* --clobber
