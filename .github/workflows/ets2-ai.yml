      - name: Compila DLL UNIVERSAL x64 (ets2ai)
        shell: cmd
        run: |
          mkdir ets2-ai\bridge\dlls\ets2ai\universal\x64 2>nul
          cl /nologo /LD /O2 /W3 /utf-8 /DUNICODE ets2-ai\ets2ai\universal_plugin.c /Fe:ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll /link /DEF:ets2-ai\ets2ai\universal.def kernel32.lib user32.lib || exit /b 1
          dumpbin /exports ets2-ai\bridge\dlls\ets2ai\universal\x64\scs-telemetry.dll | findstr /C:"scs_telemetry_init" || exit /b 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
      - name: Compila DLL UNIVERSAL x86 (ets2ai)
        shell: cmd
        run: |
          mkdir ets2-ai\bridge\dlls\ets2ai\universal\x86 2>nul
          cl /nologo /LD /O2 /W3 /utf-8 /DUNICODE ets2-ai\ets2ai\universal_plugin.c /Fe:ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll /link /DEF:ets2-ai\ets2ai\universal.def kernel32.lib user32.lib || exit /b 1
          dumpbin /exports ets2-ai\bridge\dlls\ets2ai\universal\x86\scs-telemetry.dll | findstr /C:"scs_telemetry_init" || exit /b 1
      - name: Baixa o BANCO de DLLs (todas as releases oficiais, MIT)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force ets2-ai/bridge/dlls | Out-Null
          foreach ($repo in @("RenCloud/scs-sdk-plugin", "nlhans/ets2-sdk-plugin")) {
            $short = if ($repo -like "RenCloud*") { "rencloud" } else { "nlhans" }
            $rels = gh api "repos/$repo/releases" --paginate --jq '.[] | .tag_name as $t | .assets[] | select(.name | test("source"; "i") | not) | "\($t)|\(.browser_download_url)"'
            foreach ($line in $rels) {
              $parts = $line -split '\|'
              $tag = $parts[0]; $url = $parts[1]
              if (-not $url) { continue }
              $tagdir = ($tag -replace '[^A-Za-z0-9._-]', '_')
              curl.exe -fsSL --retry 3 -o rel.zip $url
              if (-not (Test-Path rel.zip)) { Write-Host "::warning::sem download: $tag"; continue }
              Expand-Archive rel.zip -DestinationPath relx -Force
              foreach ($arch in @('x64','x86')) {
                $is64 = [bool]($arch -eq 'x64')
                $dll = Get-ChildItem relx -Recurse -Filter *telemetry*.dll | Where-Object {
                  ($_.Name -notmatch 'demo|csharp|client') -and
                  (([bool]($_.FullName -match 'x64|win64|amd64')) -eq $is64)
                } | Sort-Object { if ($_.Name -like 'scs-telemetry*') {0}
                                  elseif ($_.Name -like 'ets2-telemetry*') {1} else {2} } |
                  Select-Object -First 1
                if ($dll) {
                  $dst = "ets2-ai/bridge/dlls/$short/$tagdir/$arch"
                  New-Item -ItemType Directory -Force $dst | Out-Null
                  Copy-Item $dll.FullName "$dst/scs-telemetry.dll" -Force
                }
              }
              Remove-Item relx, rel.zip -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $n = (Get-ChildItem ets2-ai/bridge/dlls -Recurse -Filter *.dll | Measure-Object).Count
          Write-Host "BANCO: $n DLLs de telemetria"
          if ($n -lt 10) { throw "banco pequeno demais ($n)" }
      - name: Pesos em formato texto (oficial + nano, bit-identicos)
        shell: bash
        run: |
          pip install --retries 5 --timeout 90 numpy
          cd ets2-ai
          python - <<'PY' 2>&1 | tee pesos.log
          import json, sys
          sys.path.insert(0, ".")
          def dump(path, layers, nin, nout, hidden):
              with open(path, "w", newline="\n") as f:
                  f.write("ETS2AI,v1,%d,%d,%s\n" % (nin, nout, ",".join(map(str, hidden))))
                  for (w, b) in layers:
                      for row in w:
                          f.write(",".join(repr(float(v)) for v in row) + "\n")
                      f.write(",".join(repr(float(v)) for v in b) + "\n")
          from ets2ai.contract import load_weights
          layers, meta = load_weights("artifacts/model-weights.json")
          dump("cpp/model-weights.txt", layers,
               len(meta["features"]), len(meta["actions"]), meta["hidden"])
          print("oficial:", len(layers), "camadas", meta["hidden"])
          try:
              nano = json.load(open("artifacts/model-nano.json"))
              nl = [(l["w"], l["b"]) for l in nano["layers"]]
              dump("cpp/model-nano.txt", nl, 13, 3, nano["meta"]["hidden"])
              print("nano:", len(nl), "camadas", nano["meta"]["hidden"])
          except Exception as e:
              print("nano ausente (ok):", e)
          PY
      - name: Gera bridge.rc (recursos — banco de DLLs + pesos)
        shell: pwsh
        run: |
          Start-Transcript -Path rc-gen.log -Force
          # IDs NUMERICOS: rc.exe guarda nomes-string com ASPAS e
          # MAIUSCULADOS (FindResource por nome nao acha). 101 = manifesto,
          # 102 = pesos oficiais, 103 = nano, 110+ = DLLs do banco.
          # Caminhos com BARRA NORMAL (rc interpreta \a como escape C).
          $root = (Resolve-Path ets2-ai/bridge/dlls).Path
          $rc = "ets2-ai/cpp/bridge.rc"
          $man = "ets2-ai/cpp/manifest.txt"
          Set-Content $rc "#include <windows.h>"
          $w1 = ((Resolve-Path ets2-ai/cpp/model-weights.txt).Path) -replace '\\', '/'
          Add-Content $rc "102 RCDATA `"$w1`""
          if (Test-Path ets2-ai/cpp/model-nano.txt) {
            $w2 = ((Resolve-Path ets2-ai/cpp/model-nano.txt).Path) -replace '\\', '/'
            Add-Content $rc "103 RCDATA `"$w2`""
          }
          $id = 110
          $lines = @()
          Get-ChildItem $root -Recurse -Filter scs-telemetry.dll | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length + 1) -split '\\'
            if ($rel.Count -ge 4) {
              $fp = $_.FullName -replace '\\', '/'
              Add-Content $rc "$id RCDATA `"$fp`""
              $lines += "$($rel[0]) $($rel[1]) $($rel[2]) $id"
              $id++
            }
          }
          $lines | Set-Content $man
          $mf = ((Resolve-Path $man).Path) -replace '\\', '/'
          Add-Content $rc "101 RCDATA `"$mf`""
          Write-Host "bridge.rc: $((Get-Content $rc | Measure-Object -Line).Lines) recursos / $($lines.Count) DLLs"
          Get-Content $man | Select-Object -First 4
          Stop-Transcript
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compila EXE C++ x64
        shell: cmd
        run: |
          mkdir dist-cpp 2>nul
          rc /nologo /fo ets2-ai\cpp\bridge.res ets2-ai\cpp\bridge.rc > rc-x64.log 2>&1
          if errorlevel 1 type rc-x64.log & if errorlevel 1 exit /b 1
          cl /nologo /EHsc /O2 /std:c++17 /W3 /utf-8 /arch:AVX2 ets2-ai\cpp\bridge.cpp /Fe:dist-cpp\ETS2-AI-bridge.exe /link user32.lib shell32.lib advapi32.lib gdi32.lib ets2-ai\cpp\bridge.res > build-x64.log 2>&1
          if errorlevel 1 type build-x64.log & if errorlevel 1 exit /b 1
          dist-cpp\ETS2-AI-bridge.exe --info > build-info-x64.log 2>&1
          if errorlevel 1 type build-info-x64.log & if errorlevel 1 exit /b 1
          if not exist dist-cpp\ETS2-AI-bridge.exe exit /b 1
          dist-cpp\ETS2-AI-bridge.exe --bench >> build-x64.log 2>&1
          if errorlevel 1 type build-x64.log & if errorlevel 1 exit /b 1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86
      - name: Compila EXE C++ x86
        shell: cmd
        run: |
          mkdir dist-cpp-x86 2>nul
          rc /nologo /fo ets2-ai\cpp\bridge-x86.res ets2-ai\cpp\bridge.rc > rc-x86.log 2>&1
          if errorlevel 1 type rc-x86.log & if errorlevel 1 exit /b 1
          cl /nologo /EHsc /O2 /std:c++17 /W3 /utf-8 /arch:AVX2 ets2-ai\cpp\bridge.cpp /Fe:dist-cpp-x86\ETS2-AI-bridge-x86.exe /link user32.lib shell32.lib advapi32.lib gdi32.lib ets2-ai\cpp\bridge-x86.res > build-x86.log 2>&1
          if errorlevel 1 type build-x86.log & if errorlevel 1 exit /b 1
          dist-cpp-x86\ETS2-AI-bridge-x86.exe --info > build-info-x86.log 2>&1
          if errorlevel 1 type build-info-x86.log & if errorlevel 1 exit /b 1
          if not exist dist-cpp-x86\ETS2-AI-bridge-x86.exe exit /b 1
          dist-cpp-x86\ETS2-AI-bridge-x86.exe --bench >> build-x86.log 2>&1
          if errorlevel 1 type build-x86.log & if errorlevel 1 exit /b 1
      - name: Diagnostico do build C++ (commita logs no repo)
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p "ci-logs/${{ github.run_id }}-cpp"
          for f in build-x64.log build-x86.log rc-x64.log rc-x86.log rc-gen.log ets2-ai/pesos.log; do
            cp "$f" "ci-logs/${{ github.run_id }}-cpp/" 2>/dev/null || true
          done
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: build C++ run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/01a0f37d-5 || true
            git push && break
            sleep 10
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2-AI-bridge-cpp
          path: dist-cpp/ETS2-AI-bridge.exe
      - name: Info do build (commita SEMPRE — tamanhos + recursos do exe)
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "ci-logs/${{ github.run_id }}-cpp"
          ls -la dist-cpp dist-cpp-x86 > "ci-logs/${{ github.run_id }}-cpp/exe-tamanhos.txt" 2>&1
