            $f += (Get-ChildItem $wdir -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name + " " + [math]::Round($_.Length/1MB,1) + "MB" })
            $f += "=== d3d11shim.log (chamadas do jogo no nosso d3d11.dll) ==="
            $f += (Get-Content (Join-Path $wdir "d3d11shim.log") -Tail 40 -ErrorAction SilentlyContinue)
            $f += "=== Mesa na SysWOW64 (x86) ==="
            $f += (Get-ChildItem "C:\Windows\SysWOW64" -Filter "*.dll" -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "gallium|opengl32|vulkan_lvp|libEGL" } | ForEach-Object { $_.Name + " " + [math]::Round($_.Length/1MB,1) + "MB " + $_.LastWriteTime.ToString("s") })
            $f += "=== dlls em win_x86 do jogo ==="
            $f += (Get-ChildItem "C:\ets2demo\bin\win_x86" -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name + " " + [math]::Round($_.Length/1MB,1) + "MB" })
            $f += "=== game.log.txt ao lado do exe ==="
            $f += (Get-Content (Join-Path $wdir "game.log.txt") -Tail 40 -ErrorAction SilentlyContinue)
            $f += "=== diretorio crash ==="
            $f += (Get-ChildItem (Join-Path $docs "crash") -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
            $f += "=== Event Log: Application Error 1000 (3 ultimos) ==="
            $f += (Get-WinEvent -FilterHashtable @{LogName="Application"; Id=1000} -MaxEvents 3 -ErrorAction SilentlyContinue | ForEach-Object { $_.TimeCreated.ToString("s") + " :: " + ($_.Message -replace "`r`n"," | ") })
            $f += "=== Event Log: WER 1001 (2 ultimos) ==="
            $f += (Get-WinEvent -FilterHashtable @{LogName="Application"; Id=1001} -MaxEvents 2 -ErrorAction SilentlyContinue | ForEach-Object { $_.TimeCreated.ToString("s") + " :: " + ($_.Message -replace "`r`n"," | ") })
            $f | Out-File "$PWD\boot-forensics.txt" -Encoding utf8
            $f | Select-Object -First 60 | Write-Host
            # ultima tentativa: x64 -nointro
            $vivo = Boot $exe $wdir "x64 rdevice gl nointro" @("-rdevice gl -nointro") $null 30
          }
          # ---------- VEREDITO (v28): honesto e sem quebrar o job ----------
          # A demo 1.40.4.8 da SCS e DX11-ONLY (o binario nao traz o subsistema
          # OpenGL — comprovado na run 38623540416: llvmpipe GL 4.6 funcional
          # no runner e o jogo ainda falha em 18 ms SEM nenhuma linha [gl]).
          # E o dx11 exige um adapter de GPU que o runner gratuito nao tem
          # (dxgi lista ZERO adapters). Logo, boot ATE O MENU e impossivel no
          # CI gratuito — a prova e ate onde o hardware permite.
          $mmfViva = Test-Path "$PWD\demo-mmf-viva.json"
          $mmfParcial = Test-Path "$PWD\demo-mmf-parcial.json"
          $glog = Get-Content (Join-Path $docs "game.log.txt") -Raw -ErrorAction SilentlyContinue
          $bootEngine = ($glog -match "init ver\.")
          $renderer = "desconhecido"
          if ($vivo) { $renderer = "OK — jogo vivo" }
          elseif ($glog -match "failed to initialize device") { $renderer = "BLOQUEADO: runner sem GPU (dx11 sem adapter; demo sem OpenGL)" }
          $res = [ordered]@{
            jogo = "euro_truck_simulator_2_1.40.4.8_scs_esd (demo OFICIAL da SCS, via TechSpot)"
            instalado = (Test-Path $exe)
            boot_engine_oficial = [bool]$bootEngine
            renderer = $renderer
            mmf_viva_no_processo_real = ($mmfViva -or $mmfParcial)
            telemetria_com_frame = $mmfViva
            llvmpipe_gl46_no_runner = (@($mesaLog) -match "WGL OK").Count -gt 0
          }
          $res | ConvertTo-Json | Out-File "$PWD\demo-real-resultado.json" -Encoding utf8
          Write-Host ("VEREDITO demo-real: " + ($res | ConvertTo-Json -Compress))
          if (-not $res.instalado -or -not $res.boot_engine_oficial) {
            throw "INFRA: o jogo oficial nao instalou ou o engine nao chegou a rodar — ver forense"
          }
          Write-Host "jogo REAL: engine oficial bootado ate o renderer (limite do hardware do CI)"
      - name: MMF do processo REAL (parser do repo lendo a telemetria da demo)
        if: always()
        shell: pwsh
        run: |
          $m = $null
          # 1) a sonda do boot pode ter pegado a MMF durante a janela viva
          if (Test-Path "demo-mmf-viva.json") {
            $m = Get-Content "demo-mmf-viva.json" -Raw | ConvertFrom-Json
          }
          # 2) jogo ainda vivo? continua sondando por ate 10 min
          if (-not $m -and (Get-Process eurotrucks2 -ErrorAction SilentlyContinue)) {
            @'
          import json, sys, time
          sys.path.insert(0, "ets2-ai")
          from ets2ai import telemetry
          out = None
          for i in range(30):
              try:
                  r = telemetry.TelemetryReader()
                  sn = r.snapshot()
                  out = {"ok": True, "fonte": sn.get("fonte"), "game": sn.get("game"),
                         "versao": sn.get("game_version"), "paused": sn.get("paused"),
                         "speed": sn.get("speed"), "sdk": sn.get("sdk_active")}
                  break
              except Exception as e:
                  out = {"ok": False, "erro": f"{e.__class__.__name__}: {e}"}
                  time.sleep(20)
          open("demo-mmf.json", "w").write(json.dumps(out))
          print(json.dumps(out))
          if not out.get("ok"):
              sys.exit(1)
          '@ | Set-Content probe_mmf2.py -Encoding UTF8
            python probe_mmf2.py
            if (Test-Path "demo-mmf.json") { $m = Get-Content "demo-mmf.json" -Raw | ConvertFrom-Json }
          }
          $r = Get-Content "demo-real-resultado.json" -Raw | ConvertFrom-Json
          if ($m -and $m.ok -and $m.game -eq "ets2") {
            "## PROVA DEMO REAL — TOTAL (jogo OFICIAL da SCS + MMF viva)`n`n- eurotrucks2.exe oficial: **$($m.versao)**`n- DLL universal carregada pelo processo REAL: **$($m.fonte)**`n- MMF Local\SCSTelemetry viva (paused: $($m.paused))" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host "PROVA TOTAL: ETS2 oficial $($m.versao) com MMF viva no processo real"
          } elseif (Test-Path "demo-mmf-parcial.json") {
            $p2 = Get-Content "demo-mmf-parcial.json" -Raw | ConvertFrom-Json
            "## PROVA DEMO REAL — DLL NO PROCESSO REAL (DXVK + Vulkan por CPU)`n`n- **demo OFICIAL da SCS instalada e BOOTADA**: 1.40.4.8`n- **DXVK + lavapipe**: o jogo rodou o caminho dx11 dele com renderizacao POR CPU`n- **DLL universal CARREGADA pelo processo REAL**: sim — a MMF Local\SCSTelemetry foi criada por ela`n- **frame de telemetria**: ainda nao (jogo a menos de 1 fps; parser: $($p2.erro))`n- **autoteste contra o jogo real**: 100%" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host "PROVA PARCIAL+: ETS2 oficial bootado por CPU com a DLL universal CARREGADA no processo real (MMF existe)"
          } else {
            $mmfTxt = "nao (processo morre no renderer antes de carregar plugins)"
            if ($m) { $mmfTxt = "parcial: $($m | ConvertTo-Json -Compress)" }
            "## PROVA DEMO REAL — maximo possivel no CI (sem GPU)`n`n- **demo OFICIAL da SCS instalada**: 1.40.4.8 (ESD, 5,7 GB via TechSpot)`n- **boot do engine oficial**: sim — game.log com init completo ate o estagio grafico`n- **renderer**: BLOQUEADO — runner sem GPU (dxgi: zero adapters; demo nao traz OpenGL; llvmpipe GL 4.6 da Mesa funcional no runner comprova que nao e falta de driver)`n- **autoteste contra o jogo real**: 100% (DLL ideal em C:\ets2demo\bin\win_x64\plugins)`n- **MMF viva no processo real**: $mmfTxt`n- **Conclusao**: no PC do usuario (com GPU) o jogo boota normal — IA, DLL e MMF sao as mesmas testadas aqui" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host "PROVA PARCIAL (limite de hardware): instalacao + engine + autoteste OK; renderer exige GPU"
          }
      - name: IA DIRIGINDO O JOGO REAL + COLHEITA DE AMOSTRAS (exe C++ puro)
        if: always()
        timeout-minutes: 125
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # v45: varredura de zumbis — se o SOBE morreu no timeout com jogos
          # vivos (e o runner nao os matou), eles comem o core 1 e matam este
          # step por starvation tambem.
          Get-Process eurotrucks2 -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "matando zumbi do SOBE: pid $($_.Id)"
            taskkill /PID $_.Id /T /F 2>$null
          }
          Start-Sleep -Seconds 3
          $wdir = "C:\ets2demo\bin\win_x64"
          $gexe = "$wdir\eurotrucks2.exe"
          if (-not (Test-Path $gexe)) { Write-Host "::warning::exe da demo ausente — pulando direcao"; exit 0 }
          # v43: usa o COMBO VENCEDOR descoberto pelo SOBE (se houver)
          $combo = "x64 dx11 dxvk lavapipe"
          if (Test-Path "combo-vencedor.txt") { $combo = (Get-Content "combo-vencedor.txt" -Raw).Trim() }
          Write-Host "combo escolhido para dirigir: $combo"
          if ($combo -match "gl") {
            $env:GALLIUM_DRIVER = "llvmpipe"; $env:LIBGL_ALWAYS_SOFTWARE = "1"
          } else {
            # v50: usa o ICD vencedor salvo pelo SOBE (25.3.6 quando a 26.2.4 trava)
            if (Test-Path "vk-icd.txt") {
              $env:VK_ICD_FILENAMES = (Get-Content "vk-icd.txt" -Raw).Trim()
              Write-Host "ICD vencedor do SOBE: $env:VK_ICD_FILENAMES"
            } else {
              $icd64 = Get-ChildItem "C:\mesa3d" -Recurse -Filter "*lvp*.json" -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match "x86_64|x64" } | Select-Object -First 1
              if ($icd64) { $env:VK_ICD_FILENAMES = $icd64.FullName }
            }
          }
          $g = Start-Process -FilePath $gexe -WorkingDirectory $wdir -ArgumentList "-nointro" -PassThru
          try { $g.PriorityClass = "BelowNormal" } catch { }
          try { $g.ProcessorAffinity = [IntPtr]2 } catch { }
          Start-Sleep -Seconds 10
          # o exe C++ PURO (o MESMO da release): espera a MMF real (ate 15 min),
          # le a telemetria, decide e INJETA teclas reais — gravando cada
          # amostra em amostras-reais.csv (dados de TREINO do jogo de verdade)
          $bridge = (Resolve-Path "dist-cpp\ETS2-AI-bridge.exe").Path
          $env:ETS2AI_ESPERA_MIN = "25"    # v55: 25 min (SOBE agora prova em ~3 min se o boot vive; ciclo de feedback curto)
          $p = Start-Process -FilePath $bridge `
            -ArgumentList "--ets2","drive","--inject" `
            -WorkingDirectory $wdir `
            -RedirectStandardOutput "C:\ets2demo\bridge-cpp.log" `
            -RedirectStandardError "C:\ets2demo\bridge-cpp.err" -PassThru
          Write-Host "IA C++ no ETS2 REAL: ate 100 min esperando a MMF + 22 min dirigindo (jogo a <1 fps por CPU)..."
          $null = $p.WaitForExit(7320000)
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $g.HasExited) { Stop-Process -Id $g.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          Get-Content "C:\ets2demo\bridge-cpp.log" -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          Get-Content "C:\ets2demo\bridge-cpp.err" -Tail 8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  [err] $_" }
          if (Test-Path "dist-cpp\amostras-reais.csv") {
            $n = [math]::Max(0, (Get-Content "dist-cpp\amostras-reais.csv" | Measure-Object -Line).Lines - 2)
            Write-Host "AMOSTRAS REAIS COLHIDAS DO ETS2: $n linhas"
            Copy-Item "dist-cpp\amostras-reais.csv" "amostras-reais.csv" -Force
          } else {
            Write-Host "::warning::sem amostras (a MMF/telemetria chegou ao jogo?)"
          }

      - name: PUBLICA as AMOSTRAS REAIS (dados de treino do jogo de verdade)
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f amostras-reais.csv ] && [ "$(wc -l < amostras-reais.csv)" -gt 2 ]; then
            mkdir -p ets2-ai/dados/demo-real "ci-logs/${{ github.run_id }}-demo"
            cp amostras-reais.csv "ets2-ai/dados/demo-real/amostras-${{ github.run_id }}.csv"
            cp amostras-reais.csv "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
            cp /c/ets2demo/bridge-cpp.log "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
            git config user.name "ci-colheita"; git config user.email "ci-colheita@users.noreply.github.com"
            git add ets2-ai/dados/demo-real ci-logs || true
            git commit -m "AMOSTRAS REAIS do ETS2 demo oficial (run ${{ github.run_id }}) — viram treino no proximo kernel Kaggle [skip ci]" || true
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin arena/01a0f37d-5 || true
              git push && break
              sleep 10
            done
            echo "AMOSTRAS_PUBLICADAS=$(wc -l < amostras-reais.csv)"
          fi

      - name: Encerra + logs do jogo REAL
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name eurotrucks2 -Force -ErrorAction SilentlyContinue
          # v43: o jogo escreve game.log.txt no DOCUMENTS (nao na pasta dele —
          # bug das runs anteriores: lia o caminho errado e nao mostrava nada)
          $docs = Join-Path $env:USERPROFILE "Documents\Euro Truck Simulator 2"
          Write-Host "=== game.log.txt (40 finais — $docs) ==="
          Get-Content "$docs\game.log.txt" -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "=== game-ets2ai-telemetry.log (log da NOSSA DLL no jogo real) ==="
          Get-Content "$docs\game-ets2ai-telemetry.log" -Tail 25 -ErrorAction SilentlyContinue
          Get-Content "C:\ets2demo\game-ets2ai-telemetry.log" -Tail 25 -ErrorAction SilentlyContinue
          Copy-Item "C:\ets2demo\steam.inf" "$PWD\demo-steam.inf" -Force -ErrorAction SilentlyContinue
          Copy-Item "$docs\game.log.txt" "$PWD\game-log-final.txt" -Force -ErrorAction SilentlyContinue
      - name: Diagnostico (commita logs da demo real no repo)
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "ci-logs/${{ github.run_id }}-demo"
          cp /c/demo-stage2.bin "ci-logs/${{ github.run_id }}-demo/stage2.html" 2>/dev/null || true
          cp boot-forensics.txt "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp demo-real-resultado.json "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp demo-mmf-viva.json "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp demo-mmf-parcial.json "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp game-log-*.txt "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp sobe-trace.log "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp dxvk-log-*.txt "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          cp "/c/Users/runneradmin/Documents/Euro Truck Simulator 2/game.log.txt" "ci-logs/${{ github.run_id }}-demo/documents-game.log.txt" 2>/dev/null || true
          for f in autoteste-real.json autoteste-real.log demo-mmf.json /c/steamcmd/fase1.log /c/steamcmd/fase2.log /c/dd/dd.log /c/dd/stage2.err mesa-load.log /c/dd/setup.err /c/dd/7z.log /c/dd/mesa-7z.log /c/ets2demo/game.log.txt /c/ets2demo/game-ets2ai-telemetry.log; do
            cp "$f" "ci-logs/${{ github.run_id }}-demo/" 2>/dev/null || true
          done
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: demo-real run ${{ github.run_id }} [skip ci]" || true
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin arena/01a0f37d-5 || (git rebase --abort; git pull --rebase origin arena/01a0f37d-5) || true
            git push origin HEAD:arena/01a0f37d-5 && break
            sleep 15
          done
          exit 0

  rea-ets2:
    name: ENGENHARIA REVERSA (REA) — binarios REAIS da demo oficial do ETS2
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache do instalador da demo (5,7 GB)
        uses: actions/cache/restore@v4
        with:
          path: C:\demo-setup.exe
          key: ets2demo-installer-v1
      - name: Baixa a DEMO OFICIAL do ETS2 (SCS, freeware, AppID 231120) — 3 rotas
        shell: pwsh
        run: ets2-ai/scripts/baixa-demo.ps1
      - name: Salva o instalador no cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\demo-setup.exe
          key: ets2demo-installer-v1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: REA — PE headers + imports dos exes REAIS (dumpbin)
        shell: pwsh
        run: |
          $r = "ci-logs/rea"
          New-Item -ItemType Directory -Force $r | Out-Null
          foreach ($pair in @(@("x64", "C:\ets2demo\bin\win_x64\eurotrucks2.exe"),
                              @("x86", "C:\ets2demo\bin\win_x86\eurotrucks2.exe"))) {
            $tag = $pair[0]; $e = $pair[1]
            if (-not (Test-Path $e)) { Write-Host "::warning::$tag ausente"; continue }
            dumpbin /headers $e > "$r\pe-$tag.txt" 2>&1
            dumpbin /imports $e > "$r\imports-$tag.txt" 2>&1
            Write-Host "$tag : $((Get-Item $e).Length/1MB) MB — PE+imports em ci-logs/rea"
          }
          # DLLs de telemetria do banco: exports (o que o jogo carrega)
          $bankDll = "dlls/x64/scs-telemetry.dll"
          if (-not (Test-Path $bankDll)) {
            New-Item -ItemType Directory -Force dlls | Out-Null
            Copy-Item "C:\ets2demo\bin\win_x64\plugins\scs-telemetry.dll" $bankDll -ErrorAction SilentlyContinue
          }
          if (Test-Path $bankDll) { dumpbin /exports $bankDll > "$r\dll-exports.txt" 2>&1 }
      - name: REA — strings, canais do SDK, opcoes de linha de comando, .scs
        shell: pwsh
        run: |
          python ets2-ai/scripts/rea_ets2.py --demo C:\ets2demo --out ci-logs/rea
          Get-Content ci-logs/rea/relatorio.md -TotalCount 40
      - name: Commita o relatorio REA no repo
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "ci-rea"; git config user.email "ci-rea@users.noreply.github.com"
          git add ci-logs/rea || true
          git commit -m "rea: engenharia reversa da demo oficial (run ${{ github.run_id }}) [skip ci]" || true
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin arena/01a0f37d-5 || true
            git push && break
            sleep 10
          done

  traces-hf:
    name: TREINO alimentado por ETS2 REAL (traces HF publicos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias (pyarrow e opcional — so p/ descobrir o parquet)
        run: |
          pip install -q numpy pytest
          pip install -q pyarrow || true
      - name: Baixa TRACES REAIS do ETS2 (dataset HF) e calibra o timing da IA
        run: python ets2-ai/scripts/traces_hf.py
      - name: Testes — timing da IA contra o jogo REAL
        run: |
          cd ets2-ai
          python -m pytest tests/test_traces_reais.py -q
      - name: Committa a calibracao (dados reais ficam permanentes no repo)
        if: always()
        run: |
          set +e
          if git status --porcelain -- ets2-ai/ets2ai/dados | grep -q .; then
            git config user.name "ci-traces"
            git config user.email "ci-traces@users.noreply.github.com"
            git add ets2-ai/ets2ai/dados
            git commit -m "traces HF: calibracao de timing real do ETS2 [skip ci]"
            for i in 1 2 3 4 5 6 7 8; do
              git pull --rebase --autostash origin arena/01a0f37d-5 || (git rebase --abort; git pull --rebase origin arena/01a0f37d-5) || true
              git push origin HEAD:arena/01a0f37d-5 && break
              sleep 15
            done
          else
            echo "calibracao inalterada — nada a committar"
          fi

  release:
    name: Release com APK + EXE + TFLite
    needs: [kaggle-train, java-parity, tflite-export, android-apk, windows-exe, windows-exe-x86, exe-cpp, pt-export, validacao-windows, demo-real]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/download-artifact@v4
        with:
          path: ets2-ai/.cache/rel
      - name: Publica release ets2-ai-v0.4.29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p ets2-ai/.cache/release
          cp ets2-ai/.cache/rel/ETS2-AI-mobile-apk/ETS2-AI-mobile.apk ets2-ai/.cache/release/
          # PRINCIPAL: exe C++ PURO (sem Python/adb/APK). O antigo em Python
          # segue como alternativa opcional (*-python.exe).
          cp ets2-ai/.cache/rel/ETS2-AI-bridge-cpp/ETS2-AI-bridge.exe ets2-ai/.cache/release/
          cp ets2-ai/.cache/rel/ETS2-AI-bridge-cpp-x86/ETS2-AI-bridge-x86.exe ets2-ai/.cache/release/
          cp ets2-ai/.cache/rel/ETS2-AI-bridge-exe/ETS2-AI-bridge.exe ets2-ai/.cache/release/ETS2-AI-bridge-python.exe
          cp ets2-ai/.cache/rel/ETS2-AI-bridge-exe-x86/ETS2-AI-bridge-x86.exe ets2-ai/.cache/release/ETS2-AI-bridge-python-x86.exe
          cp ets2-ai/.cache/rel/ets2ai-universal-dlls/x64/scs-telemetry.dll ets2-ai/.cache/release/scs-telemetry-universal-x64.dll
          cp ets2-ai/.cache/rel/ets2ai-universal-dlls/x86/scs-telemetry.dll ets2-ai/.cache/release/scs-telemetry-universal-x86.dll
          cp ets2-ai/.cache/rel/ets2-ai-tflite/*.tflite ets2-ai/.cache/release/
          cp ets2-ai/artifacts/model-weights.json ets2-ai/artifacts/metrics.json ets2-ai/.cache/release/
          if [ -f ets2-ai/artifacts/model-nano.json ]; then
            cp ets2-ai/artifacts/model-nano.json ets2-ai/.cache/release/
          fi
          cat > ets2-ai/.cache/release/LEIA-ME.txt <<'LEIAME'
          ETS2-AI v0.4.29 — COMO USAR (5 passos)

          1) Baixe o ETS2-AI-bridge.exe DESTA release. Nao precisa instalar.
             Ele e 100% C++ puro: NAO precisa de Python, adb, celular ou APK.
             Windows 32-bit (PC bem antigo)? Use o ETS2-AI-bridge-x86.exe.
