  pt-export:
    name: Exporta .pt (PyTorch) para a release
    needs: [kaggle-train]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - name: Dependencias (torch CPU + numpy)
        run: |
          set -x
          python3 -m pip install --retries 5 --timeout 120 --quiet numpy
          python3 -m pip install --retries 5 --timeout 120 --quiet torch --index-url https://download.pytorch.org/whl/cpu
      - name: Exporta .pt com paridade numpy verificada
        run: |
          cd ets2-ai
          python3 -m ets2ai.export_pt --weights artifacts/model-weights.json --out artifacts/ets2ai-v0.4.29.pt 2>&1 | tee ../.cache_pt.log
          exit ${PIPESTATUS[0]}
      - name: Diagnostico (commita logs no repo em caso de falha)
        if: failure()
        run: |
          set +e
          mkdir -p ci-logs/${{ github.run_id }}-pt
          cp .cache_pt.log ci-logs/${{ github.run_id }}-pt/log.txt 2>/dev/null || echo "sem log" > ci-logs/${{ github.run_id }}-pt/log.txt
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          git add ci-logs || true
          git commit -m "diag: pt-export run ${{ github.run_id }} [skip ci]" || true
          git pull --rebase --autostash origin arena/01a0f37d-5 || true
          git push || true
          exit 1
      - name: Publica na release ets2-ai-v0.4.29
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ets2-ai-v0.4.29 >/dev/null 2>&1 || \
            gh release create ets2-ai-v0.4.29 \
              --title "ETS2-AI v0.4.29 — QUALQUER ETS2: rotacao automatica de DLL + autoteste; validado no CI em Windows REAL (TODAS as 62 versoes principais 1.0 a 1.61 + BETAS + telemetria); cadeia 500B" \
              --notes "ETS2-AI v0.4.29 - APK: servico em 1o plano (wake lock + Wi-Fi alto desempenho) mantem a IA na MESMA velocidade com a tela bloqueada (cmd/s ao vivo na notificacao); teclado BT com as setas (padrao ETS2); EXE com DLL embutida + adb plug & play; cadeia rumo a 500 bilhoes de amostras no Kaggle."
          gh release upload ets2-ai-v0.4.29 ets2-ai/artifacts/ets2ai-v0.4.29.pt --clobber

  demo-real:
    name: PROVA DEMO REAL — ETS2 OFICIAL (demo SCS) com DLL no processo + IA DIRIGINDO + AMOSTRAS REAIS
    needs: [windows-exe, exe-cpp]
    # v46: WINDOWS-2022 PINADO — windows-latest agora e windows-2025-vs2026 e
    # o Mesa (llvmpipe) CONGELA na criacao de contexto WGL nessa imagem (run
    # 39828443013: pwsh mudo por 5h53 logo apos o download do dxvk, ANTES de
    # qualquer boot; as 4 runs "timeout 6h" de SOBE (v41-v44) travaram NO
    # MESMO LUGAR — o jogo NUNCA chegou a rodar). Windows2022-Readme.md no
    # actions/runner-images confirma a imagem ativa (20261012) — e a familia
    # de imagem onde llvmpipe GL 4.6 ja funcionou (run 38623540416).
    runs-on: windows-2022
    timeout-minutes: 360  # max do Actions. CDN varia de 16 MB/s (v9: 6 min)
                          # a <1 MB/s (v13: >190 min) — 360 cobre o pior caso
                          # com folga para cache+extracao+boot+MMF.
    continue-on-error: true   # 1a viagem: descoberta — nao bloqueia a release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Preflight v59: here-string pwsh com '@ na coluna 0"
        shell: bash
        run: |
          # v59: v57/v58 rodaram o SOBE ZERO vezes — um '@ | Set-Content
          # indentado no YAML vira "White space is not allowed before the
          # string terminator" no pwsh e o step INTEIRO morre sem executar
          # uma unica linha (demo-real fica muda e o combo vira o default).
          # Este guard valida em segundos (antes de baixar 5,7 GB) todos os
          # blocos run: | dos dois workflows.
          python -m pip install --quiet pyyaml >/dev/null 2>&1 || true
          python - <<'PY'
          import re
          try:
              import yaml
          except ImportError:
              raise SystemExit("pyyaml ausente no runner — instale antes (pip install pyyaml)")
          bad = []
          for wf in ('.github/workflows/ets2-ai.yml', '.github/workflows/ets2-ai-chain.yml'):
              doc = yaml.safe_load(open(wf, encoding='utf-8'))
              for jname, j in doc['jobs'].items():
                  for step in j.get('steps', []):
                      r = step.get('run')
                      if not r:
                          continue
                      for i, ln in enumerate(r.split('\n'), 1):
                          if re.match(r"^[ \t]+(?:'@|\"@)(?:\s|$)", ln):
                              bad.append(f"{wf} {jname}/{step.get('name','?')} ps1:{i}: {ln.strip()[:50]}")
          if bad:
              print("HERE-STRINGS QUEBRADAS (terminador indentado = ParserError pwsh):")
              for b in bad:
                  print("  -", b)
              raise SystemExit(1)
          print("preflight heredoc OK: nenhum terminador '@ indentado")
          PY
