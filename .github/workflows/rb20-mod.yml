name: RB20 AC mod - Blender + telemetry physics

on:
  workflow_dispatch:
  push:
    branches: [arena/f4e7ed77-5]
    paths:
      - 'rb20/**'
      - '.github/workflows/rb20-mod.yml'
      - '!rb20/download/**'

permissions:
  contents: write

jobs:
  build:
    name: Model in Blender, calibrate, build KN5 and ZIP
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System libraries required by headless Blender (bpy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxi6 libsm6 libice6 libxfixes3 libxt6 \
            libgl1 libglx0 libopengl0 libxkbcommon0 libegl1 libgl1-mesa-dri

      - name: Install Blender (bpy) and Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install bpy==4.5.4 pillow numpy matplotlib
          python -c "import bpy; print('Blender', bpy.app.version_string)"

      - name: Inspect external RB20 reference mod (CSP, reference ONLY)
        continue-on-error: true
        run: |
          python rb20/tools/fetch_reference.py \
            --url 'https://modsfire.com/RcgUC30KVzcd5Nr?rf=39204' \
            --out rb20/out/reference_report.json \
            --markdown rb20/out/REFERENCE_MOD.md
          test -f rb20/out/reference_report.json || echo '{"status":"unavailable","copied_into_mod":false}' > rb20/out/reference_report.json
          test -f rb20/out/REFERENCE_MOD.md || echo '# Referencia externa indisponivel neste run' > rb20/out/REFERENCE_MOD.md
          cat rb20/out/REFERENCE_MOD.md || true

      - name: MODEL THE CAR IN BLENDER (headless bpy)
        run: python rb20/tools/blender_model.py --out rb20/out

      - name: Calibrate physics + native ERS/DRS/wet compounds + F1 lights + DRS flap animation + Kunos layout
        run: |
          python rb20/tools/calibrate.py \
            --telemetry rb20/telemetry/VER_2024_Bahrain_Q.csv \
            --car-dir rb20/out/content/cars/arb_rb20

      - name: Build vanilla KN5 models and DXT1 textures
        run: |
          python rb20/tools/make_kn5.py \
            --mesh rb20/out/mesh.json \
            --car-dir rb20/out/content/cars/arb_rb20 \
            --skins-dir rb20/out/content/cars/arb_rb20/skins/default

      - name: Render skin preview and UI badge (CPU)
        run: |
          python rb20/tools/render_preview.py \
            --mesh rb20/out/mesh.json \
            --car-dir rb20/out/content/cars/arb_rb20

      - name: Offline physics validation against telemetry
        run: |
          python rb20/tools/physics_sim.py \
            --car-dir rb20/out/content/cars/arb_rb20 \
            --telemetry rb20/telemetry/VER_2024_Bahrain_Q.csv \
            --out rb20/out/validation

      - name: Package installable ZIP
        run: |
          python rb20/tools/make_package.py \
            --car-dir rb20/out/content/cars/arb_rb20 \
            --validation rb20/out/validation/validation_report.json \
            --references rb20/references/REFERENCES.md \
            --zip rb20/download/RB20_AssettoCorsa.zip

      - name: Gate - structure, vanilla headers, no CSP, physics checks
        run: |
          python rb20/tools/validate.py \
            --car-dir rb20/out/content/cars/arb_rb20 \
            --validation rb20/out/validation/validation_report.json \
            --zip rb20/download/RB20_AssettoCorsa.zip \
            --out rb20/out/validate_report.json

      - name: Publish direct-download Release and refresh ZIP in the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add rb20/download/RB20_AssettoCorsa.zip
          if ! git diff --cached --quiet; then
            git commit -m "RB20: ZIP rebuilt by the Blender Actions runner [skip ci]"
            git push origin HEAD:arena/f4e7ed77-5
            echo "ZIP committed back to the branch"
          else
            echo "ZIP unchanged, nothing to commit"
          fi
          NOTES="Original model built by Blender in GitHub Actions, physics calibrated with real 2024 Bahrain GP qualifying telemetry, official published 805 kW power unit (685 kW ICE + 120 kW MGU-K), native ERS/DRS and wet compounds, functional DRS with a vanilla .ksanim flap animation and steering-wheel DRS LEDs, real-F1 rear light (brake / wet / MGU-K harvest flash), subdivided Blender model, crash-safe Kunos car folder (4 identical full LOD KN5, constant-translation ksanim, no unverifiable auto-loaded files), vanilla Assetto Corsa with zero CSP dependency. See rb20/README.md and LEIA-ME.txt inside the ZIP."
          if gh release view rb20-v1.0 >/dev/null 2>&1; then
            gh release upload rb20-v1.0 rb20/download/RB20_AssettoCorsa.zip --clobber
            gh release edit rb20-v1.0 --notes "$NOTES"
            echo "Release asset refreshed"
          else
            gh release create rb20-v1.0 rb20/download/RB20_AssettoCorsa.zip \
              --target arena/f4e7ed77-5 \
              --title "ARB RB20 2024 - Assetto Corsa mod (vanilla, no CSP)" \
              --notes "$NOTES"
            echo "Release created"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rb20-mod
          if-no-files-found: error
          path: |
            rb20/download/RB20_AssettoCorsa.zip
            rb20/download/RB20_AssettoCorsa.sha256
            rb20/out/mesh.json
            rb20/out/arb_rb20.blend
            rb20/out/arb_rb20.fbx
            rb20/out/validation/validation.png
            rb20/out/validation/validation_report.json
            rb20/out/validate_report.json
            rb20/out/reference_report.json
            rb20/out/REFERENCE_MOD.md
