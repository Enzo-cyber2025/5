name: Reply notification build and real screen-off test
on:
  push:
    branches: [arena/01a09b42-5]
    paths:
      - apk-fix/reply_notifications.py
      - apk-fix/java/com/ggufchat/app/ReplyNotifications.java
      - scripts/build_reply_notifications.py
      - scripts/test_reply_notifications_android.py
      - ci/reply-notification-candidate.json
      - .github/workflows/reply-notifications.yml
permissions:
  contents: write
  actions: read
jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, '[reply build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile only delivery changes on exact approved payload
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          bash scripts/fetch_tools.sh
          mkdir -p .cache
          cp .delivery/GGUF-Chat-mobile.apk .cache/reply-base.apk
          .venv/bin/python scripts/build_reply_notifications.py
          .venv/bin/python -m pytest tests/test_reply_notifications.py tests/test_latency.py tests/test_generation_stats.py tests/test_compute.py -q
      - name: Relay unsigned APK, no private key in CI
        run: |
          git config user.name 'GGUF build relay'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .delivery/GGUF-Chat-mobile-unsigned.apk .delivery/mobile-build.json
          git commit -m 'Relay unsigned notification update; native bytes preserved [skip ci]'
          git pull --rebase origin arena/01a09b42-5
          git push origin arena/01a09b42-5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reply-build-provenance
          path: .delivery/mobile-build.json
