      V001: ${{ vars.HF_TOKEN }}
      V002: ${{ vars.HUGGINGFACE_TOKEN }}
      V003: ${{ vars.HF_API_TOKEN }}
      V004: ${{ vars.HF_HUB_TOKEN }}
      V005: ${{ vars.HF_MODEL }}
      V006: ${{ vars.HF_MODEL_ID }}
      V007: ${{ vars.HF_MODEL_NAME }}
      V008: ${{ vars.HF_REPO }}
      V009: ${{ vars.HF_REPO_ID }}
      V010: ${{ vars.HF_NAMESPACE }}
      V011: ${{ vars.HF_USER }}
