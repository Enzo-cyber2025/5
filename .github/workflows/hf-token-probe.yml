name: HF token probe

# One-off diagnostic: is there a Hugging Face token in this repo's Actions secrets
# or variables, does it authenticate, and what can it reach?
#
# Everything printed is scrubbed: no token value, no account name, no org names,
# no repo names - only names of secrets/variables, formats, lengths, enum values,
# counts and HTTP status codes. This repository is public, so its logs AND its
# commits are public; the report is committed only because log and artifact
# downloads are blocked from the sandbox that asked for the check.
#
# Secrets are referenced one by one instead of serialised with toJSON(secrets):
# bulk-serialising them makes GitHub hold the run for manual approval, and this
# session has no actions:write permission to grant it.
on:
  push:
    branches: [arena/de730b27-5]
    paths:
      - '.github/workflows/hf-token-probe.yml'
      - 'ci/hf_token_probe.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hf-token-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_NAMES: "HF_TOKEN HUGGINGFACE_TOKEN HUGGING_FACE_TOKEN HF_API_TOKEN HUGGINGFACE_API_TOKEN HF_ACCESS_TOKEN HUGGINGFACE_ACCESS_TOKEN HF_HUB_TOKEN HUGGINGFACE_HUB_TOKEN HF_AUTH_TOKEN HUGGINGFACE_AUTH_TOKEN HF_PAT HUGGINGFACE_PAT HF_KEY HUGGINGFACE_KEY HF_SECRET HUGGINGFACE_SECRET HF_API_KEY HUGGINGFACE_API_KEY HF_READ_TOKEN HF_WRITE_TOKEN HF_UPLOAD_TOKEN HF_DOWNLOAD_TOKEN HF_FINE_GRAINED_TOKEN HF_MODEL_TOKEN HF_PRIVATE_TOKEN HF_SECRET_TOKEN HF_USER_TOKEN HF_INTEGRATION_TOKEN HUB_TOKEN HF HUGGINGFACE HF_TOKEN_SECRET SECRET_HF_TOKEN TOKEN_HF LLAMA_TOKEN HF_LLAMA_TOKEN HF_GGUF_TOKEN ARENA_HF_TOKEN HF_TOKEN_2"
      VAR_NAMES: "HF_TOKEN HUGGINGFACE_TOKEN HF_API_TOKEN HF_HUB_TOKEN HF_MODEL_ID HF_MODEL HF_REPO HF_CACHE HF_USER HF_USERNAME HUGGINGFACE_USER HF_ENDPOINT"
      S01: ${{ secrets.HF_TOKEN }}
      S02: ${{ secrets.HUGGINGFACE_TOKEN }}
      S03: ${{ secrets.HUGGING_FACE_TOKEN }}
      S04: ${{ secrets.HF_API_TOKEN }}
      S05: ${{ secrets.HUGGINGFACE_API_TOKEN }}
      S06: ${{ secrets.HF_ACCESS_TOKEN }}
      S07: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
      S08: ${{ secrets.HF_HUB_TOKEN }}
      S09: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
      S10: ${{ secrets.HF_AUTH_TOKEN }}
      S11: ${{ secrets.HUGGINGFACE_AUTH_TOKEN }}
      S12: ${{ secrets.HF_PAT }}
      S13: ${{ secrets.HUGGINGFACE_PAT }}
      S14: ${{ secrets.HF_KEY }}
      S15: ${{ secrets.HUGGINGFACE_KEY }}
      S16: ${{ secrets.HF_SECRET }}
      S17: ${{ secrets.HUGGINGFACE_SECRET }}
      S18: ${{ secrets.HF_API_KEY }}
      S19: ${{ secrets.HUGGINGFACE_API_KEY }}
      S20: ${{ secrets.HF_READ_TOKEN }}
      S21: ${{ secrets.HF_WRITE_TOKEN }}
      S22: ${{ secrets.HF_UPLOAD_TOKEN }}
      S23: ${{ secrets.HF_DOWNLOAD_TOKEN }}
      S24: ${{ secrets.HF_FINE_GRAINED_TOKEN }}
      S25: ${{ secrets.HF_MODEL_TOKEN }}
      S26: ${{ secrets.HF_PRIVATE_TOKEN }}
      S27: ${{ secrets.HF_SECRET_TOKEN }}
      S28: ${{ secrets.HF_USER_TOKEN }}
      S29: ${{ secrets.HF_INTEGRATION_TOKEN }}
      S30: ${{ secrets.HUB_TOKEN }}
      S31: ${{ secrets.HF }}
      S32: ${{ secrets.HUGGINGFACE }}
      S33: ${{ secrets.HF_TOKEN_SECRET }}
      S34: ${{ secrets.SECRET_HF_TOKEN }}
      S35: ${{ secrets.TOKEN_HF }}
      S36: ${{ secrets.LLAMA_TOKEN }}
      S37: ${{ secrets.HF_LLAMA_TOKEN }}
      S38: ${{ secrets.HF_GGUF_TOKEN }}
      S39: ${{ secrets.ARENA_HF_TOKEN }}
      S40: ${{ secrets.HF_TOKEN_2 }}
      V01: ${{ vars.HF_TOKEN }}
      V02: ${{ vars.HUGGINGFACE_TOKEN }}
      V03: ${{ vars.HF_API_TOKEN }}
      V04: ${{ vars.HF_HUB_TOKEN }}
      V05: ${{ vars.HF_MODEL_ID }}
      V06: ${{ vars.HF_MODEL }}
      V07: ${{ vars.HF_REPO }}
      V08: ${{ vars.HF_CACHE }}
      V09: ${{ vars.HF_USER }}
      V10: ${{ vars.HF_USERNAME }}
      V11: ${{ vars.HUGGINGFACE_USER }}
      V12: ${{ vars.HF_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Inventory the named secrets and variables, test any HF token
        run: |
          set -uo pipefail
          mkdir -p .delivery
          REPORT=.delivery/hf-token-probe.txt
          {
            echo "run       : $GITHUB_RUN_ID ($GITHUB_SHA)"
            echo "generated : $(date -u +%FT%TZ)"
            echo ""
          } > "$REPORT"
          python3 ci/hf_token_probe.py --named-inventory 2>&1 | tee -a "$REPORT"
          {
            echo ""
            echo "Note: identity, org names and repo names are deliberately absent -"
            echo "      this repository is public."
          } | tee -a "$REPORT"

      - name: Publish report to the session branch
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "hf-token-probe[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .delivery/hf-token-probe.txt
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "ci: HF token probe report (scrubbed, temporary)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "report published"
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep 5
          done
          echo "could not publish the report"
          exit 1
