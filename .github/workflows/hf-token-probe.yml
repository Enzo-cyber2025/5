name: HF token probe

# One-off diagnostic: is there a Hugging Face token in this repo's Actions
# secrets/variables, does it authenticate, and what can it reach?
#
# Everything printed here is scrubbed: no token value, no account name, no org
# names, no repo names. Only names of secrets, formats, lengths, enum values,
# counts and HTTP status codes. This repository is public, so its logs AND its
# commits are public, and the report is committed only because log/artifact
# downloads are blocked from the sandbox that requested the check.
on:
  push:
    branches: [arena/de730b27-5]
    paths:
      - '.github/workflows/hf-token-probe.yml'
      - 'ci/hf_token_probe.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hf-token-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Inventory secrets and test any HF token among them
        env:
          # toJSON(secrets) gives the runner the real values (masking only
          # affects what reaches the log), so a token stored under an unexpected
          # name is still found. The script only ever sends values that already
          # look like HF tokens, so unrelated credentials go nowhere.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -uo pipefail
          mkdir -p .delivery
          {
            echo "run       : $GITHUB_RUN_ID ($GITHUB_SHA)"
            echo "generated : $(date -u +%FT%TZ)"
            echo ""
          } > .delivery/hf-token-probe.txt
          python3 ci/hf_token_probe.py --inventory 2>&1 | tee -a .delivery/hf-token-probe.txt
          {
            echo ""
            echo "Note: identity, org names and repo names are deliberately absent -"
            echo "      this repository is public."
          } | tee -a .delivery/hf-token-probe.txt

      - name: Publish report to the session branch
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "hf-token-probe[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .delivery/hf-token-probe.txt
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "ci: HF token probe report (scrubbed, temporary)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "report published"
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep 5
          done
          echo "could not publish the report"
          exit 1
