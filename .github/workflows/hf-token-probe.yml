      V020: ${{ vars.HF_ORG }}
      V021: ${{ vars.HF_DATASET }}
      V022: ${{ vars.HF_HUB_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Inventory secrets and variables, test any HF token, probe target
        run: |
          set -uo pipefail
          mkdir -p .delivery
          REPORT=.delivery/hf-token-probe.txt
          {
            echo "run       : $GITHUB_RUN_ID ($GITHUB_SHA)"
            echo "generated : $(date -u +%FT%TZ)"
            echo ""
          } > "$REPORT"
          python3 ci/hf_token_probe.py --named-inventory --target sla1 2>&1 | tee -a "$REPORT"
          {
            echo ""
            echo "Note: account identity and PRIVATE repo ids are deliberately absent -"
            echo "      this repository is public."
          } | tee -a "$REPORT"

      - name: Publish report to the session branch
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "hf-token-probe[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .delivery/hf-token-probe.txt
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "ci: HF token probe report (scrubbed, temporary)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "report published"
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep 5
          done
          echo "could not publish the report"
          exit 1
