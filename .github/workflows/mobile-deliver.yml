name: Deliver tested mobile APK
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/mobile-deliver.yml]
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact tested bytes and upload standalone APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Enzo-cyber2025/5
        run: |
          set -euo pipefail
          gh api repos/Enzo-cyber2025/5/actions/runs/34785696254 > /tmp/mobile-test-run.json
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          assert json.loads(Path('/tmp/mobile-test-run.json').read_text())['conclusion']=='success'
          summary=json.loads(Path('ci-results/34785696254-1/summary.json').read_text())
          assert summary['status']=='PASS'
          expected='409985de54388cbcb1429a8db4cd26139cc47a5764864c6cd4b408c75f07099f'
          assert summary['apk_sha256']==expected
          assert hashlib.sha256(Path('.delivery/GGUF-Chat-mobile.apk').read_bytes()).hexdigest()==expected
          PY
          gh release view gguf-mobile-120e7dc >/dev/null
          gh release upload gguf-mobile-120e7dc .delivery/GGUF-Chat-mobile.apk --clobber
          gh api repos/Enzo-cyber2025/5/releases/tags/gguf-mobile-120e7dc > /tmp/mobile-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/mobile-release.json').read_text())
          a=next(a for a in r['assets'] if a['name']=='GGUF-Chat-mobile.apk')
          assert a['size']==16741431
          assert a['digest']=='sha256:409985de54388cbcb1429a8db4cd26139cc47a5764864c6cd4b408c75f07099f'
          print('::notice title=Standalone APK verified::'+a['browser_download_url']+' | '+a['digest'])
          PY
