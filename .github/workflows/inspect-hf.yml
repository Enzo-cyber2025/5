name: Inspecionar ativo privado do HuggingFace
on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: 'HF token (ou usa o secret HF_TOKEN se configurado)'
        required: false
        default: ''
      hf_repo:
        description: 'Repo do HuggingFace no formato dono/repo'
        required: true
        default: ''
      hf_file:
        description: 'Caminho do arquivo dentro do repo (ex. BeamNG.drive.rar)'
        required: true
        default: ''
      head_bytes:
        description: 'Quantos bytes baixar so' para inspecionar cabecalho'
        required: false
        default: '262144'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Autentica e inspeciona
        env:
          HF_TOKEN: ${{ inputs.hf_token || secrets.HF_TOKEN }}
        run: |
          set -eu
          REPO='${{ inputs.hf_repo }}'
          FILE='${{ inputs.hf_file }}'
          HEAD='${{ inputs.head_bytes }}'
          if [ -z "$HF_TOKEN" ]; then echo "sem token"; exit 1; fi
          echo "== whoami =="
          curl -sS -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2 | python3 -c "import sys,json;d=json.load(sys.stdin);print('auth ok, user:',d.get('name',d.get('email','?')))"
          echo "== arquivos do repo =="
          curl -sS -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/models/$REPO" -o /tmp/repo.json
          python3 - <<PY
import json,sys
try:
  d=json.load(open('/tmp/repo.json'))
except Exception as e:
  print('repo nao acessivel:',open('/tmp/repo.json').read()[:400]); sys.exit(2)
sib=[s.get('rfilename') for s in d.get('siblings',[])]
print('total de arquivos:',len(sib))
for n in sib[:50]: print(' ',n)
if len(sib)>50: print(f'  (+{len(sib)-50} mais)')
PY
          echo "== metadata do arquivo solicitado =="
          curl -sS -I -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/$REPO/resolve/main/$FILE" | head -20
          echo "== primeiros $HEAD bytes (magic number) =="
          curl -sS -f --range 0-$((HEAD-1)) -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/$REPO/resolve/main/$FILE" -o /tmp/head.bin
          ls -la /tmp/head.bin
          file /tmp/head.bin || true
          echo "-- magic hex:"
          xxd -l 64 /tmp/head.bin || true
          echo "-- strings iniciais:"
          strings -n 8 /tmp/head.bin | head -20 || true
