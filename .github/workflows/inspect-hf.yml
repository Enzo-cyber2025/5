name: Inspecionar ativo privado do HuggingFace
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [ci/hf_pieces.sh]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Roda
        run: bash ci/hf_pieces.sh
