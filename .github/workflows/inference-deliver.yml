name: Deliver tested content inference APK
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/inference-deliver.yml]
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify functional acceptance, disclose quality failures and compare public APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Enzo-cyber2025/5
        run: bash ci/log_step.sh inference-delivery bash ci/deliver_inference.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inference-delivery-verification
          path: .cache/ci-logs/
