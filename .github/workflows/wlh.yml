name: wlh
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [wl.v]
  workflow_dispatch:
permissions:
  issues: write
  contents: write
jobs:
  h:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hello
        run: |
          set -eux
          echo "token len: ${#GITHUB_TOKEN}"
          echo "repo: $GITHUB_REPOSITORY"
          BODY="hello wlh run=$GITHUB_RUN_ID sha=${GITHUB_SHA:0:8} ts=$(date -u +%H:%M:%SZ)"
          echo "$BODY" > /tmp/body.json
          python3 -c "
          import json,os
          open('/tmp/body.json','w').write(json.dumps({'body':os.environ['BODY']}))
          "
          curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Api-Version: 2022-11-08" \
            -d @/tmp/body.json \
            -w "\nHTTP_CODE=%{http_code}\n" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/7/comments" -o /tmp/resp.txt
          echo "-- response --"; cat /tmp/resp.txt; echo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wlh-debug
          path: /tmp/resp.txt
          if-no-files-found: ignore
