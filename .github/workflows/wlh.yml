name: wlh
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [wl.v]
  workflow_dispatch:
permissions: write-all
jobs:
  h:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: build
        run: bash wl/hello.sh
      - name: savelog
        if: always()
        run: bash wl/postlog.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wlh-out
          path: |
            W.apk
            W.sha256
            wlh.log
          if-no-files-found: ignore
      - name: pub
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          T=winlator-a55
          gh release delete "$T" -y || true
          git tag -f "$T" HEAD
          git push -f origin "$T" || true
          gh release create "$T" --title "Winlator-A55 pre-AOT" --notes "Box64 DYNAREC persistente + DXVK forçado. Copie sua pasta BeamNG.drive." W.apk W.sha256
