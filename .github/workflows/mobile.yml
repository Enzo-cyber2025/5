name: Mobile build and real pair test
on:
  push:
    branches: ['arena/**']
    paths:
      - 'apk-fix/**'
      - 'ci/mobile*'
      - 'ci/prepare_vulkan.sh'
      - 'ci/vulkan_features.cpp'
      - 'scripts/test_mobile.py'
      - 'scripts/test_attachment_android.py'
      - 'scripts/test_inference_android.py'
      - 'scripts/test_physical_android.py'
      - 'scripts/test_tool_integrations_android.py'
      - 'tests/test_unbounded_request_semantics.py'
      - 'tests/test_physical_gguf.py'
      - 'tests/test_vulkan_pipeline.py'
      - 'tests/test_strict_vulkan.py'
      - 'tests/native_strict_vulkan.cpp'
      - 'scripts/test_strict_vulkan_host.sh'
      - 'tests/test_generation_stats.py'
      - 'tests/test_performance_code.py'
      - 'tests/test_tooling.py'
      - 'tests/test_web_search_parser.py'
      - 'tests/test_termux_bridge_contract.py'
      - '.github/workflows/mobile.yml'
      - '.delivery/GGUF-Chat-mobile.apk'
permissions:
  contents: write
  actions: read
concurrency:
  group: mobile-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[signed mobile]') && 'test' || 'build' }}
  cancel-in-progress: true
jobs:
  isolated-experiment:
    if: ${{ contains(github.event.head_commit.message, '[local stream]') || contains(github.event.head_commit.message, '[wait speed]') || contains(github.event.head_commit.message, '[projector combined]') || contains(github.event.head_commit.message, '[media prefix]') || contains(github.event.head_commit.message, '[expanded weights]') || contains(github.event.head_commit.message, '[row tile]') || contains(github.event.head_commit.message, '[screen]') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'The dedicated experiment workflow owns this run; do not duplicate the build or relay an unapproved payload.'
  build:
    if: ${{ !contains(github.event.head_commit.message, '[signed mobile]') && !contains(github.event.head_commit.message, '[projector cache]') && !contains(github.event.head_commit.message, '[local stream]') && !contains(github.event.head_commit.message, '[wait speed]') && !contains(github.event.head_commit.message, '[projector combined]') && !contains(github.event.head_commit.message, '[media prefix]') && !contains(github.event.head_commit.message, '[expanded weights]') && !contains(github.event.head_commit.message, '[row tile]') && !contains(github.event.head_commit.message, '[screen]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the Android SDK already installed on the hosted runner
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          # Avoid the failing setup action; accept licenses on the existing SDK.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /tmp/android-licenses.log
          set -o pipefail
      - name: Pinned tools and source APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-test.txt
          bash scripts/fetch_tools.sh
          python3 scripts/fetch_original.py
          sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build glslc libvulkan-dev
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/Vulkan-Headers .cache/vulkan-sdk
          test "$(git -C .cache/vulkan-sdk rev-parse HEAD)" = e3b1eec08173d6b825cd3ac88c885a63b621504a
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/SPIRV-Headers .cache/spirv-headers
          test "$(git -C .cache/spirv-headers rev-parse HEAD)" = 29981f65241605e08b0ede4cfeb999fe3b723c6a
          cmake -S .cache/spirv-headers -B .cache/spirv-build -DCMAKE_INSTALL_PREFIX="$PWD/.cache/spirv-install"
          cmake --install .cache/spirv-build
          mkdir -p .cache/vulkan-headers
          cp -r .cache/vulkan-sdk/include/. .cache/vulkan-headers/
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            .cache/llama-mobile
            .cache/mobile/arm64-v8a
            .cache/mobile/x86_64
          key: native-v041-ndk28-v2-${{ runner.os }}-${{ hashFiles('apk-fix/native/**', 'apk-fix/*.py', 'ci/mobile-models.sh') }}-${{ github.run_id }}
          restore-keys: native-v041-ndk28-v2-${{ runner.os }}-
      - name: Compile real native stack and compact UI
        env:
          APKTOOL_JAR: .cache/tools/package/lib/apktool.jar
          GGUF_REUSE_TESTED_NATIVE: '0'
        run: bash ci/log_step.sh mobile-build python3 apk-fix/build_mobile.py
      - name: Save compiled native objects before Android acceptance (including on later test failure)
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/llama-mobile
            .cache/mobile/arm64-v8a
            .cache/mobile/x86_64
          key: native-v041-ndk28-v2-${{ runner.os }}-${{ hashFiles('apk-fix/native/**', 'apk-fix/*.py', 'ci/mobile-models.sh') }}-${{ github.run_id }}
      - name: Existing regressions
        run: bash ci/log_step.sh tooling .venv/bin/python -m pytest -q tests/test_tooling.py tests/test_mobile_build.py tests/test_gguftx_branding.py tests/test_web_search_contract.py tests/test_web_search_parser.py tests/test_termux_bridge_contract.py tests/test_unbounded_request_semantics.py tests/test_evidence_push.py tests/test_unified.py tests/test_attachments.py tests/test_inference.py tests/test_physical_gguf.py tests/test_import_progress.py tests/test_compute.py tests/test_single_import_ui.py tests/test_generation_stats.py tests/test_latency.py tests/test_reply_notifications.py tests/test_performance_code.py tests/test_image_import.py tests/test_vulkan_pipeline.py tests/test_strict_vulkan.py
      - name: Real ggml CPU tensor dispatch blocked before math
        run: bash ci/log_step.sh strict-vulkan-host bash scripts/test_strict_vulkan_host.sh
      - name: Real APK serialization and GGUF reader through DEX to JVM
        env:
          APKTOOL_JAR: .cache/tools/package/lib/apktool.jar
          GGUF_TEST_STRICT_GPU: '1'
        run: |
          bash ci/log_step.sh physical-jvm bash scripts/test_host.sh dist/GGUF-Chat-mobile-unsigned.apk
          GGUF_READER_JAR="$PWD/.cache/host-tests/application.jar" bash ci/log_step.sh physical-reader-apk .venv/bin/python -m pytest -q tests/test_physical_gguf.py
      - name: Upload unsigned GGUFTX build candidate
        uses: actions/upload-artifact@v4
        with:
          name: gguftx-unsigned-apk
          path: |
            dist/GGUF-Chat-mobile-unsigned.apk
            dist/mobile-build.json
          if-no-files-found: error
          retention-days: 30
      - name: Relay unsigned build for private local signing
        run: |
          mkdir -p .delivery
          cp dist/GGUF-Chat-mobile-unsigned.apk .delivery/
          cp dist/mobile-build.json .delivery/
          git config user.name 'GGUF build relay'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .delivery/GGUF-Chat-mobile-unsigned.apk .delivery/mobile-build.json
          git commit -m 'Relay unsigned mobile APK for persistent private signing [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"
      - name: Real model fixtures for physical GGUF acceptance
        run: |
          bash ci/mobile-models.sh
          .venv/bin/pip install 'numpy==2.2.6' 'tqdm==4.67.1' 'pyyaml==6.0.2'
      - name: Ephemeral emulator-only signature (NOT an update key)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/emulator-only.p12" -storetype PKCS12 -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Disposable emulator test, O=NOT FOR RELEASE'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/emulator-only.p12" --ks-pass pass:android --key-pass pass:android --out .cache/physical-emulator.apk .delivery/GGUF-Chat-mobile-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify .cache/physical-emulator.apk
      - name: Prepare paired before-after speed benchmark
        run: |
          set -euo pipefail
          mkdir -p .cache evidence
          baseline=.delivery/GGUF-Chat-mobile.apk
          echo '323fd5a33667c6cab278699e97c89fe253e1bb7acead45b869729bf022eb9f5c  .delivery/GGUF-Chat-mobile.apk' | sha256sum --check -
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/emulator-only.p12" --ks-pass pass:android --key-pass pass:android --out .cache/speed-baseline.apk "$baseline"
          "$signer" verify --verbose --print-certs .cache/speed-baseline.apk > evidence/speed-baseline-signature.txt
          "$signer" verify .cache/physical-emulator.apk
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          digest=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          Path('.cache/speed-candidate-active.json').write_text(json.dumps({
              'apk_sha256':digest('.cache/physical-emulator.apk'),
              'baseline_sha256':digest('.cache/speed-baseline.apk'),
              'baseline_source_sha256':'323fd5a33667c6cab278699e97c89fe253e1bb7acead45b869729bf022eb9f5c',
              'target_gain_percent':50.0,
          },indent=2))
          PY
      - name: Download pinned official Termux x86_64 APK and verify release checksum
        run: |
          set -euo pipefail
          mkdir -p .cache
          version=v0.118.3
          asset="termux-app_${version}+github-debug_x86_64.apk"
          base="https://github.com/termux/termux-app/releases/download/${version}"
          curl --fail --location --retry 3 --max-time 300 "${base}/${asset//+/%2B}" -o .cache/termux-app-x86_64.apk
          curl --fail --location --retry 3 --max-time 60 "${base}/termux-app_${version}%2Bgithub-debug_sha256sums" -o .cache/termux-sha256sums
          expected="$(grep -F "$asset" .cache/termux-sha256sums | head -1 | awk '{print $1}')"
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" .cache/termux-app-x86_64.apk | sha256sum --check -
      - name: KVM for actual Android acceptance
        run: sudo chmod a+rw /dev/kvm
      - name: Software Vulkan for physical unified GGUF
        run: bash ci/prepare_vulkan.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GGUF_MOBILE_VULKAN: '1'
          GGUF_TEST_APK: .cache/physical-emulator.apk
          GGUF_TERMUX_TEST_APK: .cache/termux-app-x86_64.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu host -feature Vulkan -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: .venv/bin/python scripts/test_tool_integrations_android.py && .venv/bin/python scripts/test_physical_android.py && .venv/bin/python scripts/test_attachment_android.py && .venv/bin/python scripts/test_inference_android.py && GGUF_SPEED_CANDIDATE_FILE=.cache/speed-candidate-active.json .venv/bin/python scripts/test_generation_stats_android.py
      - name: Report physical GGUF acceptance
        if: always()
        run: python3 ci/report_android.py evidence
      - name: Publish bounded physical GGUF evidence
        if: always()
        run: bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-build-diagnostics
          path: |
            dist/mobile-build.json
            .cache/ci-logs/
            evidence/
  test:
    if: ${{ contains(github.event.head_commit.message, '[signed mobile]') && !contains(github.event.head_commit.message, '[gemma4 delivery]') && !contains(github.event.head_commit.message, '[progress candidate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact signed APK and pinned independent GGUF reader
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'numpy==2.2.6' 'tqdm==4.67.1' 'pyyaml==6.0.2'
          git clone --depth 1 --branch b6500 https://github.com/ggml-org/llama.cpp .cache/llama-mobile
          test "$(git -C .cache/llama-mobile rev-parse HEAD)" = a7a98e0fffed794396b3fbad4dcdbbc184963645
          python3 ci/verify_physical_signed.py
      - name: Real compatible GGUF and mmproj
        run: bash ci/mobile-models.sh
      - name: KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Software Vulkan environment
        if: ${{ contains(github.event.head_commit.message, '[vulkan test]') }}
        run: bash ci/prepare_vulkan.sh
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          GGUF_SIGNATURE_SCOPE: 'delivery signature; exact signed APK, not emulator-only signing'
          GGUF_MOBILE_VULKAN: ${{ contains(github.event.head_commit.message, '[vulkan test]') && '1' || '0' }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 6144M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu ${{ contains(github.event.head_commit.message, '[vulkan test]') && 'host' || 'swiftshader_indirect' }} -feature Vulkan -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: .venv/bin/python scripts/test_physical_android.py && .venv/bin/python scripts/test_attachment_android.py && .venv/bin/python scripts/test_inference_android.py
      - name: Report
        if: always()
        run: python3 ci/report_android.py evidence
      - name: Publish evidence
        if: always()
        run: bash ci/publish_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pair-evidence
          path: evidence/
