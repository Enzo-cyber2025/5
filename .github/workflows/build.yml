name: Build VulcanMind APK

on:
  push:
    branches:
      - main
      - arena/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "NDK=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK (full Kotlin + Vulkan)
        run: ./gradlew :app:assembleRelease --stacktrace --info

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/release/*.apk
          # quick check with apkanalyzer if available
          ls -l $ANDROID_SDK_ROOT/build-tools/34.0.0/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VulcanMind-Vulkan-7.0
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish to Release (on tag or manual)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          gh release upload vulkan-v7-7 app/build/outputs/apk/release/*.apk --clobber || echo "no release yet"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
