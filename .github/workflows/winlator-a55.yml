name: winlator-a55
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [wl.v]
  workflow_dispatch:
permissions: write-all
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: ping
        run: python3 wl/ping.py
      - name: build
        run: bash wl/build.sh
      - name: postlog
        if: always()
        run: python3 wl/postlog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W
          path: |
            W.apk
            W.sha256
            wl/build.log
          if-no-files-found: ignore
      - name: pub
        if: success()
        run: |
          set -e
          T=winlator-a55
          gh release delete "$T" -y || true
          git tag -f "$T" HEAD
          git push -f origin "$T" || true
          gh release create "$T" --title "Winlator-A55 pre-AOT" --notes-file wl/NOTES.md W.apk W.sha256
        env:
          GH_TOKEN: ${{ github.token }}
