name: winlator-a55
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [wl.v]
  workflow_dispatch:
permissions: write-all
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: ping
        run: python3 wl/ping.py
      - name: build
        shell: bash
        run: bash wl/build.sh
      - name: postlog
        if: always()
        run: |
          python3 -c "
          import json,os,urllib.request
          log=open('wl/build.log','rb').read().decode('utf-8','replace')[-58000:] if os.path.exists('wl/build.log') else '(no log)'
          req=urllib.request.Request(f'https://api.github.com/repos/{os.environ[\"GITHUB_REPOSITORY\"]}/issues/7/comments',
            data=json.dumps({'body':'### build log\n\n```\n'+log+'\n```\n'}).encode(),
            headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          try: urllib.request.urlopen(req,timeout=30)
          except Exception as e: print('postlog err',e)
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: W
          path: |
            W.apk
            W.sha256
            wl/build.log
          if-no-files-found: ignore
      - name: pub
        if: success()
        shell: bash
        run: |
          set -e
          T=winlator-a55
          gh release delete "$T" -y || true
          git tag -f "$T" HEAD; git push -f origin "$T" || true
          gh release create "$T" --title "Winlator-A55 pre-AOT" --notes-file wl/NOTES.md W.apk W.sha256
        env: {GH_TOKEN: ${{ github.token }}}
