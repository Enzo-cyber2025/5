name: winlator-a55
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [wl.v]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: build
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          wget -q https://github.com/nickola/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /tmp/uber.jar
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version
          OK=0
          for U in \
            https://github.com/brunovalads/Winlator/releases/download/8.0.1-mod/Winlator_8.0.1-mod.apk \
            https://github.com/brunovalads/Winlator/releases/download/8.0/Winlator_8.0.apk \
            https://github.com/Winlator/Winlator/releases/download/v8.0/Winlator_v8.0.apk; do
            rm -f src.apk
            if wget --tries=2 --timeout=90 "$U" -O src.apk && file src.apk | grep -qi "zip\|apk\|android"; then
              OK=1; echo "OK: $U"; ls -la src.apk; file src.apk; break
            fi
          done
          test "$OK" = 1
          apktool d src.apk -o out -f
          bash wl/inj.sh out
          apktool b out -o u.apk
          ls -la u.apk
          java -jar /tmp/uber.jar -a u.apk --out . --allowResign
          cp *-aligned-signed.apk W.apk
          ls -la W.apk
          sha256sum W.apk | tee W.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: W, path: "W.apk\nW.sha256", if-no-files-found: ignore}
      - name: pub
        if: success()
        run: |
          T=winlator-a55
          gh release delete "$T" -y 2>/dev/null || true
          git tag -f "$T" HEAD; git push -f origin "$T" 2>/dev/null || true
          gh release create "$T" --title "Winlator-A55 pre-AOT" --notes "Box64 DYNAREC persistente + DXVK forçado. Copie sua pasta BeamNG.drive." W.apk W.sha256
        env: {GH_TOKEN: ${{ github.token }}}
