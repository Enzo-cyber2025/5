name: winlator-a55
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [wl.v]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y wget unzip apksigner zipalign
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version
          OK=0
          for U in \
            https://github.com/brunovalads/Winlator/releases/download/8.0.1-mod/Winlator_8.0.1-mod.apk \
            https://github.com/brunovalads/Winlator/releases/download/8.0/Winlator_8.0.apk; do
            rm -f src.apk
            wget --tries=2 --timeout=90 "$U" -O src.apk && file src.apk | grep -qi "zip\|apk" && OK=1 && break || true
          done
          [ $OK = 1 ]
          apktool d src.apk -o out -f
          bash wl/inj.sh out
          apktool b out -o u.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias u -keyalg RSA -keysize 2048 -validity 10000 -dname CN=A -noprompt
          zipalign -f 4 u.apk a.apk || cp u.apk a.apk
          apksigner sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out W.apk a.apk
          sha256sum W.apk | tee W.sha256
      - uses: actions/upload-artifact@v4
        with: {name: W, path: "W.apk\nW.sha256", if-no-files-found: ignore}
      - name: pub
        if: success()
        run: |
          T=winlator-a55
          gh release delete "$T" -y 2>/dev/null || true
          git tag -f "$T" HEAD; git push -f origin "$T" 2>/dev/null || true
          gh release create "$T" --title "Winlator-A55 pre-AOT" --notes "DXVK+Box64 persistent cache" W.apk W.sha256
        env:
          GH_TOKEN: ${{ github.token }}
