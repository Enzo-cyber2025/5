name: Winlator A55 (pre-AOT Box64)
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [winlator-a55/patch_version.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Deps
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y wget unzip aapt apksigner zipalign
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          cat > /usr/local/bin/apktool <<'S'
#!/bin/sh
exec java -jar /usr/local/bin/apktool.jar "$@"
S
          chmod +x /usr/local/bin/apktool
      - name: Baixa APK
        run: wget -q https://github.com/brunovalads/Winlator/releases/download/8.0.1-mod/Winlator_8.0.1-mod.apk -O winlator-orig.apk && ls -la winlator-orig.apk
      - name: Desempacota
        run: apktool d winlator-orig.apk -o out -f
      - name: Injeta
        run: bash winlator-a55/inject.sh out
      - name: Empacota e assina
        run: |
          apktool b out -o u.apk
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias u -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=A55" -noprompt
          zipalign -f 4 u.apk a.apk || cp u.apk a.apk
          apksigner sign --ks ks.jks --ks-pass pass:android --key-pass pass:android --out Winlator-A55-preAOT.apk a.apk
          ls -la Winlator-A55-preAOT.apk
          sha256sum Winlator-A55-preAOT.apk | tee Winlator-A55-preAOT.sha256
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-A55
          path: |
            Winlator-A55-preAOT.apk
            Winlator-A55-preAOT.sha256
      - name: Publica
        run: |
          TAG=winlator-a55
          gh release delete "$TAG" -y 2>/dev/null || true
          git tag -f "$TAG" HEAD; git push -f origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" --title "Winlator A55 (pre-AOT Box64)" --notes-file winlator-a55/RELEASE_NOTES.md Winlator-A55-preAOT.apk Winlator-A55-preAOT.sha256
        env:
          GH_TOKEN: ${{ github.token }}
