name: Winlator A55 (pre-AOT Box64)
on:
  push:
    branches: [arena/01a0d024-5]
    paths: [winlator-a55/patch_version.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build
        id: b
        run: |
          set +e
          exec > >(tee build.log) 2>&1
          PS4='+ [\$?] '; set -x
          echo "== java =="; which java; java -version
          echo "== wget =="; which wget; wget --version | head -1
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar && echo "apktool ok" || echo "apktool FALHOU"
          wget -q https://github.com/nickola/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /tmp/uber.jar && echo "uber ok" || echo "uber FALHOU"
          printf '#!/bin/sh\nexec java -jar /tmp/apktool.jar "$@"\n' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version
          OK=0
          for URL in \
            https://github.com/brunovalads/Winlator/releases/download/8.0.1-mod/Winlator_8.0.1-mod.apk \
            https://github.com/brunovalads/Winlator/releases/download/8.0/Winlator_8.0.apk \
            https://github.com/Winlator/Winlator/releases/download/v8.0/Winlator_v8.0.apk
          do
            echo "-- $URL"
            rm -f winlator-orig.apk
            wget --tries=1 --timeout=30 "$URL" -O winlator-orig.apk && { file winlator-orig.apk; OK=1; break; }
          done
          if [ $OK = 0 ]; then echo "TODOS os downloads falharam"; ls -la; exit 1; fi
          apktool d winlator-orig.apk -o out -f || exit 2
          bash winlator-a55/inject.sh out || exit 3
          apktool b out -o unsigned.apk || exit 4
          java -jar /tmp/uber.jar -a unsigned.apk --out . || exit 5
          cp *-aligned-signed.apk Winlator-A55-preAOT.apk
          sha256sum Winlator-A55-preAOT.apk | tee Winlator-A55-preAOT.sha256
          echo "BUILD_OK"
      - name: Resumo
        if: always()
        run: |
          {
            echo "## Build log"
            echo '```'
            cat build.log 2>/dev/null | tail -120
            echo '```'
            echo ""
            echo "- ls cwd:"; ls -la | tail -20
          } > $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Winlator-A55
          path: |
            Winlator-A55-preAOT.apk
            Winlator-A55-preAOT.sha256
            build.log
          if-no-files-found: ignore
      - name: Publish
        if: success() && hashFiles('Winlator-A55-preAOT.apk') != ''
        run: |
          TAG=winlator-a55
          gh release delete "$TAG" -y 2>/dev/null || true
          git tag -f "$TAG" HEAD; git push -f origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" --title "Winlator-A55 pre-AOT" --notes-file winlator-a55/RELEASE_NOTES.md Winlator-A55-preAOT.apk Winlator-A55-preAOT.sha256
        env: {GH_TOKEN: ${{ github.token }}}
