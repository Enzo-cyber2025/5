name: Box64 Termux ARM64 installation and x86-64 execution test
on:
  push:
    branches: [arena/10b3367a-5]
    paths:
      - '.github/workflows/box64-termux-arm64.yml'
      - 'scripts/test_box64_termux_arm64.py'
      - 'tests/box64-termux/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-x86-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build harmless x86-64 Linux proof executable
        run: |
          set -euo pipefail
          mkdir -p .cache/box64
          gcc -nostdlib -static -no-pie -Wl,-e,_start \
            tests/box64-termux/x86_64-proof.S \
            -o .cache/box64/box64-x86_64-proof
          file .cache/box64/box64-x86_64-proof
          readelf -h .cache/box64/box64-x86_64-proof | grep -F 'Machine:                           Advanced Micro Devices X86-64'
      - uses: actions/upload-artifact@v4
        with:
          name: box64-x86-proof
          path: .cache/box64/box64-x86_64-proof
          retention-days: 30
  box64-arm64:
    needs: build-x86-proof
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: box64-x86-proof
          path: .cache/box64
      - name: Install ARM64 Android system image and official Termux APK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /tmp/android-licenses.log
          set -o pipefail
          "$SDKMANAGER" 'platforms;android-35' 'system-images;android-35;default;arm64-v8a'
          mkdir -p .cache
          version=v0.118.3
          asset="termux-app_${version}+github-debug_arm64-v8a.apk"
          sums="termux-app_${version}+github-debug_sha256sums"
          base="https://github.com/termux/termux-app/releases/download/${version}"
          curl --fail --location --retry 3 --max-time 300 "${base}/${asset//+/%2B}" -o .cache/termux-app-arm64.apk
          curl --fail --location --retry 3 --max-time 60 "${base}/${sums//+/%2B}" -o .cache/termux-sha256sums-arm64
          expected="$(grep -F "$asset" .cache/termux-sha256sums-arm64 | head -1 | awk '{print $1}')"
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" .cache/termux-app-arm64.apk | sha256sum --check -
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          BOX64_TERMUX_APK: .cache/termux-app-arm64.apk
          BOX64_X86_PROOF: .cache/box64/box64-x86_64-proof
        with:
          api-level: 35
          arch: arm64-v8a
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8192M
          emulator-boot-timeout: 2400
          disable-animations: true
          emulator-options: -accel off -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: python3 scripts/test_box64_termux_arm64.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: box64-termux-arm64-evidence
          path: evidence/box64-arm64/
          if-no-files-found: warn
          retention-days: 30
