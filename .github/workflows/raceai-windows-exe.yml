name: RaceAI 2D — executável Windows

# Gera o .exe do jogo de corrida (PyTorch CPU 2.4.1 + DirectML) em runner
# Windows e publica o ZIP como artefato e na release "exe-windows".

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar na release 'exe-windows'"
        type: boolean
        default: true
  push:
    branches: ["arena/5d450bd0-5"]
    paths:
      - "raceai/**"
      - ".github/workflows/raceai-windows-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: raceai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Cache do pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-311-torch241-${{ hashFiles('raceai/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-311-

      - name: Instalar PyTorch CPU 2.4.1 + DirectML + dependências
        run: |
          Write-Output "== FASE: dependências ==" | Out-File -Append build.log
          python -m pip install --upgrade pip 2>&1 | Tee-Object -Append build.log
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu 2>&1 | Tee-Object -Append build.log
          pip install --no-deps torch-directml==0.2.5.dev240914 2>&1 | Tee-Object -Append build.log
          pip install -r requirements-build.txt 2>&1 | Tee-Object -Append build.log
          pip install -r requirements.txt 2>&1 | Tee-Object -Append build.log
          python -c "import torch; print('torch ok', torch.__version__)" 2>&1 | Tee-Object -Append build.log

      - name: Versões e backends detectados
        run: |
          Write-Output "== FASE: versões ==" | Out-File -Append build.log
          python -c "import sys, numpy, pygame, torch; print('python', sys.version.split()[0]); print('numpy', numpy.__version__); print('pygame', pygame.__version__); print('torch', torch.__version__)" 2>&1 | Tee-Object -Append build.log
          python -c "import torch_directml; print('DirectML ok:', torch_directml.device_name(0) or '(nome vazio)')" 2>&1 | Tee-Object -Append build.log
          $env:PYTHONPATH = "src"
          python -c "from raceai.ai.backend import list_devices; [print('backend', k, '-', v) for k, v in list_devices()]" 2>&1 | Tee-Object -Append build.log
          Remove-Item Env:\PYTHONPATH -ErrorAction SilentlyContinue

      - name: Testes (núcleo + interface headless)
        id: testes
        continue-on-error: true          # ambiente sem vídeo não deve impedir o .exe
        run: |
          Write-Output "== FASE: testes ==" | Out-File -Append build.log
          $env:PYTHONUNBUFFERED = "1"
          python -u tests/run_tests.py 2>&1 | Tee-Object -Append build.log
          Write-Output ("exit={0}" -f $LASTEXITCODE) | Out-File -Append build.log
          exit $LASTEXITCODE

      - name: Teste do DirectML dentro do pacote (informativo)
        id: dml
        continue-on-error: true
        run: |
          Write-Output "== FASE: directml ==" | Out-File -Append build.log
          $env:RACEAI_TEST_DML = "1"
          python -u -c "import sys; sys.path.insert(0, 'src'); import tests.test_core as t; t.test_torch_backend_when_available()" 2>&1 | Tee-Object -Append build.log

      - name: Build (PyInstaller)
        id: pyinstaller
        run: |
          Write-Output "== FASE: build ==" | Out-File -Append build.log
          pyinstaller raceai.spec --noconfirm --clean 2>&1 | Tee-Object -Append build.log
          Write-Output ("exit={0}" -f $LASTEXITCODE) | Out-File -Append build.log
          exit $LASTEXITCODE

      - name: Diagnóstico de importação (informativo)
        id: imports
        continue-on-error: true
        run: |
          Write-Output "== FASE: imports ==" | Out-File -Append build.log
          .\dist\RaceAI2D\RaceAI2D-console.exe --debug-imports 2>&1 | Tee-Object -Append build.log

      - name: Smoke test do executável
        id: smoke
        run: |
          Write-Output "== FASE: smoke test ==" | Out-File -Append build.log
          $env:RACEAI_NO_DML = "1"
          .\dist\RaceAI2D\RaceAI2D-console.exe --selftest 2>&1 | Tee-Object -Append build.log
          $selftest = $LASTEXITCODE
          $env:RACEAI_NO_DML = ""
          .\dist\RaceAI2D\RaceAI2D-console.exe --bench --bench-agents 120 --bench-seconds 3 2>&1 | Tee-Object -Append build.log
          .\dist\RaceAI2D\RaceAI2D-console.exe --dml-probe 2>&1 | Tee-Object -Append build.log
          Write-Output ("selftest exit={0}" -f $selftest) | Out-File -Append build.log
          exit $selftest

      - name: Empacotar (zip)
        run: |
          Write-Output "== FASE: pacote ==" | Out-File -Append build.log
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item INSTALL.md package\ -ErrorAction SilentlyContinue
          Copy-Item README.md  package\ -ErrorAction SilentlyContinue
          Copy-Item MODS.md    package\ -ErrorAction SilentlyContinue
          7z a -tzip -mx=5 -mmt=on "package\RaceAI2D-windows.zip" ".\dist\RaceAI2D\*"
          $zip = Get-Item "package\RaceAI2D-windows.zip"
          "Tamanho do zip: {0} MB" -f [math]::Round($zip.Length/1MB,1)
          if ($zip.Length -gt 1900MB) {
            Remove-Item "package\RaceAI2D-windows.zip"
            7z a -tzip -mx=5 -mmt=on -v1900m "package\RaceAI2D-windows.zip" ".\dist\RaceAI2D\*"
          }
          Get-ChildItem package | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Resumo do build (JSON)
        id: resumo
        if: always()
        run: python tools/ci_summary.py

      - name: Artefato do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RaceAI2D-windows
          path: |
            raceai/package/*.zip*
            raceai/build.log
            .delivery/raceai-exe-build.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Artefato de logs (leve)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceai-build-log
          path: |
            raceai/build.log
            .delivery/raceai-exe-build.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar na release exe-windows
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && github.ref == 'refs/heads/arena/5d450bd0-5' && success())
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release view exe-windows | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create exe-windows --title "RaceAI 2D — executável Windows" --notes "Gerado automaticamente por .github/workflows/raceai-windows-exe.yml (branch $env:GITHUB_REF_NAME, commit $env:GITHUB_SHA)."
          }
          gh release upload exe-windows (Get-ChildItem package/*.zip*) --clobber

      - name: Publicar resumo no repositório
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .delivery/raceai-exe-build.json
          if (git diff --cached --quiet) { Write-Output "sem mudancas no resumo"; exit 0 }
          git commit -m "CI: resumo do build do RaceAI2D.exe (run ${{ github.run_number }}) [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
