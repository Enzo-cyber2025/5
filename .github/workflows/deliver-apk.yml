name: Deliver tested APK
on:
  push:
    branches: [arena/01a09b42-5]
    paths: [.github/workflows/deliver-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirm successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Enzo-cyber2025/5/actions/runs/34778868262 > /tmp/source-run.json
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/source-run.json'))
          assert r['conclusion'] == 'success'
          assert r['head_sha'] == 'f6dc9542a835481a5e54448b186be739947f806a'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: gguf-chat-host-tested
          path: tested
          run-id: 34778868262
          github-token: ${{ github.token }}
      - name: Verify exact APK and publish standalone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Enzo-cyber2025/5
        run: |
          set -euo pipefail
          APK=tested/GGUF-Chat-repaired.apk
          echo "b3ae6a0df9c9cd38f947f67df6c19fe01ea6dfd39eb4f39979cd13009c62a0f6  $APK" | sha256sum -c -
          TAG=gguf-apk-f6dc954
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target f6dc9542a835481a5e54448b186be739947f806a \
              --prerelease --latest=false --title "GGUF Chat — tested Vulkan APK" \
              --notes "Exact signed APK from successful run 34778868262. Android API 35 x86_64: 31/31 layers on software Vulkan, native generation completed and reply persisted. 94 tooling and 33 JVM tests passed. Physical GPU/ARM64, answer quality, UTF-8, SAF and vision are NOT approved. Test signing key differs from existing installations; back up important data before uninstalling. SHA-256: b3ae6a0df9c9cd38f947f67df6c19fe01ea6dfd39eb4f39979cd13009c62a0f6."
          fi
          gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | select(.name == "GGUF-Chat-repaired.apk") | .url'
