# Build and run the emulator core on ARM64, two independent ways.
#
# Why this exists: the ARM64 emitter cannot be validated by inspection. A wrong
# encoding still looks like a plausible 32-bit word; what settles it is emitting
# into an executable page and running it. That requires an aarch64 host or a
# user-mode emulator, so the emit-and-execute harness is run on both, and the
# final step of each job asserts that code really executed rather than skipped.
#
# Two jobs rather than one because they fail differently: a native runner proves
# behaviour on real hardware, QEMU proves it without needing an ARM64 runner to
# be available. If only one survives a platform change, the other still gates.

name: emu ARM64

on:
  push:
    branches:
      - arena/de730b27-5
    paths:
      - 'emu/**'
      - '.github/workflows/emu-arm64.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emu-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native aarch64 runner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner really is aarch64
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m = $arch"
          test "$arch" = aarch64 || { echo "runner is not aarch64"; exit 1; }

      - name: Build
        working-directory: emu
        run: make test_ptc test_x86 test_pe test_sweep test_translate test_emit_exec

      - name: Run the suite
        working-directory: emu
        run: |
          set +e; set -uo pipefail
          # Each binary gets its own timeout, and the trap names whichever one
          # was running if the step dies. Without that, a hang in one test is
          # indistinguishable from a hang in any other, and stdout is fully
          # buffered into a pipe so a hung binary prints nothing at all.
          # Only fires when a binary was actually in flight: on a clean run
          # running.txt is empty, and reporting an interruption that did not
          # happen is a false alarm that trains everyone to ignore the real one.
          trap 'b=$(cat /tmp/running.txt 2>/dev/null); if [ -n "$b" ]; then echo "::error title=suite-interrupted::last started: $b"; fi' EXIT
          run_one() {
            echo "$1" > /tmp/running.txt
            timeout 120 "$1" > "/tmp/$(basename "$1").log" 2>&1
            rc=$?
            echo "" > /tmp/running.txt
            # The flushed markers are the whole diagnostic, and a step log is
            # not readable from every environment, so they go into the annotation.
            taillog=$(tail -c 900 "/tmp/$(basename "$1").log" | tr '\n' '|' | tr -s ' ')
            cat "/tmp/$(basename "$1").log"
            if [ "$rc" -eq 124 ]; then
              echo "::error title=suite-hang::$(basename "$1") was still running after 120s. last output: ${taillog}"
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error title=suite-failure::$(basename "$1") exited ${rc}. last output: ${taillog}"
              exit 1
            fi
          }
          run_one ./test_ptc
          run_one ./test_x86
          run_one ./test_pe
          run_one ./test_sweep
          run_one ./test_translate
          run_one ./test_emit_exec
          cp /tmp/test_translate.log /tmp/translate.log
          cp /tmp/test_emit_exec.log /tmp/emit.log

      - name: Report where the suite stopped
        if: always()
        run: |
          set +e
          # Deliberately unable to fail. This step exists to explain a failure, so
          # a failure of its own is worse than useless - the previous version died
          # with exit 1 and published nothing. set +e, no pipefail, explicit exit 0.
          echo "last binary started: $(cat /tmp/running.txt 2>/dev/null)"
          for f in /tmp/test_translate.log /tmp/t_tr.log; do
            [ -f "$f" ] || continue
            v=$(grep '^VERDICT' "$f" | head -1 | tr -d '%\r' | cut -c1-250)
            lm=$(grep '^  \.\.' "$f" | tail -1 | tr -d '%\r' | cut -c1-120)
            ex=$(grep '^  EXECUTED' "$f" | tr '\n' ';' | tr -d '%\r' | cut -c1-300)
            fl=$(grep '^  FAIL' "$f" | head -5 | tr '\n' ';' | tr -d '%\r' | tr -s ' ' | cut -c1-700)
            echo "::notice title=diag-$(basename "$f")::VERDICT[${v}] LASTMARK[${lm}] EXEC[${ex}] FAILS[${fl}]"
          done
          exit 0

      - name: Assert generated code actually executed
        run: |
          set -euo pipefail
          die() { echo "$1"; echo "::error title=arm64-execution::$1"; exit 1; }
          grep -q "EXECUTED ON aarch64" /tmp/emit.log \
            || die "the emit harness skipped instead of executing ARM64 code"
          grep -q "SKIPPED NOT aarch64" /tmp/translate.log \
            && die "the pipeline reported a skip on an aarch64 runner"
          grep -q "EXECUTED ON aarch64" /tmp/translate.log \
            || die "the translated exe never ran on this aarch64 runner"
          # The guest stack model gets its own marker because it is a separate
          # capability with separate failure modes: STUR/LDUR against real
          # memory, exact stack arithmetic, and a runaway push that has to die
          # at the arena's guard page rather than in host memory. The pipeline
          # marker above would stay green if none of those ran.
          grep -q "EXECUTED ON aarch64: guest stack model" /tmp/translate.log \
            || die "the guest stack model never ran on this aarch64 runner"
          grep -q "contained by a guard page" /tmp/translate.log \
            || die "a runaway guest stack was not shown to fault at the guard page on this aarch64 runner"
          grep -q "entry -> 16" /tmp/translate.log \
            || die "the translated exe did not return 16 (SumTo(5)=15 from the DLL, then +1)"
          grep -q "EXECUTED FROM CACHE: 16" /tmp/translate.log \
            || die "host code reloaded from the cache did not return 16"
          echo "verified on real aarch64 hardware:"
          grep -E "EXECUTED (ON aarch64|FROM CACHE)" /tmp/translate.log

  qemu:
    name: aarch64 under QEMU user-mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install the cross toolchain
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          # libc6-dev-arm64-cross is named explicitly because -static needs the
          # arm64 libc.a; a missing static libc otherwise surfaces much later as
          # a confusing link error.
          #
          # qemu-user-static is deliberately NOT installed here. setup-qemu-action
          # has already registered the binfmt handlers, and installing the distro
          # package registers them a second time - which is what hung this step for
          # ten minutes. Executing an aarch64 ELF directly goes through binfmt.
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Report the cross toolchain
        run: |
          set -uo pipefail
          aarch64-linux-gnu-gcc --version | head -1
          echo "static libc:"
          ls -l /usr/aarch64-linux-gnu/lib/libc.a || echo "  MISSING libc.a"
          echo "binfmt handlers registered:"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo "  none visible"
          echo "explicit qemu binary:"
          command -v qemu-aarch64-static || echo "  not on PATH (binfmt will be used)"

      - name: Cross-compile statically for aarch64
        working-directory: emu
        run: |
          # Not set -e: the point of this step is to capture the compiler's own
          # error text and publish it as an annotation. Job logs for a public
          # repo cannot be read from every environment, and an annotation can,
          # so a failure here has to explain itself through the API.
          set -uo pipefail
          CC=aarch64-linux-gnu-gcc
          FLAGS="-std=c11 -Wall -Wextra -Wshadow -Werror -O2 -static"
          build() {
            echo "+ $CC $FLAGS -o $*"
            $CC $FLAGS -o "$@"
          }
          {
            build /tmp/t_ptc  test_ptc.c ptc.c &&
            build /tmp/t_x86  test_x86_decode.c x86_decode.c &&
            build /tmp/t_pe   test_pe_load.c pe_load.c &&
            build /tmp/t_sw   test_sweep.c sweep.c pe_load.c ptc.c x86_decode.c a64_emit.c translate.c &&
            build /tmp/t_tr   test_translate.c translate.c pe_load.c ptc.c x86_decode.c a64_emit.c gstack.c &&
            build /tmp/t_emit test_emit_exec.c
          } > /tmp/build.log 2>&1
          rc=$?
          cat /tmp/build.log
          if [ "$rc" -ne 0 ]; then
            flat=$(tr '\n' ' ' < /tmp/build.log | tr -s ' ' | tail -c 900)
            echo "::error title=cross-compile-failed rc=${rc}::${flat}"
          fi
          exit $rc

      - name: Confirm the binaries are aarch64 ELF
        run: |
          set -euo pipefail
          file /tmp/t_emit | tee /tmp/file.log
          grep -qi "ARM aarch64" /tmp/file.log || {
            echo "cross-compile did not produce an aarch64 binary"; exit 1; }

      - name: Run the suite under QEMU
        run: |
          set -uo pipefail
          # Prefer an explicit qemu binary when one exists; otherwise execute the
          # aarch64 ELF directly and let binfmt_misc dispatch it. Either way the
          # code really runs on an emulated aarch64 CPU.
          run_arm64() {
            if command -v qemu-aarch64-static >/dev/null 2>&1; then
              qemu-aarch64-static "$@"
            else
              "$@"
            fi
          }
          # Bounded and self-reporting for the same reason as the native job:
          # under QEMU a hang is even less diagnosable, since the emulator is
          # between the test and the kernel.
          # Only fires when a binary was actually in flight: on a clean run
          # running.txt is empty, and reporting an interruption that did not
          # happen is a false alarm that trains everyone to ignore the real one.
          trap 'b=$(cat /tmp/running.txt 2>/dev/null); if [ -n "$b" ]; then echo "::error title=suite-interrupted::last started: $b"; fi' EXIT
          run_one() {
            echo "$1" > /tmp/running.txt
            timeout 600 bash -c "$(declare -f run_arm64); run_arm64 $1" \
              > "/tmp/$(basename "$1").log" 2>&1
            rc=$?
            echo "" > /tmp/running.txt
            # The flushed markers are the whole diagnostic, and a step log is
            # not readable from every environment, so they go into the annotation.
            taillog=$(tail -c 900 "/tmp/$(basename "$1").log" | tr '\n' '|' | tr -s ' ')
            cat "/tmp/$(basename "$1").log"
            if [ "$rc" -eq 124 ]; then
              echo "::error title=suite-hang::$(basename "$1") was still running under QEMU after 600s. last output: ${taillog}"
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error title=suite-failure::$(basename "$1") exited ${rc} under QEMU. last output: ${taillog}"
              exit 1
            fi
          }
          run_one /tmp/t_ptc
          run_one /tmp/t_x86
          run_one /tmp/t_pe
          run_one /tmp/t_sw
          run_one /tmp/t_tr
          run_one /tmp/t_emit
          cp /tmp/t_tr.log /tmp/translate.log
          cp /tmp/t_emit.log /tmp/emit.log

      - name: Report where the suite stopped
        if: always()
        run: |
          set +e
          # Deliberately unable to fail. This step exists to explain a failure, so
          # a failure of its own is worse than useless - the previous version died
          # with exit 1 and published nothing. set +e, no pipefail, explicit exit 0.
          echo "last binary started: $(cat /tmp/running.txt 2>/dev/null)"
          for f in /tmp/test_translate.log /tmp/t_tr.log; do
            [ -f "$f" ] || continue
            v=$(grep '^VERDICT' "$f" | head -1 | tr -d '%\r' | cut -c1-250)
            lm=$(grep '^  \.\.' "$f" | tail -1 | tr -d '%\r' | cut -c1-120)
            ex=$(grep '^  EXECUTED' "$f" | tr '\n' ';' | tr -d '%\r' | cut -c1-300)
            fl=$(grep '^  FAIL' "$f" | head -5 | tr '\n' ';' | tr -d '%\r' | tr -s ' ' | cut -c1-700)
            echo "::notice title=diag-$(basename "$f")::VERDICT[${v}] LASTMARK[${lm}] EXEC[${ex}] FAILS[${fl}]"
          done
          exit 0

      - name: Assert generated code actually executed
        run: |
          set -euo pipefail
          die() { echo "$1"; echo "::error title=arm64-execution::$1"; exit 1; }
          grep -q "EXECUTED ON aarch64" /tmp/emit.log \
            || die "QEMU ran the suite but the emit harness executed nothing"
          grep -q "SKIPPED NOT aarch64" /tmp/translate.log \
            && die "the pipeline reported a skip under QEMU"
          grep -q "EXECUTED ON aarch64" /tmp/translate.log \
            || die "the translated exe never ran under QEMU"
          # The guest stack model gets its own marker because it is a separate
          # capability with separate failure modes: STUR/LDUR against real
          # memory, exact stack arithmetic, and a runaway push that has to die
          # at the arena's guard page rather than in host memory. The pipeline
          # marker above would stay green if none of those ran.
          grep -q "EXECUTED ON aarch64: guest stack model" /tmp/translate.log \
            || die "the guest stack model never ran under QEMU"
          grep -q "contained by a guard page" /tmp/translate.log \
            || die "a runaway guest stack was not shown to fault at the guard page under QEMU"
          grep -q "entry -> 16" /tmp/translate.log \
            || die "the translated exe did not return 16 under QEMU"
          grep -q "EXECUTED FROM CACHE: 16" /tmp/translate.log \
            || die "host code reloaded from the cache did not return 16 under QEMU"
          echo "verified under QEMU user-mode:"
          grep -E "EXECUTED (ON aarch64|FROM CACHE)" /tmp/translate.log

  real-binary:
    name: pe_info against a real shipped executable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the parser and the inspector
        working-directory: emu
        run: make test_pe pe_info

      - name: Inspect the synthetic fixture
        working-directory: emu
        run: |
          set -euo pipefail
          ./test_pe --write-fixture /tmp/emu_fixture.exe > /dev/null
          ./pe_info /tmp/emu_fixture.exe | head -20
          ./test_pe | tail -2

      - name: Download a pinned real x86-64 Windows executable
        run: |
          # Not set -e: every failure below has to say which one it was, through
          # an annotation, because job logs are not readable from everywhere.
          set -uo pipefail
          # ripgrep 14.1.1, MIT/Apache-2.0, from its own project release.
          # Chosen because it is a genuine shipped Windows executable with a
          # real import table, it is small, the release is pinned by tag, and it
          # publishes a .sha256 beside the asset - so the download is verified
          # rather than trusted. It is used only as a parse target on an
          # ephemeral runner, and is never committed or redistributed.
          # The published .sha256 is Windows CertUtil output, not sha256sum
          # format - it is three lines, and the hash is the middle one:
          #   SHA256 hash of <name>:
          #   <64 hex>
          #   CertUtil: -hashfile command completed successfully.
          # Reading field 1 gets the literal word "SHA256", which is what made
          # this step fail the first time. So the hash is extracted by pattern,
          # and independently pinned here: three values have to agree, meaning a
          # swapped asset fails even if its checksum file were swapped with it.
          PINNED="d0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1"
          base="https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o /tmp/rg.zip "$base" || {
            echo "::error title=download-failed::could not fetch the release zip"; exit 1; }
          curl -fsSL -o /tmp/rg.zip.sha256 "$base.sha256" || {
            echo "::error title=download-failed::could not fetch the checksum file"; exit 1; }
          echo "--- published checksum file, verbatim ---"
          cat /tmp/rg.zip.sha256
          published=$(grep -oE '[0-9a-fA-F]{64}' /tmp/rg.zip.sha256 | head -1)
          actual=$(sha256sum /tmp/rg.zip | awk '{print $1}')
          echo "pinned     $PINNED"
          echo "published  $published"
          echo "actual     $actual"
          if [ -z "$published" ]; then
            echo "::error title=checksum-unreadable::no 64-hex token found in the published checksum file"
            exit 1
          fi
          if [ "$published" != "$PINNED" ]; then
            echo "::error title=checksum-pin-mismatch::published=$published pinned=$PINNED"
            exit 1
          fi
          if [ "$actual" != "$PINNED" ]; then
            echo "::error title=checksum-mismatch::downloaded file digests to $actual, expected $PINNED"
            exit 1
          fi
          echo "verified: the download matches both the published digest and the pin"

      - name: Inspect the real executable
        run: |
          set -euo pipefail
          unzip -o -q /tmp/rg.zip -d /tmp/rg
          exe=$(find /tmp/rg -name 'rg.exe' | head -1)
          test -n "$exe" || { echo "rg.exe not found in the archive"; exit 1; }
          echo "inspecting $exe ($(stat -c %s "$exe") bytes)"
          ./emu/pe_info "$exe" | tee /tmp/real.report

      - name: Assert the report describes a real native x86-64 binary
        run: |
          set -euo pipefail
          fail() {
            echo "ASSERTION FAILED: $1"
            echo "::error title=real-binary-assertion::$1"
            exit 1
          }
          grep -q 'status:    PE_OK'      /tmp/real.report || fail "did not parse"
          grep -q 'x64 (AMD64)'           /tmp/real.report || fail "not reported as x86-64"
          grep -q 'PE32+ (64-bit)'        /tmp/real.report || fail "not reported as PE32+"
          grep -q 'managed:   no'         /tmp/real.report || fail "reported as managed"
          grep -q 'kernel32.dll'          /tmp/real.report || fail "no kernel32.dll import"
          grep -Eq 'imports:   [1-9][0-9]* DLL\(s\), [1-9][0-9]* function' /tmp/real.report \
            || fail "import enumeration came back empty"
          echo "--- what a real binary needs from the host ---"
          grep -E '^(imports:|  [A-Za-z].* - )' /tmp/real.report

      - name: Publish what the real binary actually needs
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f /tmp/real.report ]; then echo "no report to publish"; exit 0; fi
          {
            echo "### pe_info on a real shipped Windows executable"
            echo '```'
            grep -E '^(file|status|machine|format|kind|entry|managed|sections|directories|imports):' /tmp/real.report
            echo '```'
            echo "#### the DLLs it imports"
            echo '```'
            grep -E '^  [A-Za-z].* - ' /tmp/real.report
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # Annotations are the one channel readable back through the repository
          # API, so the measured result survives even where job logs cannot be
          # fetched. A job that asserts without reporting leaves the answer
          # locked inside a log.
          counts=$(grep -E '^(status|machine|format|managed|imports):' /tmp/real.report \
                   | tr '\n' ' ' | tr -s ' ' | head -c 900)
          dlls=$(grep -E '^  [A-Za-z].* - ' /tmp/real.report \
                 | tr '\n' ' ' | tr -s ' ' | head -c 3000)
          echo "::notice title=real-binary-measured::${counts} :: DLLS: ${dlls}"

      - name: Confirm no Windows binary entered the repository
        run: |
          set -euo pipefail
          # The download lives in /tmp and must never be committed. This is
          # asserted rather than assumed.
          if git ls-files | grep -qiE '\.(exe|dll|msi)$'; then
            echo "a Windows binary is tracked in this repository"; exit 1
          fi
          echo "no .exe/.dll/.msi tracked - ok"

  prewarm-real:
    name: pre-translation sweep over a real exe and its DLLs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: emu
        run: make test_sweep pe_info prewarm

      - name: Run the sweep suite
        working-directory: emu
        run: |
          set -euo pipefail
          ./test_sweep | tail -2

      - name: Download a real executable and its DLLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e; set -uo pipefail
          # Any failure here publishes its exit code and line number. A step that
          # dies somewhere unexpected is otherwise indistinguishable from one
          # that failed its own assertion, and adding handlers one command at a
          # time keeps missing the command that actually broke.
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "::error title=download-step::exit=${rc} line=${LINENO}"; fi' EXIT
          tag="1.11.2"
          name="HandBrake-${tag}-x86_64-Win_GUI.zip"
          # Byte length read from the release metadata once and pinned here, so
          # the job needs no API call at run time - an unauthenticated gh or a
          # rate-limited api.github.com must not be able to fail this step - and
          # so a changed release fails loudly instead of silently sweeping
          # something else.
          PINNED_SIZE="34937681"
          PINNED_SHA256="a8b9e38b085da2ed7309868bdf8b49a900453946d25d58612071957f21eebd27"
          url="https://github.com/HandBrake/HandBrake/releases/download/${tag}/${name}"
          curl -fsSL -o /tmp/hb.zip "$url"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=download-failed::curl exit ${rc} for ${url}"
            exit 1
          fi
          actual=$(stat -c %s /tmp/hb.zip)
          echo "downloaded ${actual} bytes; pinned ${PINNED_SIZE}"
          if [ "$actual" != "$PINNED_SIZE" ]; then
            echo "::error title=size-mismatch::downloaded ${actual}, pinned ${PINNED_SIZE}; re-pin deliberately"
            exit 1
          fi
          digest=$(sha256sum /tmp/hb.zip | awk '{print $1}')
          echo "sha256: ${digest}"
          echo "::notice title=handbrake-sha256::${digest} size=${actual}"
          if [ "$digest" != "$PINNED_SHA256" ]; then
            echo "::error title=digest-mismatch::downloaded ${digest}, pinned ${PINNED_SHA256}"
            exit 1
          fi
          echo "verified: size and digest both match the pinned release"

      - name: Enumerate the modules in the bundle
        run: |
          set -euo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "::error title=enumerate-the-modules-in-the-bundle::exit=${rc} line=${LINENO}"; fi' EXIT
          mkdir -p /tmp/hb
          unzip -q -o /tmp/hb.zip -d /tmp/hb
          find /tmp/hb -type f \( -iname '*.exe' -o -iname '*.dll' \) \
            | sort > /tmp/mods.list
          echo "executables: $(find /tmp/hb -type f -iname '*.exe' | wc -l)"
          echo "dlls:        $(find /tmp/hb -type f -iname '*.dll' | wc -l)"
          echo "total bytes: $(du -sb /tmp/hb | cut -f1)"
          test -s /tmp/mods.list || { echo "::error title=no-modules::nothing to sweep"; exit 1; }
          head -20 /tmp/mods.list

      - name: Pre-translate with a closing idle window
        run: |
          set -uo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "::error title=pre-translate-with-a-closing-idle-window::exit=${rc} line=${LINENO}"; fi' EXIT
          # A short window makes the sweep yield often, so the percentage and the
          # remaining-time estimate are exercised the way they would be on a
          # device whose idle window keeps closing and reopening.
          xargs -a /tmp/mods.list -d '\n' \
            ./emu/prewarm --idle-ms 250 --max-seconds 900 --diagnose-entries \
            --cache /tmp/hb.ptc > /tmp/prewarm.log 2>&1
          rc=$?
          tail -45 /tmp/prewarm.log
          if [ "$rc" -ne 0 ]; then
            flat=$(tr '\n' ' ' < /tmp/prewarm.log | tr -s ' ' | tail -c 900)
            echo "::error title=prewarm-failed rc=${rc}::${flat}"
          fi
          exit $rc

      - name: Report the measurement
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f /tmp/prewarm.log ]; then echo "no log"; exit 0; fi
          {
            echo "### pre-translation sweep over a real bundle"
            echo '```'
            grep -E '^  (ok|skip|queued) ' /tmp/prewarm.log | head -40
            echo '```'
            echo '```'
            sed -n '/pre-translation summary/,/^cache records/p' /tmp/prewarm.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mods=$(grep -cE '^  ok ' /tmp/prewarm.log || true)
          skipped=$(grep -cE '^  skip ' /tmp/prewarm.log || true)
          summary=$(sed -n '/pre-translation summary/,/^cache records/p' /tmp/prewarm.log \
                    | tr '\n' '|' | tr -s ' ' | head -c 2800)
          echo "::notice title=prewarm-measured::modules_ok=${mods} skipped=${skipped} :: ${summary}"
          # The ranked refusal list is the actual deliverable of this job. A
          # coverage percentage says how far short the translator is; this says
          # what to implement next, ordered by how many functions each unblocks.
          block=$(grep -E 'stopped at opcode|refused: ' /tmp/prewarm.log \
                  | head -14 | tr '\n' '|' | tr -d '%\r' | tr -s ' ' | cut -c1-1200)
          cov=$(grep -E '^functions |^  refused ' /tmp/prewarm.log | tr '\n' '|' | tr -s ' ')
          echo "::notice title=prewarm-blocking::${cov} || BLOCKERS: ${block}"
          # Per-module entry-point accounting: this is what separates the dominant
          # refusal bucket into causes, which is the only way to know whether the
          # problem is the translator or the entry points being fed to it.
          ent=$(grep -E '^    ENTRIES |^    [A-Za-z_(].*(NOT EXECUTABLE|IN NO SECTION|PAST RAW|first byte)' /tmp/prewarm.log \
                | head -14 | tr '\n' '|' | tr -d '%\r' | tr -s ' ' | cut -c1-1800)
          sec=$(grep -E '^      \.' /tmp/prewarm.log | head -12 \
                | tr '\n' '|' | tr -d '%\r' | tr -s ' ' | cut -c1-900)
          echo "::notice title=prewarm-entries::${ent} || SECTIONS: ${sec}"

      - name: Confirm nothing downloaded entered the repository
        run: |
          set -euo pipefail
          # The question is whether this job left anything behind, so the test is
          # a comparison against HEAD rather than an extension scan. This
          # repository tracked an unrelated .zip before this project existed, and
          # scanning for archives flagged that file instead of answering the
          # question - a check that fails for the wrong reason hides the right one.
          if [ -n "$(git status --porcelain)" ]; then
            echo "the sweep left something in the checkout:"
            git status --porcelain
            exit 1
          fi
          if git ls-files | grep -qiE '\.(exe|dll|msi)$'; then
            echo "a Windows executable or library is tracked in this repository"
            git ls-files | grep -iE '\.(exe|dll|msi)$' | head
            exit 1
          fi
          echo "archives tracked by the repository, none added by this job:"
          git ls-files | grep -iE '\.zip$' || echo "  none"
          echo "ok: the sweep left the checkout untouched and no Windows binary is tracked"

  api-surface:
    name: Vulkan vs Direct3D import surface on real applications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the classifier
        working-directory: emu
        run: make test_api api_report

      - name: Run the classifier suite
        working-directory: emu
        run: |
          set -uo pipefail
          ./test_api | tail -2
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error title=api-suite::test_api exited ${rc}"
            exit "$rc"
          fi

      - name: Download real applications with different graphics backends
        run: |
          set -uo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "::error title=download-step::exit=${rc} line=${LINENO}"; fi' EXIT
          # Godot 4.7.2, MIT: a Vulkan-first engine.
          # PPSSPP 1.20.4, GPL-2.0: carries BOTH a Direct3D 11 and a Vulkan
          # backend, and also publishes a native Windows ARM64 build of the same
          # application, which is the control case - that one needs no CPU
          # translation at all and the loader must say so rather than try.
          # All three are downloaded on an ephemeral runner, parsed only, never
          # committed and never redistributed.
          g_url="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip"
          g_size="86013866"
          p_url="https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-Windows-x64.zip"
          p_size="20390334"
          a_url="https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-Windows-ARM64.zip"
          a_size="20322129"
          fetch() {
            url="$1"; want="$2"; dest="$3"; label="$4"
            curl -fsSL -o "$dest" "$url"
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error title=download-failed::${label} curl exit ${rc}"
              exit 1
            fi
            got=$(stat -c %s "$dest")
            if [ "$got" != "$want" ]; then
              echo "::error title=size-mismatch::${label} downloaded ${got}, pinned ${want}"
              exit 1
            fi
            echo "${label}: ${got} bytes  sha256=$(sha256sum "$dest" | cut -c1-64)"
          }
          fetch "$g_url" "$g_size" /tmp/godot.zip godot-win64
          fetch "$p_url" "$p_size" /tmp/ppsspp-x64.zip ppsspp-x64
          fetch "$a_url" "$a_size" /tmp/ppsspp-arm64.zip ppsspp-arm64

      - name: Enumerate the PE modules in each
        run: |
          set -euo pipefail
          mkdir -p /tmp/g /tmp/p64 /tmp/pa64
          unzip -q -o /tmp/godot.zip -d /tmp/g
          unzip -q -o /tmp/ppsspp-x64.zip -d /tmp/p64
          unzip -q -o /tmp/ppsspp-arm64.zip -d /tmp/pa64
          for d in g p64 pa64; do
            find "/tmp/$d" -type f \( -iname '*.exe' -o -iname '*.dll' \) | sort > "/tmp/$d.list"
            echo "$d: $(wc -l < /tmp/$d.list) PE file(s)"
            head -6 "/tmp/$d.list"
          done
          test -s /tmp/g.list || { echo "::error title=no-modules::godot"; exit 1; }
          test -s /tmp/p64.list || { echo "::error title=no-modules::ppsspp x64"; exit 1; }
          test -s /tmp/pa64.list || { echo "::error title=no-modules::ppsspp arm64"; exit 1; }

      - name: Measure each import surface
        run: |
          # set +e, not merely the absence of -e: the runner invokes bash -e, so a
          # step that intends to handle non-zero statuses itself has to switch it
          # off. api_report returns 1 when some file in the bundle is unreadable,
          # which is normal for a 40-module application archive and is not a
          # failure of the measurement. xargs reports that as 123.
          set +e
          xargs -a /tmp/g.list    -d '\n' ./emu/api_report > /tmp/godot.api 2>&1
          echo "godot api_report exit=$? (123 = some module unreadable, expected)"
          xargs -a /tmp/p64.list  -d '\n' ./emu/api_report > /tmp/p64.api 2>&1
          echo "ppsspp x64 api_report exit=$?"
          xargs -a /tmp/pa64.list -d '\n' ./emu/api_report > /tmp/pa64.api 2>&1
          echo "ppsspp arm64 api_report exit=$? (all refused is the correct result)"
          for f in godot p64 pa64; do
            echo "===== $f ====="
            grep -E '^SUMMARY|^=== TOTAL' "/tmp/$f.api"
          done

      - name: Assert the measurement says what the architecture claims
        run: |
          set +e
          die() { echo "$1"; echo "::error title=api-surface::$1"; exit 1; }
          # A Vulkan-first engine must show Vulkan in its import surface.
          grep -q 'vulkan=' /tmp/godot.api || die "no vulkan share reported for Godot"
          v=$(grep '^SUMMARY' /tmp/godot.api | sed -n 's/.* vulkan=\([0-9.]*\)%.*/\1/p')
          d=$(grep '^SUMMARY' /tmp/godot.api | sed -n 's/.* d3d=\([0-9.]*\)%.*/\1/p')
          echo "Godot: vulkan=${v}% d3d=${d}%"
          # The native ARM64 build of the SAME application must be refused, with the
          # reason, and reported as needing no CPU translation. That is the control:
          # it is what "already the host architecture" looks like.
          grep -q 'REFUSED' /tmp/pa64.api || die "the ARM64 build was not refused"
          grep -q 'CPU translation needed: NO' /tmp/pa64.api \
            || die "the ARM64 build was not reported as needing no CPU translation"
          grep -Eq 'refused=[1-9]' /tmp/pa64.api || die "no refusals counted for ARM64"
          # Both x64 applications must have measurable code that needs translating,
          # whatever graphics API they use. This is the number that answers the
          # question: CPU translation does not depend on the graphics API.
          for f in godot p64; do
            grep -Eq 'code_bytes=[1-9]' "/tmp/$f.api" \
              || die "$f reported no x86-64 code needing translation"
          done

      - name: Publish the percentages
        if: always()
        run: |
          set +e
          for f in godot p64 pa64; do
            [ -f "/tmp/$f.api" ] || continue
            sum=$(grep '^SUMMARY' "/tmp/$f.api" | head -1 | tr -d '%\r' | cut -c1-900)
            ref=$(grep -c 'REFUSED' "/tmp/$f.api")
            {
              echo "### $f"
              echo '```'
              grep -E '^SUMMARY|^=== TOTAL' "/tmp/$f.api"
              grep -E '^  own machine code|^  imported functions|^    [A-Za-z]' "/tmp/$f.api" | head -30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=api-${f}::refused=${ref} ${sum}"
          done
          exit 0

      - name: Confirm nothing downloaded entered the repository
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "the measurement left something in the checkout:"
            git status --porcelain
            exit 1
          fi
          if git ls-files | grep -qiE '\.(exe|dll|msi)$'; then
            echo "a Windows binary is tracked"; exit 1
          fi
          echo "ok: checkout untouched, no Windows binary tracked"
