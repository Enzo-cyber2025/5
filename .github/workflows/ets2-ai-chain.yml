name: ETS2-AI cadeia 500B (sessoes 2xT4 encadeadas)

# Terceiro ciclo: valida dispatch por ID + diagnostico do checkpoint (resume).
# TREINO EM ESCALA: sessoes Kaggle de ~11,5 h nas 2x T4 que RETOMAM do
# checkpoint (dataset privado enzoaimv/ets2ai-checkpoint) e acumulam
# amostras ate passar de 500 BILHOES (~1,25 bilhao de km simulados). Cada janela:
#   1. COLHE a sessao anterior (se completa) — valida gates, versiona o
#      checkpoint e promove os pesos ao repo se melhoraram;
#   2. EMPURRA a proxima sessao (se a meta ainda nao foi atingida).
# Roda seg/qui/sab (cron) e a cada push neste arquivo. 3 sessoes/week ~ 29,5 h
# de GPU = dentro da cota gratuita do Kaggle (30 h/week).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1,4"
    - cron: "0 8 * * 6"
    # colheita extra da 1a sessao da cadeia 500B (sab 04/10/2026):
    # 06:30 UTC = ~1h apos o fim da sessao de 11,5 h; 08:30 = reserva
    - cron: "30 6 4 10 *"
    - cron: "30 8 4 10 *"
  push:
    branches: [arena/01a0f37d-5]
    paths: ['.github/workflows/ets2-ai-chain.yml']

permissions:
  contents: write
  actions: write

jobs:
  step:
    name: Colhe sessao anterior + empurra a proxima
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      empurrou: ${{ steps.empurra.outputs.empurrou }}
      sec: ${{ steps.empurra.outputs.sec }}
      meta: ${{ steps.empurra.outputs.meta }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: arena/01a0f37d-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: pip install --retries 5 --timeout 90 numpy==2.2.6 kaggle
      - name: Colhe a sessao anterior (se completa)
        id: harvest
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cd ets2-ai
          python kaggle/push.py --harvest 2>&1 | tee ../.cache_harvest.log
          RC=${PIPESTATUS[0]}
          echo "exit=$RC" >> "$GITHUB_OUTPUT"
          set -e
          # publica o checkpoint na release: as proximas sessoes baixam dele
          # (o dataset do Kaggle NAO esta montando — provado por sonda).
          # So com gates VERDES — retomar de pesos ruins propagaria o erro.
          if [ "$RC" = "0" ] && [ -f .cache/kaggle-out/model-weights.json ]; then
            cp .cache/kaggle-out/model-weights.json /tmp/checkpoint-chain.json
            gh release upload ets2-ai-v0.4.6 /tmp/checkpoint-chain.json --clobber \
              && echo "[harvest] checkpoint-chain.json na release (resume garantido)" \
              || echo "::warning::falha ao publicar checkpoint na release"
          fi
      - name: Promove pesos melhores + atualiza o contador da cadeia
        env:
          HARVEST_EXIT: ${{ steps.harvest.outputs.exit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ets2-ai
          python3 - <<'PY'
          import os
          from pathlib import Path
          cum_raw = Path(".cache/cumulative.txt").read_text().strip()
          if not cum_raw.isdigit():
              print(f"sem colheita numerica ({cum_raw}) — contador nao muda")
              raise SystemExit(0)
          cum = int(cum_raw)
          if (os.environ.get("HARVEST_EXIT") == "0"
                  and Path(".cache/kaggle-out/model-weights.json").exists()):
              import json, shutil
              new = json.load(open(".cache/kaggle-out/metrics.json"))
              try:
                  cur = json.load(open("artifacts/metrics.json"))
              except Exception:
                  cur = {"mse_val": 9.9}
              if new["mse_val"] < cur.get("mse_val", 9.9):
                  shutil.copyfile(".cache/kaggle-out/model-weights.json",
                                  "artifacts/model-weights.json")
                  # enriquece o metrics da cadeia com as chaves que o repo
                  # espera (meta/target_met/weights_source) ANTES de copiar
                  _wm = json.load(open(".cache/kaggle-out/model-weights.json"))["meta"]
                  new["meta"] = _wm
                  new["target_met"] = bool(
                      new["mse_val"] <= new.get("loss_target", 0.15))
                  new["weights_source"] = "cadeia-kaggle"
                  json.dump(new, open("artifacts/metrics.json", "w"),
                            indent=2)
                  Path("/tmp/promoted").write_text("1")
                  print(f"[chain] pesos PROMOVIDOS: val {new['mse_val']:.5f}")
              else:
                  print("[chain] pesos atuais continuam melhores")
          pct = cum / 500_000_000_000 * 100
          md = ("# Cadeia de treino 500B — contador ao vivo\n\n"
                "| metrica | valor |\n|---|---|\n"
                f"| amostras acumuladas | **{cum:,}** |\n"
                f"| % da meta (500 bilhoes de amostras = ~1,25 bilhao de km) | **{pct:.2f}%** |\n"
                f"| km simulados equivalentes | ~{cum * 2.5 / 1000:,.0f} km |\n"
                + (f"| certificado 1 BILHAO de km (400 bi de amostras) | "
                   f"**SIM** |\n" if cum >= 400_000_000_000 else
                   f"| certificado 1 BILHAO de km (400 bi de amostras) | "
                   f"ainda nao — faltam {400_000_000_000 - cum:,} amostras "
                   f"(~{(400_000_000_000 - cum) * 2.5 / 1000:,.0f} km) |\n")
                + "| garantia anti-repeticao | semente da sessao = SEED + acumulado — nenhuma sessao repete dados (impressao digital no metrics.json) |\n"
                "| sessao media | 2x T4, ~11,5 h, FP32 em fluxo |\n\n"
                "Cada janela (seg/qui/sab) colhe a sessao anterior, versiona o "
                "checkpoint privado (Kaggle) e empurra a proxima. Automatico.\n")
          Path("CHAIN.md").write_text(md, encoding="utf-8")
          print(f"[chain] CHAIN.md atualizado: {cum:,} ({pct:.1f}%)")
          if cum >= 500_000_000_000 and not Path("CERTIFICADO.md").exists():
              import datetime as _dt
              _loss = ""
              try:
                  _loss = f"loss val final: {json.load(open('artifacts/metrics.json'))['mse_val']:.6f}"
              except Exception:
                  pass
              Path("CERTIFICADO.md").write_text(
                  "# CERTIFICADO — treino com 1,25 BILHAO de km simulados\n\n"
                  f"concluido em {_dt.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')}\n\n"
                  f"| item | valor |\n|---|---|\n"
                  f"| amostras acumuladas | **{cum:,}** |\n"
                  f"| km simulados equivalentes | **~{cum * 2.5 / 1000:,.0f} km (1,25 bilhao)** |\n"
                  f"| {_loss or 'gates'} | verificados em todas as sessoes |\n"
                  "| garantia anti-repeticao | semente = SEED+1+acumulado por sessao; "
                  "impressao digital sha256 por sessao no metrics.json |\n"
                  "| cadeia | sessoes 2x T4 Kaggle (seg/qui/sab), retomando do checkpoint |\n\n"
                  "Emitido automaticamente pelo workflow da cadeia ao cruzar 500 bilhoes "
                  "de amostras. Reproduzivel: mesmas sementes regeneram os mesmos dados.",
                  encoding="utf-8")
              print("[chain] *** CERTIFICADO 1,25 BILHAO DE KM EMITIDO ***")
          PY
          CUM=$(cat .cache/cumulative.txt)
          PROMOVED=0
          if [ -f /tmp/promoted ]; then PROMOVED=1; fi
          git config user.name "ets2ai-chain"; git config user.email "chain@users.noreply.github.com"
          git add CHAIN.md artifacts
          git add CERTIFICADO.md 2>/dev/null || true   # so existe aos 500B
          if git diff --cached --quiet; then
            echo "nada mudou"
          elif [ "$PROMOVED" = "1" ]; then
            git commit -m "cadeia 500B: $CUM amostras acumuladas — pesos melhores promovidos (dispara builds)"
            git pull --rebase --autostash origin arena/01a0f37d-5 || true
            git push
          else
            git commit -m "cadeia 500B: $CUM amostras acumuladas [skip ci]"
            git pull --rebase --autostash origin arena/01a0f37d-5 || true
            git push
          fi
          if [ "$PROMOTED" = "1" ]; then
            echo "pesos promovidos — disparando o build da release (commits do GITHUB_TOKEN nao disparam workflows)"
            gh api repos/Enzo-cyber2025/5/actions/workflows/371510957/dispatches \
            -f ref=arena/01a0f37d-5 \
              || echo "::warning::build nao disparado — rode manualmente"
          fi
      - name: Empurra a proxima sessao (meta de 500 bilhoes)
        id: empurra
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          CUM=$(cat ets2-ai/.cache/cumulative.txt 2>/dev/null || echo 0)
          if ! [[ "$CUM" =~ ^[0-9]+$ ]]; then
            if [ "$CUM" = "NONE" ]; then
              echo "sessao anterior sem saida (erro?) — empurrando nova de qualquer jeito (retoma do ultimo checkpoint bom)"
              CUM=0
            else
              echo "sessao anterior ainda rodando — nao empurro outra"
              echo "empurrou=retry" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [ "$CUM" -ge 500000000000 ]; then
            echo "META ATINGIDA: $CUM amostras acumuladas"
            echo "empurrou=0" >> "$GITHUB_OUTPUT"
            echo "meta=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd ets2-ai
          SEC=41400
          if [ "$(date -u +%u)" = "6" ]; then SEC=23400; fi   # sab: 6,5 h (cota 30 h/sem)
          echo "sec=$SEC" >> "$GITHUB_OUTPUT"
          ETS2AI_SAMPLES=15000000000 ETS2AI_MAX_SECONDS=$SEC \
            python kaggle/push.py --chain 2>&1 | tee ../.cache_chain.log
          rc=${PIPESTATUS[0]}
          WAITH=$(grep -o 'CHAIN_WAIT_H=[0-9.]*' ../.cache_chain.log 2>/dev/null | tail -1 | cut -d= -f2)
          if [ -n "$WAITH" ]; then
            echo "empurrou=wait" >> "$GITHUB_OUTPUT"
            echo "wait_h=$WAITH" >> "$GITHUB_OUTPUT"
            echo "governador de cota: sem orcamento esta semana — retry em ${WAITH}h"
          elif [ "$rc" = "0" ]; then
            echo "empurrou=1" >> "$GITHUB_OUTPUT"
          fi
          exit $rc
      - name: Status ao vivo da sessao Kaggle (committa STATUS.md)
        if: always()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          cd ets2-ai
          ST=$(kaggle kernels status enzoaimv/ets2ai-train 2>&1 | tr '\n' ' ' | sed 's/  */ /g' | sed 's/^ //;s/ $//')
          echo "[status] $ST"
          CUM=$(tr -d '\n' < .cache/cumulative.txt 2>/dev/null || true)
          [ -z "$CUM" ] && CUM="sem colheita"
          WHEN=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > STATUS.md <<MD
          # Sessao Kaggle ao vivo — cadeia 500B

          | campo | valor |
          |---|---|
          | kernel | enzoaimv/ets2ai-train |
          | status | $ST |
          | amostras acumuladas (ultima colheita) | $CUM |
          | meta | 500.000.000.000 amostras (~1,25 bilhao de km simulados) |
          | janelas | seg, qui e sab, 08:00 UTC — colhe, promove e empurra sozinho |
          | atualizado | $WHEN |

          Fonte: API do Kaggle consultada pelo workflow da cadeia em cada janela.
          MD
          git config user.name "ets2ai-chain"; git config user.email "chain@users.noreply.github.com"
          git add STATUS.md
          git add .chain-sessions.json 2>/dev/null || true   # ledger do governador de cota
          if git diff --cached --quiet; then
            echo "status sem mudanca"
          else
            git commit -m "status kaggle ao vivo [skip ci]"
            git pull --rebase --autostash origin arena/01a0f37d-5 || true
            git push
          fi
      - name: Diagnostico (logs em caso de falha)
        if: failure()
        run: |
          git config user.name "ci-diag"; git config user.email "ci-diag@users.noreply.github.com"
          mkdir -p ci-logs/chain-${{ github.run_id }}
          { echo "=== chain run ${{ github.run_id }} ==="
            echo "--- harvest"; cat .cache_harvest.log 2>/dev/null
            echo "--- chain"; cat .cache_chain.log 2>/dev/null; } \
            > ci-logs/chain-${{ github.run_id }}/log.txt
          git add ci-logs || true
          git commit -m "diag: chain run ${{ github.run_id }} [skip ci]" || true
          git pull --rebase --autostash origin arena/01a0f37d-5 || true
          git push || true
          exit 1
  aguarda-a:
    name: Aguarda a sessao Kaggle terminar (1/3)
    needs: step
    if: needs.step.result == 'success' && (needs.step.outputs.empurrou == '1' || needs.step.outputs.empurrou == 'retry' || needs.step.outputs.empurrou == 'wait')
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Espera
        run: |
          if [ "${{ needs.step.outputs.empurrou }}" = "retry" ]; then sleep 21000
          elif [ "${{ needs.step.outputs.empurrou }}" = "wait" ]; then sleep 20900
          else sleep 350; fi
  aguarda-b:
    name: Aguarda a sessao Kaggle terminar (2/3)
    needs: [step, aguarda-a]
    if: needs.step.result == 'success' && (needs.step.outputs.empurrou == 'wait' || (needs.step.outputs.empurrou == '1' && needs.step.outputs.sec == '41400'))
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Espera
        run: sleep 350
  aguarda-c:
    name: Aguarda a sessao Kaggle terminar (3/3)
    needs: [step, aguarda-b]
    if: always() && needs.step.result == 'success' && (needs.step.outputs.empurrou == '1' || needs.step.outputs.empurrou == 'retry' || needs.step.outputs.empurrou == 'wait')
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Margem final
        run: |
          if [ "${{ needs.step.outputs.empurrou }}" = "retry" ]; then S=10
          elif [ "${{ needs.step.outputs.sec }}" = "41400" ]; then S=15
          else S=65; fi
          sleep $S
  proximo-ciclo:
    name: Dispara o proximo ciclo (colheita automatica)
    needs: [step, aguarda-c]
    if: always() && needs.step.result == 'success' && (needs.step.outputs.empurrou == '1' || needs.step.outputs.empurrou == 'retry' || needs.step.outputs.empurrou == 'wait') && needs.step.outputs.meta != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Self-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Enzo-cyber2025/5/actions/workflows/374074831/dispatches \
            -f ref=arena/01a0f37d-5
          echo "[cadeia] proximo ciclo agendado — a cadeia se perpetua sozinha (dispatch por ID: nome de arquivo so resolve na branch default)"
