name: emu-test-arm64

on:
  push:
    branches: [arena/01a077ef-5]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a077ef-5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Emulador x86_64 (KVM) + testes do APK real
        run: bash .github/emu-test-x86.sh

      - name: Publicar evidencias (branch evidence-x86)
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f evidence 2>/dev/null || true
          git commit -m "evidence x86 $(date -u +%Y%m%d%H%M%S)" 2>/dev/null || true
          git push origin HEAD:evidence-x86 --force 2>/dev/null || true
