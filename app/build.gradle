plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xclipse64.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xclipse64.launcher'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            // The public build is installable immediately. Production distributors
            // can replace this with their own signing key in CI.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
