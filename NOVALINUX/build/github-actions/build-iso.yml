name: Build & release NovaLinux ISO

# Constrói um ISO mínimo REAL e bootável do NovaLinux e o publica como um
# GitHub Release contendo APENAS o arquivo .iso e .sha256.
#
# Motivação: o sandbox desta sessão possui rede restrita (apenas GitHub/PyPI),
# o que impede o bootstrap GNU (bison/flex/autotools) e o download de fontes
# necessários para compilar o kernel localmente. Este workflow roda em um runner
# do GitHub Actions com rede completa, onde o build funciona de verdade.
#
# Disparo:
#   - manual (workflow_dispatch): clique em "Run workflow";
#   - a cada push na branch "release".

on:
  workflow_dispatch: {}
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências de build
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools cpio \
            zstd busybox-static dracut qemu-system-x86 qemu-utils \
            debootstrap openrc syslinux-utils isolinux wget curl xz-utils \
            autoconf automake libtool pkg-config \
            libx11-dev libxext-dev libxrender-dev libcairo2-dev \
            libpangocairo-1.0-0 libfreetype6-dev libfontconfig1-dev

      - name: Verificar ferramentas
        run: |
          for t in gcc make bison flex bc xorriso grub-mkrescue dracut qemu-system-x86_64; do
            command -v "$t" >/dev/null && echo "  OK $t" || echo "  FALTA $t"
          done

      - name: Build do ISO (kernel + busybox + initramfs + GRUB)
        env:
          NO_KERNEL: ""
        run: |
          bash NOVALINUX/build/ci_build.sh

      - name: Calcular SHA256 e verificar artefatos
        run: |
          ls -lh NOVALINUX/dist/*.iso NOVALINUX/dist/*.iso.sha256
          sha256sum -c NOVALINUX/dist/*.iso.sha256

      - name: Instalar QEMU e rodar verificação de boot (best-effort)
        continue-on-error: true
        run: |
          # tenta bootar o ISO no QEMU (CPU x86_64) e captura o log de boot
          mkdir -p /tmp/bootlog
          ( timeout 90 qemu-system-x86_64 -m 1024 -smp 2 \
              -drive file=NOVALINUX/dist/*.iso,media=cdrom \
              -nographic -no-reboot -serial stdio -monitor none \
              -display none 2>&1 | tee /tmp/bootlog/console.log || true )
          echo "NOVALINUX_BOOT_LOG:"
          grep -a -m5 "NOVALINUX_BOOT_OK\|NovaLinux\|Linux version" /tmp/bootlog/console.log || echo "(sem marcador de boot no log)"

      - name: Publicar Release (somente .iso e .sha256)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          ISO=$(ls NOVALINUX/dist/*.iso | head -1)
          SHA="${ISO}.sha256"
          if [ -z "$ISO" ]; then echo "sem ISO"; exit 1; fi
          echo "Publicando:"
          echo "  $ISO"
          echo "  $SHA"
          # tag de release (usa data para não conflitar)
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$ISO" "$SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NovaLinux ISO ($(date -u +%Y-%m-%d))" \
            --notes "ISO mínima bootável do NovaLinux (Intel Goldmont Plus). Apenas .iso e .sha256." \
            || echo "(gh release create falhou; veja se o token GITHUB_TOKEN tem permissão de release)"
          echo "RELEASE_TAG=$TAG"
          echo "UPLOADED_REPO=$GITHUB_REPOSITORY"
