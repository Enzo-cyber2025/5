# Otimizações de runtime para Intel Pentium N5030 (Goldmont Plus)
# Aplicadas pelo sysctl do OpenRC na inicialização.

# Núcleo de responsividade
vm.swappiness=10
vm.vfs_cache_pressure=50
kernel.sched_autogroup_enabled=1
kernel.sched_latency_ns=4000000
kernel.sched_min_granularity_ns=250000
kernel.sched_wakeup_granularity_ns=500000
vm.dirty_ratio=10
vm.dirty_background_ratio=3
# Evitar thrash em eMMC/SD
vm.page-cluster=0
