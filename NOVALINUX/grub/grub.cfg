# =============================================================================
# grub.cfg — GRUB 2.12 do NovaLinux (híbrido UEFI + BIOS)
# =============================================================================
set default="0"
set timeout="3"
set gfxmode="auto"
set gfxpayload="keep"
set pager="1"

# Vídeo de alta resolução (GOP) para tema gráfico
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod video_bochs
insmod video_cirrus
insmod vbe
insmod font
insmod part_gpt
insmod part_msdos
insmod linux
insmod normal
insmod chain
insmod search_search_fs_uuid
insmod search_label

# Criar terminal gráfico e definir fonte unicode
loadfont unicode
terminal_output gfxterm

# Tema com fundo azul/roxo customizado
set theme="${prefix}/themes/novatheme/theme.txt"

function vmlinuz_path {
    set root=(cd0)
}

menuentry 'NovaLinux (Goldmont Plus, N5030)' --class nova --id nova-default {
    version="6.6"
    set root=(cd0)
    linux /boot/vmlinuz-6.6 \
        root=UUID=@@@@root@@@@ \
        quiet loglevel=3 mitigations=off intel_idle.max_cstate=4
    initrd /boot/initramfs-6.6.img
}

menuentry 'NovaLinux — modo de recuperação (single)' --class nova --id nova-recovery {
    set root=(cd0)
    linux /boot/vmlinuz-6.6 \
        root=UUID=@@@@root@@@@ \
        single loglevel=3
    initrd /boot/initramfs-6.6.img
}

menuentry 'NovaLinux — (verbose, sem mitigações desligadas)' --class nova --id nova-verbose {
    set root=(cd0)
    linux /boot/vmlinuz-6.6 \
        root=UUID=@@@@root@@@@ \
        loglevel=4
    initrd /boot/initramfs-6.6.img
}

menuentry 'Iniciar a partir do disco rígido (hd0)' --class hdd {
    set root=(hd0)
    chainloader +1
}

menuentry 'Reiniciar' --class reboot {
    reboot
}

menuentry 'Desligar' --class shutdown {
    halt
}
