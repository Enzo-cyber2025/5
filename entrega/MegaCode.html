<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MegaCode</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--fg:#e6edf3;--mut:#8b949e;--acc:#2f81f7;--ok:#238636;--brd:#30363d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;font-weight:600}
.tabs{display:flex;border-bottom:1px solid var(--brd)}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:var(--fg);border-color:var(--acc)}
main{padding:16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
select,input[type=file],button{width:100%;padding:11px;border-radius:8px;border:1px solid var(--brd);background:#0d1117;color:var(--fg);font-size:15px}
button{background:var(--acc);border:none;cursor:pointer;font-weight:600;margin-top:10px}
button.sec{background:#21262d}
button:disabled{opacity:.5;cursor:default}
canvas{width:100%;image-rendering:pixelated;background:#fff;border-radius:8px;display:block}
video{width:100%;border-radius:8px;background:#000;display:block}
.bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.stat{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.5;word-break:break-word}
.hide{display:none}.big{font-size:15px;color:var(--fg)}
.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body>
<header><div style="width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#2f81f7,#a371f7)"></div><h1>MegaCode</h1></header>
<div class="tabs">
  <div class="tab on" id="t-tx">Transmitir</div>
  <div class="tab" id="t-rx">Receber</div>
</div>
<main>
  <section id="tx">
    <div class="card">
      <label>Arquivo (qualquer tipo)</label>
      <input type="file" id="file" multiple>
      <label>…ou pasta inteira</label>
      <input type="file" id="folder" webkitdirectory directory multiple>
      <div id="drop" style="border:2px dashed #98a6b8;padding:16px;text-align:center;border-radius:10px;color:#98a6b8;margin-top:12px;cursor:pointer">…ou <b>arraste e solte</b> vários arquivos aqui</div>
      <label>Qualidade</label>
      <select id="preset"></select>
      <label>Resolução da imagem</label>
      <select id="res">
        <option value="568x320">320p (568×320) — tela pequena / baixa resolução</option>
        <option value="1920x1080">1080p (1920×1080) — capturar com a câmera</option>
        <option value="3840x2160">4K (3840×2160) — escanear o PNG direto</option>
        <option value="7680x4320">8K (7680×4320) — escanear o PNG direto</option>
        <option value="15360x8640">16K (15360×8640) — escanear o PNG direto</option>
        <option value="16384x16384">16384×16384 — máximo (limite PNG/navegador)</option>
      </select>
      <label>Densidade (px por módulo)</label>
      <select id="dens">
        <option value="4">Normal (4 px) — legível por câmera</option>
        <option value="3">Alta (3 px)</option>
        <option value="2">Máxima (2 px) — mais dados</option>
        <option value="1">Extrema (1 px) — só para PNG escaneado</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer">
        <input type="checkbox" id="single" style="width:auto"> Modo imagem única (gerar 1 só PNG)
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer">
        <input type="checkbox" id="grid" style="width:auto"> Grade de vários blocos (mais dados/imagem) — desmarcado = 1 código grande
      </label>
      <div class="stat" id="txinfo">Escolha um arquivo ou pasta para começar.</div>
      <button id="genpng">Gerar PNG (P&amp;B, vários blocos) e exportar</button>
      <button id="dlpng" class="sec hide">Baixar PNG novamente</button>
      <button id="start" class="sec">Transmitir (animado)</button>
      <button id="stop" class="sec hide">Parar</button>
    </div>
    <div class="card hide" id="txview">
      <canvas id="cv"></canvas>
      <div class="stat" id="txstat"></div>
    </div>
  </section>
  <section id="rx" class="hide">
    <div class="card">
      <div class="row">
        <button id="cam">Ligar câmera</button>
        <button id="imp" class="sec">Ler PNG / imagem</button>
      </div>
      <input type="file" id="impfile" accept="image/*" multiple class="hide">
      <video id="vid" playsinline muted class="hide"></video>
      <canvas id="rcv" class="hide"></canvas>
      <div class="bar"><i id="rxbar"></i></div>
      <div class="stat" id="rxstat">Aponte a câmera para a tela, ou importe uma imagem com o código.</div>
      <button id="save" class="sec hide">Salvar arquivo(s)</button>
    </div>
  </section>
</main>
<script>
/* MegaCode codec (JS) - render + decode. Auto-consistente. */
(function (root) {
'use strict';
const SIZES=[64,80,96,112,128,160,192,224];
const NSYM=[8,16,24,32,40];
const BORDER=3;
const SYNC=[0,1,0,1,0,1,1,0];
const HDR=24, MAGIC0=0x4D, MAGIC1=0x43, VERSION=1, META=0xFFFFFFFF;
// paletas: index0=preto (borda), index1=branco
const PAL=[
  [[0,0,0],[255,255,255]],
  [[0,0,0],[255,255,255],[255,32,32],[40,80,255]],
  [[0,0,0],[255,255,255],[255,32,32],[40,80,255],[32,200,64],[255,220,0],[0,220,220],[255,0,200]]
];
const bps=cm=>cm+1; // cm0->1bit(2 cores), cm1->2bits(4), cm2->3bits(8)
const interior=n=>n-2*BORDER;
function nblocksFor(n,cm){const W=interior(n),b=bps(cm);return Math.max(1,Math.floor(W*(W-2)*b/8/255));}
function dataMax(n,cm,nsym){const nb=nblocksFor(n,cm);return Math.min(65535,Math.max(0,nb*(255-nsym)-HDR-4-256));}
const FMTS=b=>Math.ceil(16/b);

/* ---- GF(256), poli 0x11d ---- */
const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
(function(){let x=1;for(let i=0;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}for(let i=255;i<512;i++)EXP[i]=EXP[i-255];})();
const gmul=(a,b)=>(a===0||b===0)?0:EXP[LOG[a]+LOG[b]];
const ginv=a=>EXP[(255-LOG[a])%255];
// gerador: g(x)=prod_{i=0..nsym-1}(x-alpha^i), highest-first, g[0]=1
function rsGen(nsym){let g=[1];
  for(let i=0;i<nsym;i++){const d=g.length-1,ng=new Array(g.length+1).fill(0);
    ng[0]=g[0];
    for(let j=1;j<=d;j++)ng[j]=g[j]^gmul(g[j-1],EXP[i]);
    ng[d+1]=gmul(g[d],EXP[i]);
    g=ng;}
  return g;}
// paridade sistematica: parity = (msg*x^nsym) mod g
function rsEncodeParity(msg,gen,nsym){const k=msg.length,res=new Uint8Array(k+nsym);
  res.set(msg,0);
  for(let i=0;i<k;i++){const coef=res[i];
    if(coef!==0)for(let j=1;j<gen.length;j++)res[i+j]^=gmul(gen[j],coef);}
  return res.slice(k);}
function rsSyndromes(cw,nsym){const S=new Uint8Array(nsym);
  for(let i=0;i<nsym;i++){let v=0;for(let j=0;j<cw.length;j++)v=gmul(v,EXP[i])^cw[j];S[i]=v;}
  return S;}
// corrige codeword (msg+paridade, highest-first). retorna {ok, data, corr}
function rsCorrect(cw,nsym,k){const n=cw.length;
  let S=rsSyndromes(cw,nsym);let nz=false;for(let i=0;i<nsym;i++)if(S[i])nz=true;
  if(!nz)return {ok:true,data:cw.slice(0,k),corr:0};
  // Berlekamp-Massey (C lowest-first, C[0]=1)
  const C=new Array(nsym+1).fill(0),B=new Array(nsym+1).fill(0);
  C[0]=1;B[0]=1;let L=0,m=1,b=1;
  for(let nn=0;nn<nsym;nn++){
    let d=S[nn];for(let i=1;i<=L;i++)d^=gmul(C[i],S[nn-i]);
    if(d===0){m++;continue;}
    const coef=gmul(d,ginv(b));
    const T=C.slice();                       // guarda C antigo
    for(let i=m;i<=nsym;i++)C[i]^=gmul(coef,B[i-m]);
    if(2*L<=nn){for(let i=0;i<=nsym;i++)B[i]=T[i];L=nn+1-L;b=d;m=1;}
    else m++;
  }
  if(L===0)return {ok:false};
  // Chien: raizes de Lambda; posicao j (cw index) com X=alpha^(n-1-j)
  const errPos=[];
  for(let j=0;j<n;j++){const t=(255-((n-1-j)%255))%255;
    let v=0;for(let i=0;i<=L;i++)v^=gmul(C[i],EXP[(i*t)%255]);
    if(v===0)errPos.push(j);}
  if(errPos.length!==L)return {ok:false};
  // Omega = S*Lambda mod x^nsym (lowest-first)
  const Om=new Array(nsym).fill(0);
  for(let i=0;i<nsym;i++){let v=0;for(let j=0;j<=Math.min(i,L);j++)v^=gmul(C[j],S[i-j]);Om[i]=v;}
  const out=Uint8Array.from(cw);
  for(const j of errPos){
    const Xe=(n-1-j)%255,t=(255-Xe)%255;
    let num=0;for(let i=0;i<nsym;i++)num^=gmul(Om[i],EXP[(i*t)%255]);
    let der=0;for(let i=1;i<=L;i+=2)der^=gmul(C[i],EXP[((i-1)*t)%255]);
    if(der===0)continue;
    let e=gmul(num,ginv(der));e=gmul(e,EXP[Xe]);
    out[j]^=e;
  }
  S=rsSyndromes(out,nsym);for(let i=0;i<nsym;i++)if(S[i])return {ok:false};
  let corr=0;for(let i=0;i<n;i++)if(out[i]!==cw[i])corr++;
  return {ok:true,data:out.slice(0,k),corr};
}

/* ---- CRC ---- */
function crc16(buf){let crc=0xFFFF;for(let i=0;i<buf.length;i++){crc^=buf[i]<<8;
  for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;}return crc&0xFFFF;}
const CRC32T=(function(){const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;
  for(let j=0;j<8;j++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC32T[(c^buf[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}

/* ---- formato ---- */
function fmtWord(n,cm,nsym,nb){const ni=SIZES.indexOf(n),si=NSYM.indexOf(nsym);
  return ((ni&15)|((cm&3)<<4)|((si&7)<<6)|(((nb-1)&127)<<9))&0xFFFF;}
function fmtUnpack(w){return {n:SIZES[w&15],cm:(w>>4)&3,nsym:NSYM[(w>>6)&7],nb:((w>>9)&127)+1};}
function fmtRowSymbol(col,b,fw){const maxs=(1<<b)-1;
  if(col<8)return SYNC[col]?maxs:0;
  const idx=col-8,fs=FMTS(b),rep=Math.floor(idx/fs);
  if(rep>=3)return (col&1)?maxs:0;
  const bit=(idx%fs)*b;let v=0;
  for(let i=0;i<b;i++){const bb=(bit+i<16)?((fw>>(15-(bit+i)))&1):0;v=(v<<1)|bb;}
  return v;}
const calRowSymbol=(col,b)=>b===1?(col&1):(col%(1<<b));

function fileId(name,size){let h=1469598103934665607n;const F=1099511628211n;
  for(let i=0;i<name.length;i++){h^=BigInt(name.charCodeAt(i));h=(h*F)%(1n<<64n);}
  const sz=BigInt(size);for(let i=0;i<8;i++){h^=(sz>>BigInt(i*8))&255n;h=(h*F)%(1n<<64n);}
  const out=new Uint8Array(8);for(let i=0;i<8;i++)out[i]=Number((h>>BigInt(i*8))&255n);return out;}

/* ---- render ---- */
function render(p,fid,frameIndex,totalFrames,data,px,quiet,name){
  const n=p.n,cm=p.cm,nsym=p.nsym,W=interior(n),b=bps(cm),K=1<<b;
  const nb=nblocksFor(n,cm),k=255-nsym;
  const nmb=name?new TextEncoder().encode(name):new Uint8Array(0);
  const nameLen=Math.min(nmb.length,255),extra=1+nameLen;
  if(data.length>nb*k-HDR-extra-4)return null;
  const msg=new Uint8Array(nb*k);
  msg[0]=MAGIC0;msg[1]=MAGIC1;msg[2]=VERSION;msg[3]=cm;
  msg.set(fid,4);
  msg[12]=frameIndex>>>24;msg[13]=frameIndex>>>16;msg[14]=frameIndex>>>8;msg[15]=frameIndex&255;
  msg[16]=totalFrames>>>24;msg[17]=totalFrames>>>16;msg[18]=totalFrames>>>8;msg[19]=totalFrames&255;
  msg[20]=data.length>>>8;msg[21]=data.length&255;
  const hc=crc16(msg.subarray(0,22));msg[22]=hc>>>8;msg[23]=hc&255;
  msg[HDR]=nameLen; if(nameLen)msg.set(nmb.subarray(0,nameLen),HDR+1);
  msg.set(data,HDR+extra);
  const cpos=HDR+extra+data.length,crc=crc32(msg.subarray(0,cpos));
  msg[cpos]=crc>>>24;msg[cpos+1]=crc>>>16;msg[cpos+2]=crc>>>8;msg[cpos+3]=crc&255;
  const gen=rsGen(nsym);
  const cw=new Uint8Array(nb*255);
  for(let bl=0;bl<nb;bl++){
    const par=rsEncodeParity(msg.subarray(bl*k,bl*k+k),gen,nsym);
    for(let i=0;i<k;i++)cw[i*nb+bl]=msg[bl*k+i];
    for(let i=0;i<nsym;i++)cw[k*nb+i*nb+bl]=par[i];
  }
  const cwLen=nb*255,totalBits=(W-2)*W*b,bits=new Uint8Array(totalBits);
  for(let i=0;i<cwLen&&i*8<totalBits;i++)for(let bb=0;bb<8;bb++){const t=i*8+bb;if(t<totalBits)bits[t]=(cw[i]>>(7-bb))&1;}
  const sym=new Uint8Array(W*W),fw=fmtWord(n,cm,nsym,nb);
  for(let c=0;c<W;c++){sym[c]=fmtRowSymbol(c,b,fw);sym[W+c]=calRowSymbol(c,b);}
  let bi=0;for(let r=2;r<W;r++)for(let c=0;c<W;c++){let v=0;
    for(let bb=0;bb<b;bb++)v=(v<<1)|(bi<totalBits?bits[bi++]:0);sym[r*W+c]=v;}
  const side=(n+2*quiet)*px,img=new Uint8ClampedArray(side*side*3).fill(255);
  for(let gr=0;gr<n;gr++)for(let gc=0;gc<n;gc++){
    let col;
    if(gr<BORDER||gr>=n-BORDER||gc<BORDER||gc>=n-BORDER)col=PAL[0][0];
    else col=PAL[cm][sym[(gr-BORDER)*W+(gc-BORDER)]&(K-1)];
    const ox=(gc+quiet)*px,oy=(gr+quiet)*px;
    for(let y=0;y<px;y++){const o=((oy+y)*side+ox)*3;
      for(let x=0;x<px;x++){img[o+x*3]=col[0];img[o+x*3+1]=col[1];img[o+x*3+2]=col[2];}}}
  return {img,side};
}

/* ---- decode ---- */
const lumOf=(r,g,b)=>(r*77+g*151+b*28)>>8;
function otsu(g,w,h){const hist=new Float64Array(256);let total=0;
  for(let i=0;i<w*h;i++){hist[g[i]]++;total++;}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,maxv=-1;const bet=new Float64Array(256).fill(-1);
  for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=total-wB;if(!wF)break;
    sumB+=i*hist[i];const mB=sumB/wB,mF=(sum-sumB)/wF;bet[i]=wB*wF*(mB-mF)*(mB-mF);if(bet[i]>maxv)maxv=bet[i];}
  if(maxv<=0)return 128;let lo=-1,hi=-1;
  for(let i=0;i<256;i++)if(bet[i]>=maxv*0.999){if(lo<0)lo=i;hi=i;}
  return lo<0?128:((lo+hi)>>1);}
function classify(rgb,pal){let best=0,bd=1e9;
  for(let i=0;i<pal.length;i++){const dr=rgb[0]-pal[i][0],dg=rgb[1]-pal[i][1],db=rgb[2]-pal[i][2];
    const d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=i;}}
  return best;}
function rotGrid(g,n,o){if(o===0)return g;const out=new Uint8Array(n*n);
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){let nr,nc;
    if(o===1){nr=c;nc=n-1-r;}else if(o===2){nr=n-1-r;nc=n-1-c;}else{nr=n-1-c;nc=r;}
    out[nr*n+nc]=g[r*n+c];}
  return out;}
function readFmt(row,W,b){const maxs=(1<<b)-1;
  for(let c=0;c<8;c++)if(row[c]!==(SYNC[c]?maxs:0))return null;
  const fs=FMTS(b);const words=[];
  for(let rep=0;rep<3;rep++){let fw=0;
    for(let j=0;j<fs;j++){const col=8+rep*fs+j;if(col>=W)return null;const s=row[col]&maxs;
      for(let i=0;i<b;i++){const bp=15-(j*b+i);if(bp>=0)fw|=((s>>(b-1-i))&1)<<bp;}}
    words.push(fw);}
  if(words[0]!==words[1]||words[1]!==words[2])return null;
  return words[0];}

function grayThr(rgba,w,h){const g=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=lumOf(rgba[i*4],rgba[i*4+1],rgba[i*4+2]);return {g,thr:otsu(g,w,h)};}
function decode(rgba,w,h){
  const {g,thr}=grayThr(rgba,w,h);
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(g[y*w+x]<=thr){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return {ok:false};
  return decodeBBox(rgba,w,h,x0,y0,x1,y1);
}
/* encontra TODOS os blocos (componentes conexos escuros) e decodifica cada um */
function decodeMulti(rgba,w,h){
  const {g,thr}=grayThr(rgba,w,h);
  const seen=new Uint8Array(w*h),stack=new Int32Array(w*h),frames=[];
  for(let s=0;s<w*h;s++){
    if(seen[s]||g[s]>thr)continue;
    let sp=0;stack[sp++]=s;seen[s]=1;
    let x0=w,y0=h,x1=-1,y1=-1,cnt=0;
    while(sp>0){const p=stack[--sp],px=p%w,py=(p/w)|0;cnt++;
      if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      let q;
      if(px>0){q=p-1;if(!seen[q]&&g[q]<=thr){seen[q]=1;stack[sp++]=q;}}
      if(px<w-1){q=p+1;if(!seen[q]&&g[q]<=thr){seen[q]=1;stack[sp++]=q;}}
      if(py>0){q=p-w;if(!seen[q]&&g[q]<=thr){seen[q]=1;stack[sp++]=q;}}
      if(py<h-1){q=p+w;if(!seen[q]&&g[q]<=thr){seen[q]=1;stack[sp++]=q;}}
    }
    const bw=x1-x0+1,bh=y1-y0+1;
    if(cnt<150||bw<40||bh<40)continue;
    const r=decodeBBox(rgba,w,h,x0,y0,x1,y1);
    if(r&&r.ok)frames.push(r);
  }
  return {ok:frames.length>0,frames};
}
function decodeBBox(rgba,w,h,x0,y0,x1,y1){
  const bw=x1-x0+1,bh=y1-y0+1;
  let found=null;
  for(const n of SIZES){
    const pxX=bw/n,pxY=bh/n;
    // amostra cores da grade n x n
    const cols=new Uint8Array(n*n*3);
    for(let r=0;r<n;r++){const cy=Math.min(h-1,Math.max(0,Math.floor(y0+(r+0.5)*pxY)));
      for(let c=0;c<n;c++){const cx=Math.min(w-1,Math.max(0,Math.floor(x0+(c+0.5)*pxX)));
        const o=(cy*w+cx)*4,d=(r*n+c)*3;cols[d]=rgba[o];cols[d+1]=rgba[o+1];cols[d+2]=rgba[o+2];}}
    for(const cm of [0,1,2]){
      const b=bps(cm),pal=PAL[cm];
      const sym0=new Uint8Array(n*n);
      for(let i=0;i<n*n;i++)sym0[i]=classify([cols[i*3],cols[i*3+1],cols[i*3+2]],pal);
      const W=interior(n);
      for(let o=0;o<4;o++){
        const sym=rotGrid(sym0,n,o);
        // linha de formato = linha 0 do interior (descontando borda)
        const row=new Uint8Array(W);
        for(let c=0;c<W;c++)row[c]=sym[(BORDER)*n+(BORDER+c)];
        const fw=readFmt(row,W,b);
        if(fw===null)continue;
        const u=fmtUnpack(fw);
        if(u.n!==n||u.cm!==cm)continue;
        found={n,cm,o,nsym:u.nsym,nb:u.nb,sym,W,b};break;
      }
      if(found)break;
    }
    if(found)break;
  }
  if(!found)return {ok:false};
  const {n,cm,nsym,nb,sym,W,b}=found,k=255-nsym;
  // le bits do payload (linhas 2..W-1 do interior)
  const totalBits=(W-2)*W*b,bits=new Uint8Array(totalBits);let bi=0;
  for(let r=2;r<W;r++)for(let c=0;c<W;c++){const v=sym[(BORDER+r)*n+(BORDER+c)]&((1<<b)-1);
    for(let bb=0;bb<b;bb++)if(bi<totalBits)bits[bi++]=(v>>(b-1-bb))&1;}
  const cw=new Uint8Array(nb*255);
  for(let i=0;i<nb*255;i++){let byte=0;for(let bb=0;bb<8;bb++){const t=i*8+bb;if(t<totalBits)byte=(byte<<1)|bits[t];else byte<<=1;}cw[i]=byte&255;}
  // des-interleava + RS por bloco
  const msg=new Uint8Array(nb*k);let corr=0;
  for(let bl=0;bl<nb;bl++){
    const block=new Uint8Array(255);
    for(let i=0;i<k;i++)block[i]=cw[i*nb+bl];
    for(let i=0;i<nsym;i++)block[k+i]=cw[k*nb+i*nb+bl];
    const r=rsCorrect(block,nsym,k);
    if(!r.ok)return {ok:false};
    corr=Math.max(corr,r.corr);
    msg.set(r.data,bl*k);
  }
  // valida cabecalho
  if(msg[0]!==MAGIC0||msg[1]!==MAGIC1||msg[2]!==VERSION)return {ok:false};
  const hc=(msg[22]<<8)|msg[23];if(crc16(msg.subarray(0,22))!==hc)return {ok:false};
  const dl=(msg[20]<<8)|msg[21];
  const nameLen=msg[HDR],extra=1+nameLen;
  if(dl>nb*k-HDR-extra-4)return {ok:false};
  const cpos=HDR+extra+dl;
  const crc=((msg[cpos]<<24)|(msg[cpos+1]<<16)|(msg[cpos+2]<<8)|msg[cpos+3])>>>0;
  if(crc32(msg.subarray(0,cpos))!==crc)return {ok:false};
  const frameIndex=((msg[12]<<24)|(msg[13]<<16)|(msg[14]<<8)|msg[15])>>>0;
  const totalFrames=((msg[16]<<24)|(msg[17]<<16)|(msg[18]<<8)|msg[19])>>>0;
  let nm='';try{nm=new TextDecoder().decode(msg.slice(HDR+1,HDR+1+nameLen));}catch(_){}
  return {ok:true,info:{fileId:msg.slice(4,12),frameIndex,totalFrames,n,cm,nsym,name:nm},
    data:msg.slice(HDR+extra,HDR+extra+dl),corrected:corr};
}

function framesFor(size,n,cm,nsym){const m=dataMax(n,cm,nsym);return m<=0?0:Math.ceil(size/m);}
const PRESETS=[
  {name:'Seguro',n:96,cm:0,nsym:32},{name:'Padrão',n:160,cm:1,nsym:32},
  {name:'Rápido',n:192,cm:1,nsym:24},{name:'Máximo',n:224,cm:2,nsym:16}
];
for(const p of PRESETS)p.bytes=dataMax(p.n,p.cm,p.nsym);

const MC={SIZES,NSYM,META,bps,dataMax,nblocksFor,framesFor,fileId,render,decode,decodeMulti,decodeBBox,PRESETS,
  interior,FMTS:b=>Math.ceil(16/b)};
if(typeof module!=='undefined'&&module.exports)module.exports=MC;
else root.MC=MC;
})(typeof self!=='undefined'?self:this);

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const PRESETS=MC.PRESETS, META=MC.META;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hex=a=>Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');

/* checksum FNV-1a em fluxo (nao carrega o arquivo inteiro) */
async function streamChecksum(file){
  let h=2166136261>>>0;const CH=1<<20;let off=0;
  while(off<file.size){
    const buf=new Uint8Array(await file.slice(off,Math.min(file.size,off+CH)).arrayBuffer());
    for(let i=0;i<buf.length;i++){h^=buf[i];h=Math.imul(h,16777619)>>>0;}
    off+=CH;
  }
  return h>>>0;
}

/* ---------- abas ---------- */
function tab(w){
  $('t-tx').classList.toggle('on',w==='tx');$('t-rx').classList.toggle('on',w==='rx');

/* ---------- presets ---------- */
PRESETS.forEach((p,i)=>{const o=document.createElement('option');o.value=i;

  $('preset').appendChild(o);});
$('preset').value=1;

/* ---------- TX ---------- */
let txRun=false;
function fmtMB(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';}
function updateTxInfo(){
  const files=collectFiles();
  if(!files.length){$('txinfo').textContent='Escolha um arquivo ou pasta.';return;}
  const p=PRESETS[+$('preset').value];

  for(const f of files){size+=f.file.size;total+=MC.framesFor(f.file.size,p.n,p.cm,p.nsym);}
  $('txinfo').innerHTML=`<span class="big">${files.length} arquivo(s)</span> · ${fmtMB(size)}<br>${total} quadro(s) no total · ~${p.bytes} B/quadro`;
}
let dropped=[];
function collectFiles(){
  const out=[];
  for(const f of dropped)out.push({name:f.name,path:f.webkitRelativePath||f.name,file:f});
  const ff=$('file').files; for(const f of ff)out.push({name:f.name,path:f.name,file:f});
  const df=$('folder').files;
  if(df&&df.length)for(const f of df)out.push({name:f.name,path:f.webkitRelativePath||f.name,file:f});

}
$('file').onchange=()=>{$('folder').value='';updateTxInfo();capInfo();};
$('folder').onchange=()=>{$('file').value='';updateTxInfo();};

function drawFrame(R){
  const cv=$('cv'),s=R.side;cv.width=s;cv.height=s;
  const ctx=cv.getContext('2d'),id=ctx.createImageData(s,s);
  for(let i=0;i<s*s;i++){id.data[i*4]=R.img[i*3];id.data[i*4+1]=R.img[i*3+1];id.data[i*4+2]=R.img[i*3+2];id.data[i*4+3]=255;}
  ctx.putImageData(id,0,0);
}
$('start').onclick=async()=>{
  const files=collectFiles();
  if(!files.length){alert('Escolha um arquivo ou pasta primeiro.');return;}
  const p=PRESETS[+$('preset').value];
  $('txinfo').textContent='Preparando (checksum)…';
  // metadados + fileId por arquivo (checksum em fluxo)
  const items=[];
  for(const f of files){
    const sha=await streamChecksum(f.file);
    items.push({...f,sha,fileId:MC.fileId(f.path,f.file.size),total:MC.framesFor(f.file.size,p.n,p.cm,p.nsym)});
  }
  // lista de tarefas (leve): meta + quadros de cada arquivo
  const tasks=[];
  items.forEach((it,fi)=>{
    const meta=JSON.stringify({v:1,name:it.name,path:it.path,size:it.file.size,sha:it.sha,fi,tf:items.length});
    tasks.push({kind:'meta',it,meta});
    for(let i=0;i<it.total;i++)tasks.push({kind:'data',it,idx:i});
  });
  $('txview').classList.remove('hide');$('start').classList.add('hide');$('stop').classList.remove('hide');
  txRun=true;let k=0;
  const enc=new TextEncoder();
  while(txRun){
    const t=tasks[k%tasks.length];
    let R;
    if(t.kind==='meta'){
      R=MC.render(p,t.it.fileId,META,t.it.total,enc.encode(t.meta),6,4,t.it.name);
      $('txstat').innerHTML=`<b>${t.it.path}</b> · metadados`;
    }else{
      const off=t.idx*p.bytes,end=Math.min(t.it.file.size,off+p.bytes);
      const chunk=new Uint8Array(await t.it.file.slice(off,end).arrayBuffer());
      R=MC.render(p,t.it.fileId,t.idx,t.it.total,chunk,6,4,t.it.name);
      $('txstat').innerHTML=`<b>${t.it.path}</b> · quadro ${t.idx+1}/${t.it.total}`;
    }
    if(R)drawFrame(R);
    k++;await sleep(90);
  }
};
$('stop').onclick=()=>{txRun=false;$('start').classList.remove('hide');$('stop').classList.add('hide');};

/* ---------- Gerar PNG (P&B, varios blocos; resolucao configuravel) ---------- */
const sleep0=ms=>new Promise(r=>setTimeout(r,ms));
function fmtKB(b){return b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';}
function sheetLayout(px,W,H){const n=96,quiet=4,bp=(n+2*quiet)*px;
  return {n,cm:0,nsym:32,quiet,bp,W,H,cols:Math.max(1,Math.floor(W/bp)),rows:Math.max(1,Math.floor(H/bp)),
    get bpi(){return this.cols*this.rows;},cap:MC.dataMax(n,0,32)};}
function drawBlockTo(ctx,R,ox,oy){const s=R.side,tmp=document.createElement('canvas');tmp.width=s;tmp.height=s;
  const t=tmp.getContext('2d'),id=t.createImageData(s,s);
  for(let i=0;i<s*s;i++){id.data[i*4]=R.img[i*3];id.data[i*4+1]=R.img[i*3+1];id.data[i*4+2]=R.img[i*3+2];id.data[i*4+3]=255;}
  t.putImageData(id,0,0);ctx.drawImage(tmp,ox,oy);}
function exportSheet(cv,name){const url=cv.toDataURL('image/png');
  if(window.MegaCodeNative&&window.MegaCodeNative.saveFile){window.MegaCodeNative.saveFile(name,url);return 'salvo';}
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();return 'baixado';}
function readGenOpts(){const v=($('res')&&$('res').value)||'1920x1080';const p=v.split('x');
  return {px:+((($('dens')&&$('dens').value)||4)),W:+p[0],H:+p[1],
    single:!(!$('single')&&$('single').checked), grid:!(!$('grid')&&$('grid').checked)};}
async function gerarBig(f,W,H,single){
  const n=224,nsym=32,quiet=4,px=Math.max(1,Math.floor(Math.min(W,H)/(n+2*quiet)));
  const side=(n+2*quiet)*px,cap=MC.dataMax(n,0,nsym);
  const dataFrames=Math.max(1,Math.ceil(f.size/cap)),images=dataFrames;
  if(single&&dataFrames>1)return {tooBig:true,maxBytes:cap,images};
  const fid=MC.fileId(f.name,f.size),enc=new TextEncoder();
  const _ext=(n=>{const i=n.lastIndexOf('.');return i>0?n.slice(i+1):'';})(f.name);const meta=JSON.stringify({v:1,name:f.name,path:f.name,size:f.size,ext:_ext,fi:0,tf:1});
  const base=(f.name.replace(/\.[^.]+$/,'')||'arquivo');
  let first=null,modo='';
  const ox=Math.max(0,Math.floor((W-side)/2)),oy=Math.max(0,Math.floor((H-side)/2));
  for(let img=0;img<images;img++){
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d');if(!ctx)throw new Error('resolução grande demais para o canvas');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let R;
    {const di=img,off=di*cap,end=Math.min(f.size,off+cap);
      const chunk=new Uint8Array(await f.slice(off,end).arrayBuffer());
      R=MC.render({n,cm:0,nsym},fid,di,dataFrames,chunk,px,quiet,f.name);}
    if(R)drawBlockTo(ctx,R,ox,oy);
    modo=exportSheet(cv,base+'_megacode_'+String(img).padStart(4,'0')+'.png');
    if(img===0)first=cv;
    $('txinfo').textContent='Gerando… '+(img+1)+'/'+images;
    await sleep0(30);
  }
  return {first,images,dataFrames,bpi:1,modo,W,H};
}
function capInfo(){if(!$('res'))return;const o=readGenOpts(),L=sheetLayout(o.px,o.W,o.H);
  const perImg=(L.bpi-1)*L.cap,f=$('file').files[0];let need='';
  if(f){const imgs=Math.ceil((1+Math.max(1,Math.ceil(f.size/L.cap)))/L.bpi);
    need=` · seu arquivo: <b>${imgs}</b> imagem(ns)`;}
  $('txinfo').innerHTML=`${o.W}×${o.H} · ${L.cols}×${L.rows} = <b>${L.bpi}</b> blocos/imagem · ~<b>${fmtKB(perImg)}</b> úteis por imagem${need}`;}
async function gerarPNG(f,px,W,H,single){
  const L=sheetLayout(px,W,H),fid=MC.fileId(f.name,f.size);
  const dataFrames=Math.max(1,Math.ceil(f.size/L.cap)),totalBlocks=1+dataFrames;
  const images=Math.ceil(totalBlocks/L.bpi);
  if(single&&images>1)return {tooBig:true,maxBytes:(L.bpi-1)*L.cap,images};
  const enc=new TextEncoder();
  const _ext=(n=>{const i=n.lastIndexOf('.');return i>0?n.slice(i+1):'';})(f.name);const meta=JSON.stringify({v:1,name:f.name,path:f.name,size:f.size,ext:_ext,fi:0,tf:1});
  const base=(f.name.replace(/\.[^.]+$/,'')||'arquivo');
  let first=null,modo='';
  for(let img=0;img<images;img++){
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d');
    if(!ctx)throw new Error('resolução grande demais para o canvas deste dispositivo');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    for(let b=0;b<L.bpi;b++){
      const gi=img*L.bpi+b;if(gi>=totalBlocks)break;
      const r=Math.floor(b/L.cols),c=b%L.cols,ox=c*L.bp,oy=r*L.bp;let R;
      if(gi===0)R=MC.render({n:L.n,cm:0,nsym:L.nsym},fid,MC.META,dataFrames,enc.encode(meta),px,L.quiet,f.name);
      else{const di=gi-1,off=di*L.cap,end=Math.min(f.size,off+L.cap);
        const chunk=new Uint8Array(await f.slice(off,end).arrayBuffer());
        R=MC.render({n:L.n,cm:0,nsym:L.nsym},fid,di,dataFrames,chunk,px,L.quiet,f.name);}
      if(R)drawBlockTo(ctx,R,ox,oy);
    }
    modo=exportSheet(cv,base+'_megacode_'+String(img).padStart(4,'0')+'.png');
    if(img===0)first=cv;
    $('txinfo').textContent='Gerando… '+(img+1)+'/'+images;
    await sleep0(30);
  }
  return {first,images,dataFrames,bpi:L.bpi,modo,W,H};
}
let lastGen=null;
$('genpng').onclick=async()=>{
  const items=collectFiles();
  if(!items.length){alert('Escolha um arquivo ou uma pasta.');return;}
  const o=readGenOpts();lastGen={items,o};
  let totImg=0,firstCv=null,tooBig=null,err=null;
  for(let idx=0;idx<items.length;idx++){
    const f=items[idx].file;
    $('txinfo').textContent='Gerando '+(idx+1)+'/'+items.length+': '+items[idx].name+' ('+o.W+'\u00d7'+o.H+(o.grid?' grade':' 1 c\u00f3digo')+')\u2026';
    try{
      const r=o.grid?await gerarPNG(f,o.px,o.W,o.H,o.single):await gerarBig(f,o.W,o.H,o.single);
      if(r.tooBig){tooBig=r;continue;}

    }catch(e){err=e;}
  }

  if(!totImg&&tooBig){$('txinfo').innerHTML=`<b>N\u00e3o cabe em 1 imagem</b>: cabem ~${fmtKB(tooBig.maxBytes)}, mas precisa de ${tooBig.images} imagens.<br>Desmarque \u201cimagem \u00fanica\u201d, ou aumente a resolu\u00e7\u00e3o/densidade.`;return;}
  if(firstCv){const pv=$('cv');const sc=Math.min(1,1280/o.W);pv.width=Math.max(1,Math.round(o.W*sc));pv.height=Math.max(1,Math.round(o.H*sc));pv.getContext('2d').drawImage(firstCv,0,0,pv.width,pv.height);$('txview').classList.remove('hide');}
  $('dlpng').classList.remove('hide');
  $('txinfo').innerHTML=`<b>${items.length}</b> arquivo(s) \u00b7 <b>${totImg}</b> imagem(ns) P&B geradas (${o.grid?'grade':'1 c\u00f3digo grande'}).<br>Para ler: aba Receber > Ler PNG/imagem (ou c\u00e2mera).`;
};
$('dlpng').onclick=()=>{if(lastGen){const{items,o}=lastGen;for(const it of items){o.grid?gerarPNG(it.file,o.px,o.W,o.H,o.single):gerarBig(it.file,o.W,o.H,o.single);}}};
if($('res'))$('res').onchange=capInfo;
if($('dens'))$('dens').onchange=capInfo;
if($('single'))$('single').onchange=capInfo;

/* ---------- Drag & drop (varios arquivos) ---------- */
function wireDrop(){
  const el=$('drop'); if(!el)return;
  const act=e=>{e.preventDefault();e.stopPropagation();};
  ['dragover','dragenter'].forEach(ev=>el.addEventListener(ev,e=>{act(e);el.style.background='#24405f';el.style.color='#fff';}));
  ['dragleave','dragend'].forEach(ev=>el.addEventListener(ev,e=>{act(e);el.style.background='';el.style.color='';}));
  el.addEventListener('drop',e=>{act(e);el.style.background='';el.style.color='';
    dropped=Array.from(e.dataTransfer.files);
    if(dropped.length){if($('file'))$('file').value='';if($('folder'))$('folder').value='';updateTxInfo();if(typeof capInfo==='function')capInfo();}});
}
/* ---------- RX ---------- */
let stream=null,rxLoop=null;
const rx=new Map(); // fileIdHex -> {meta,parts,total,got,done,out}
function rxProgress(){
  let got=0,total=0;
  for(const e of rx.values()){got+=e.got;total+=e.total;}
  const pct=total?Math.round(got/total*100):0;
  $('rxbar').style.width=pct+'%';
  return {got,total,pct};
}
function onFrame(D){
  const inf=D.info,key=hex(inf.fileId);
  let e=rx.get(key);
  if(inf.frameIndex===META){
    let meta=null;try{meta=JSON.parse(new TextDecoder().decode(D.data));}catch(_){}
    if(!meta)return;
    if(!e){e={meta,parts:[],total:Math.max(1,Math.ceil(meta.size/1)),got:0,done:false};rx.set(key,e);}
    e.meta=meta; if(inf.name)e.hname=inf.name;
    const p=PRESETS.find(x=>x.n===inf.n&&x.cm===inf.cm&&x.nsym===inf.nsym)||PRESETS[1];
    e.total=Math.max(1,Math.ceil(meta.size/p.bytes));
    if(e.parts.length<e.total){const np=new Array(e.total).fill(null);for(let i=0;i<e.parts.length;i++)np[i]=e.parts[i];e.parts=np;}
    e.got=e.parts.filter(x=>x!==null).length;
    refresh();return;
  }
  if(!e){e={meta:null,parts:[],total:inf.totalFrames,got:0,done:false};rx.set(key,e);}
  if(inf.name&&!e.hname)e.hname=inf.name;
  if(inf.totalFrames>e.total)e.total=inf.totalFrames;
  if(e.parts.length<e.total){const np=new Array(e.total).fill(null);for(let i=0;i<e.parts.length;i++)np[i]=e.parts[i];e.parts=np;}
  if(e.parts[inf.frameIndex]===null){e.parts[inf.frameIndex]=D.data;e.got++;}
  if(e.total>0&&e.got>=e.total&&!e.done){e.done=true;assemble(e);}
  refresh();
}
function refresh(){
  const {got,total,pct}=rxProgress();
  let doneN=0;for(const e of rx.values())if(e.done)doneN++;
  $('rxstat').innerHTML=`Recebido: ${got}/${total} quadros (${pct}%) · ${doneN} arquivo(s) completo(s)`;
  if(doneN>0)$('save').classList.remove('hide');
}
function assemble(e){
  let size=0;for(let i=0;i<e.total;i++)if(e.parts[i])size+=e.parts[i].length;
  const out=new Uint8Array(size);let w=0;
  for(let i=0;i<e.total;i++){if(e.parts[i]){out.set(e.parts[i],w);w+=e.parts[i].length;}}
  e.out=out;
}
$('cam').onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('vid');v.srcObject=stream;await v.play();v.classList.remove('hide');
    const rc=$('rcv'),ctx=rc.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(v.readyState>=2&&v.videoWidth){
        const w=v.videoWidth,h=v.videoWidth? v.videoHeight:1;
        const sc=Math.min(1,720/Math.max(w,h)),cw=Math.round(w*sc),ch=Math.round(h*sc);
        rc.width=cw;rc.height=ch;ctx.drawImage(v,0,0,cw,ch);
        const R=MC.decodeMulti(ctx.getImageData(0,0,cw,ch).data,cw,ch);
        if(R&&R.ok)for(const D of R.frames)onFrame(D);
      }
      rxLoop=requestAnimationFrame(tick);
    };

  }catch(err){$('rxstat').textContent='Erro na câmera: '+err.message;}
};
function stopCam(){if(rxLoop){cancelAnimationFrame(rxLoop);rxLoop=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$('vid').classList.add('hide');}
$('imp').onclick=()=>$('impfile').click();
$('impfile').onchange=ev=>{
  const files=Array.from(ev.target.files); if(!files.length)return;

    if(done===files.length){
      const {pct}=rxProgress();
      $('rxstat').innerHTML=`${files.length} imagem(ns) lida(s): ${totBlocks} bloco(s) novos · progresso total ${pct}%.`+
        (pct<100?' Importe as próximas imagens (ou use a câmera).':'');
    }};
  for(const f of files){
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const cv=$('rcv');cv.width=img.width;cv.height=img.height;
        const ctx=cv.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0);
        let R=null;try{R=MC.decodeMulti(ctx.getImageData(0,0,img.width,img.height).data,img.width,img.height);}catch(e){}
        if(R&&R.ok){for(const D of R.frames)onFrame(D);totBlocks+=R.frames.length;}
        finish();
      };
      img.onerror=finish;
      img.src=fr.result; // data: URL nao contamina o canvas (funciona em file://)
    };
    fr.readAsDataURL(f);
  }
  ev.target.value='';
};
$('save').onclick=()=>{
  let n=0;
  for(const e of rx.values()){
    if(!e.done||!e.out)continue;
    const name=(e.meta&&(e.meta.name||e.meta.path))||e.hname||('megacode'+n+'.bin');
    if(window.MegaCodeNative&&window.MegaCodeNative.saveFile){
      let bin='';const CH=0x8000;
      for(let i=0;i<e.out.length;i+=CH)bin+=String.fromCharCode.apply(null,e.out.subarray(i,i+CH));
      window.MegaCodeNative.saveFile(name,btoa(bin));
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([e.out],{type:'application/octet-stream'}));
      a.download=name;document.body.appendChild(a);a.click();a.remove();
    }
    n++;
  }
  $('rxstat').innerHTML=n?`Salvo ${n} arquivo(s).`:'Nada completo para salvar.';
};
wireDrop();
})();
