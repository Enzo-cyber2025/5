[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flcodes"
version = "1.0.0"
description = "Family Link parent access code generator for authorised security testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "Proprietary - experiment artifact, do not redistribute" }

[project.scripts]
flcodes = "flcodes.cli:main"

[tool.setuptools]
packages = ["flcodes"]
include-package-data = true

[tool.setuptools.package-data]
flcodes = ["web/*.html"]
