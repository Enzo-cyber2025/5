# ─────────────────────────────────────────────────────────────────────────────
# LocalAI – GitHub Actions workflow that compiles the APK (CPU and Vulkan).
#
# The Arena bot token cannot commit files under `.github/workflows/` (a GitHub
# App needs a separate "workflows" permission), so this file lives in `ci/`.
# TO ENABLE AUTOMATED APK BUILDS: copy it into your repo as
#     .github/workflows/build-apk.yml
# then push and run it (Actions tab → build-apk → Run workflow), or commit it.
#
# It builds :app:assembleDebug, uploads it as an artifact and also publishes a
# raw copy to the triggering branch under `keep/localai-<variant>.apk`, giving
# a direct, no-login download link like:
#   https://github.com/<owner>/<repo>/raw/<branch>/keep/localai-cpu.apk
# ─────────────────────────────────────────────────────────────────────────────
name: build-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # cpu    -> official llama.cpp CPU backend (always builds)
        # vulkan -> experimental GPU backend (needs Vulkan SDK on the host)
        include:
          - variant: cpu
            ggmlVulkan: "false"
          - variant: vulkan
            ggmlVulkan: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout llama.cpp (pinned, for the native build)
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp checkout 9e0e220594af405a62835dc3a27495729fd8506b

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK / NDK / CMake
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Pre-install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" > /dev/null

      - name: Install Vulkan SDK (glslc + SPIRV-Headers) [vulkan only]
        if: matrix.ggmlVulkan == 'true'
        uses: lunarg/vulkan-sdk@v1
        with:
          version: latest
          cache: true

      - name: Build debug APK (${{ matrix.variant }})
        run: |
          ./gradlew :app:assembleDebug \
            -PggmlVulkan=${{ matrix.ggmlVulkan }} \
            --no-daemon --stacktrace

      - name: Show build outputs
        run: ls -la app/build/outputs/apk/debug/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: localai-${{ matrix.variant }}-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to branch (public raw download)
        if: success()
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          mkdir -p keep
          cp app/build/outputs/apk/debug/app-debug.apk "keep/localai-${{ matrix.variant }}.apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "keep/localai-${{ matrix.variant }}.apk"
          git commit -m "chore: publish ${{ matrix.variant }} APK [skip ci]" || true
          git push origin "HEAD:${BRANCH}" || echo "push skipped / raced"
